<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico preliminar — Cuatro preguntas para el salón</title>
<style>
/* ============================================================
   TOKENS
   Estructura tomada del deck de cierre del tamizaje
   (4-Tamizaje-SRQ-debate.html): los dos son recursos de
   proyección y se manejan igual. Lo que cambia es el acento,
   que acá es el de la Fase I en la página de lineamientos de
   programas de promoción en salud — esta actividad es su
   antesala, no un tema aparte.
   ============================================================ */
:root{
  --bg:#ffffff;
  --surface:#faf7f0;
  --surface-alt:#f3ede2;
  --border:#e4ddd0;
  --ink:#201d18;
  --ink-soft:#5c5648;
  --ink-faint:#8a8272;
  --accent:#cd4a60;
  --accent-dark:#8f2d3f;
  --accent-soft:#fbeef0;
  --font-display:"Spectral","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:14px;
  --shadow-card:0 1px 2px rgba(32,29,24,0.04), 0 6px 22px rgba(32,29,24,0.07);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink);}

/* ============================================================
   PORTADA
   ============================================================ */
.wrap{
  max-width:1180px; margin:0 auto;
  padding:clamp(30px,6vh,64px) 32px 80px;
  min-height:100vh;
  display:flex; flex-direction:column; justify-content:center;
}

.globos{
  display:grid;
  grid-template-columns:repeat(2,minmax(300px,1fr));
  gap:38px 30px;
}

/* Con un número impar de globos el último quedaría solo contra el margen
   izquierdo. Se lo pasa a fila completa y se lo centra. */
.globos > .globo:last-child:nth-child(odd){
  grid-column:1 / -1;
  justify-self:center;
  width:calc(50% - 15px);
}

@media (max-width:820px){
  .globos{grid-template-columns:1fr; gap:32px 0;}
  .globos > .globo:last-child:nth-child(odd){grid-column:auto; width:100%;}
}

.globo{
  position:relative;
  display:block; width:100%; text-align:left;
  font-family:var(--font-display);
  font-size:clamp(19px,1.85vw,23px);
  line-height:1.34; letter-spacing:-.005em;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  padding:26px 26px 30px;
  cursor:pointer;
  box-shadow:var(--shadow-card);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.globo:hover, .globo:focus-visible{
  transform:translateY(-3px);
  box-shadow:0 2px 4px rgba(32,29,24,.05), 0 14px 30px rgba(32,29,24,.11);
  background:var(--bg);
  outline:none;
}
.globo:focus-visible{border-color:var(--accent);}

/* La colita del bocadillo. Dos capas: el borde y el relleno encima. */
.globo::before, .globo::after{
  content:""; position:absolute; left:34px; width:0; height:0;
  border-style:solid;
}
.globo::before{
  bottom:-15px;
  border-width:15px 15px 0 0;
  border-color:var(--border) transparent transparent transparent;
}
.globo::after{
  bottom:-13px;
  border-width:13px 13px 0 0;
  border-color:var(--surface) transparent transparent transparent;
  transition:border-top-color .16s ease;
}
.globo:hover::after, .globo:focus-visible::after{border-top-color:var(--bg);}

.globo .num{
  display:block;
  font-family:var(--font-body);
  font-size:11.5px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
  color:var(--accent); margin-bottom:13px;
}
.globo .pie{
  display:block; margin-top:16px;
  font-family:var(--font-body);
  font-size:12.5px; font-weight:500; color:var(--ink-faint);
}

/* La tarjeta de cierre no es una pregunta al salón: sin colita y con el
   borde en el acento, para que se lea como otra cosa. */
.globo.utilitaria{
  background:var(--bg);
  border-color:var(--accent-soft);
  border-width:2px;
}
.globo.utilitaria::before, .globo.utilitaria::after{display:none;}

/* ============================================================
   VISTA DE PROYECCIÓN
   ============================================================ */
.escena{
  position:fixed; inset:0; z-index:50;
  background:var(--bg);
  display:none;
  flex-direction:column;
}
.escena.abierta{display:flex;}

.escena-barra{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 26px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.escena-barra .cuenta{
  font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint);
}
.escena-barra .btns{display:flex; align-items:center; gap:8px;}
.bt{
  font-family:var(--font-body); font-size:13.5px; font-weight:600;
  color:var(--ink-soft); background:var(--bg);
  border:1px solid var(--border); border-radius:8px;
  padding:7px 14px; cursor:pointer;
  transition:background .14s, color .14s, border-color .14s;
}
.bt:hover{background:var(--surface-alt); color:var(--ink);}
.bt.primario{background:var(--accent); border-color:var(--accent); color:#fff;}
.bt.primario:hover{background:var(--accent-dark); border-color:var(--accent-dark); color:#fff;}

.escena-cuerpo{
  flex:1 1 auto; overflow-y:auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:clamp(24px,4vh,56px) clamp(20px,5vw,64px) 40px;
}
.escena-inner{width:100%; max-width:1000px;}

/* Etapa 1: la pregunta sola, mientras el grupo la responde en la hoja. */
.q-texto{
  font-family:var(--font-display);
  font-size:clamp(28px,3.9vw,50px);
  line-height:1.2; letter-spacing:-.015em;
  color:var(--ink);
  max-width:24ch;
  transition:font-size .22s ease, max-width .22s ease;
}
.q-texto.ancha{max-width:30ch;}

/* Etapa 2: ya se respondió y se discutió. La pregunta baja a encabezado y
   el cuerpo deja de centrarse verticalmente — si no, con contenido más
   alto que la pantalla la primera línea queda fuera del scroll. */
.escena.revelado .escena-cuerpo{justify-content:flex-start;}
.escena.revelado .q-texto,
.escena.revelado .q-texto.ancha{
  font-size:clamp(20px,2.2vw,29px);
  max-width:46ch;
  color:var(--ink-soft);
}

.revelar-zona{margin-top:clamp(28px,5vh,52px);}
.revelar-zona .nota{
  margin-top:14px; font-size:13px; color:var(--ink-faint); max-width:52ch;
}

/* Etapa 2: la puesta en común. */
.explica{
  margin-top:clamp(26px,4vh,44px);
  padding-top:clamp(24px,3.5vh,38px);
  border-top:1px solid var(--border);
}
.explica[hidden]{display:none;}

.idea{
  font-family:var(--font-display);
  font-size:clamp(21px,2.5vw,31px);
  line-height:1.32; letter-spacing:-.01em;
  color:var(--accent-dark);
  background:var(--accent-soft);
  border-radius:var(--radius);
  padding:22px 26px;
  max-width:44ch;
}

.porque{margin-top:clamp(22px,3vh,32px);}
.porque ul{margin:0; padding:0; list-style:none;}
.porque li{
  position:relative;
  padding-left:26px; margin-bottom:15px;
  font-size:clamp(16px,1.7vw,21px);
  line-height:1.5; color:var(--ink-soft);
  max-width:76ch;
}
.porque li:last-child{margin-bottom:0;}
.porque li::before{
  content:""; position:absolute; left:6px; top:.62em;
  width:7px; height:7px; border-radius:50%; background:var(--accent);
}
.porque li strong{color:var(--ink); font-weight:600;}

/* El puente con la Fase I: cada pregunta es uno de sus cuatro puntos, y
   los ítems son los que la rúbrica va a evaluar el 4 de septiembre. */
.punto{
  margin-top:clamp(26px,3.6vh,38px);
  border:1px solid var(--border);
  border-left:4px solid var(--accent);
  border-radius:var(--radius);
  background:var(--surface);
  padding:20px 24px;
  max-width:76ch;
}
.punto .punto-r{
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent);
}
.punto .punto-t{
  font-family:var(--font-display);
  font-size:clamp(18px,2vw,26px); line-height:1.22;
  margin-top:6px; color:var(--ink);
}
.punto .punto-items{
  display:flex; flex-wrap:wrap; gap:7px;
  margin-top:14px;
}
.punto .punto-items span{
  padding:6px 12px; border-radius:999px;
  background:var(--bg); border:1px solid var(--border);
  font-size:clamp(12.5px,1.3vw,14.5px); font-weight:500; color:var(--ink-soft);
}

/* --- Panel de cierre --------------------------------------------- */
.panel-cierre[hidden]{display:none;}
.banda{
  font-size:clamp(13px,1.35vw,16px); color:var(--ink-soft);
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 18px; margin-bottom:22px;
}
.banda strong{color:var(--ink);}

.cadena{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}
.paso{
  position:relative;
  border-top:3px solid var(--accent);
  padding:14px 12px 0 0;
}
.paso .paso-n{
  font-size:11px; font-weight:700; letter-spacing:.15em;
  color:var(--accent); text-transform:uppercase;
}
.paso .paso-t{
  font-family:var(--font-display);
  font-size:clamp(19px,2.2vw,28px); line-height:1.2;
  margin-top:6px; color:var(--ink);
}
.paso .paso-r{
  margin-top:10px;
  font-size:clamp(12.5px,1.3vw,15px); line-height:1.45;
  color:var(--ink-soft);
}
.paso:not(:last-child)::after{
  content:"→";
  position:absolute; right:-4px; top:-2px;
  transform:translateY(-55%);
  font-size:20px; line-height:1; color:var(--accent);
}
@media (max-width:820px){
  .cadena{grid-template-columns:1fr; gap:20px;}
  .paso:not(:last-child)::after{content:"↓"; right:auto; left:0; top:auto; bottom:-18px; transform:none;}
}

.regla{
  margin-top:clamp(26px,4vh,40px);
  font-family:var(--font-display);
  font-size:clamp(20px,2.4vw,30px); line-height:1.32;
  color:var(--accent-dark); background:var(--accent-soft);
  border-radius:var(--radius); padding:24px 28px;
  max-width:58ch;
}

@media print{
  .escena{display:none !important;}
  .globo{break-inside:avoid; box-shadow:none;}
}
</style>
</head>
<body>

<div class="wrap" id="portada">
  <div class="globos" id="globos"></div>
</div>

<!-- ============================================================
     Vista de proyección
     ============================================================ -->
<div class="escena" id="escena" role="dialog" aria-modal="true" aria-labelledby="q-texto">
  <div class="escena-barra">
    <div class="cuenta" id="cuenta"></div>
    <div class="btns">
      <button class="bt" id="bt-ant" title="Anterior (←)">← Anterior</button>
      <button class="bt" id="bt-sig" title="Siguiente (→)">Siguiente →</button>
      <button class="bt" id="bt-cerrar" title="Volver a la cuadrícula (Esc)">Cerrar</button>
    </div>
  </div>

  <div class="escena-cuerpo" id="escena-cuerpo">
    <div class="escena-inner">
      <div class="q-texto" id="q-texto"></div>

      <div class="revelar-zona" id="revelar-zona">
        <button class="bt primario" id="bt-revelar">Puesta en común</button>
        <div class="nota">Se presiona cuando los grupos ya escribieron su respuesta.</div>
      </div>

      <div class="explica" id="explica" hidden>
        <div class="idea" id="idea"></div>
        <div class="porque"><ul id="porque"></ul></div>
        <div class="punto" id="punto">
          <div class="punto-r" id="punto-r"></div>
          <div class="punto-t" id="punto-t"></div>
          <div class="punto-items" id="punto-items"></div>
        </div>
      </div>

      <!-- Cierre: qué queda armado y qué falta -->
      <div class="panel-cierre" id="panel-cierre" hidden>
        <div class="banda" id="banda"></div>
        <div class="cadena" id="cadena"></div>
        <div class="regla" id="regla"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   LAS CUATRO PREGUNTAS

   El criterio de selección no es temático: es estructural. La Fase I
   tiene cuatro puntos —contextualización, priorización del problema,
   evaluación y tamizaje, diseño del programa— y acá hay una pregunta
   por punto, en ese mismo orden. Un grupo que responde las cuatro en
   serio sale del salón con el esqueleto de lo que presenta el 4 de
   septiembre; y donde no pueda responder, ahí está lo que le falta
   averiguar en el sitio.

   Por eso no se reordenan ni se agregan. Cada pregunta cubre un punto
   completo y ninguna cubre dos: si se parte alguna en dos, se rompe la
   correspondencia que hace que el ejercicio sirva.

   La tercera es la que decide todo lo demás: es el punto que la
   rúbrica marca como importante y el que más pesa.
   ============================================================ */
const PREGUNTAS = [
  {
    pregunta: "¿Cómo son las personas con las que van a trabajar, y qué se puede hacer —y qué no— con una población así?",
    idea: "Caracterizar no es describir: es leer qué le exige esa población al trabajo. Si después de describirla el grupo puede hacer exactamente lo mismo que iba a hacer antes, la caracterización no sirvió de nada.",
    porque: [
      "Un niño, un adulto mayor, un cuidador y un grupo familiar <strong>no admiten el mismo trabajo</strong>. Cambia quién es el interlocutor, cuánto puede durar una sesión, si hace falta el consentimiento de un tercero y hasta qué se puede preguntar.",
      "La decisión que se desprende de ahí es si el trabajo es <strong>individual o colectivo</strong>: valoración persona a persona, o actividad con un conglomerado. Esa decisión la impone la población, no la comodidad del grupo.",
      "Hay poblaciones que no responden por sí mismas —niños pequeños, personas con deterioro cognitivo—. Ahí el interlocutor real es el cuidador, y eso cambia de raíz qué problema se puede llegar a priorizar.",
      "La población que la institución atiende y la que ustedes pueden convocar rara vez son la misma. La que se caracteriza es la segunda, porque es sobre la que se va a intervenir.",
      "Recién después vienen las cifras: <strong>cuántos son, cada cuánto los ven y hasta cuándo</strong>. Hacen falta para dimensionar el tamizaje y el programa, pero no son la caracterización: son su consecuencia.",
      "Una variable sociodemográfica se recoge porque va a explicar algo del problema. Si no va a cambiar nada de lo que decidan después, sobra."
    ],
    punto: {
      n: "Punto 1 de la Fase I",
      t: "Contextualización de la población",
      items: ["Caracterización general", "Descripción del escenario de práctica", "Variables sociodemográficas relevantes"]
    }
  },
  {
    pregunta: "De todo lo que pasa en ese sitio, ¿cuál es el problema que van a trabajar, y por qué ese y no otro?",
    idea: "Priorizar es descartar con un criterio explícito. Un problema elegido sin decir qué se dejó afuera y por qué no está priorizado: está simplemente escogido.",
    porque: [
      "Lo que ustedes observan, lo que reportan los profesionales del sitio y lo que la institución declara como necesidad <strong>casi nunca coinciden</strong>. Esa discrepancia no es un estorbo: es el primer hallazgo del diagnóstico.",
      "Si todavía no le han preguntado a nadie del sitio, la respuesta honesta es «no lo hemos preguntado». Sirve más que una suposición, porque nombra exactamente lo que hay que resolver antes del 4 de septiembre.",
      "El problema que nombran hoy es <strong>una hipótesis, no una conclusión</strong>. Se enuncia para poder ponerla a prueba; si ya estuviera comprobada, no haría falta la fase que viene.",
      "Criterios que suelen decidir: a cuántos afecta, qué tan grave es, si el sitio lo reconoce como propio y si algo puede cambiar en el tiempo que tienen. Un problema real que ustedes no pueden mover no es el problema de este trabajo.",
      "La pregunta anterior ya descartó opciones: <strong>un problema que solo se puede trabajar de una forma que esa población no admite</strong> queda afuera, por legítimo que sea. Por eso se caracteriza antes de priorizar."
    ],
    punto: {
      n: "Punto 2 de la Fase I",
      t: "Identificación y priorización del problema",
      items: ["Problema priorizado", "Criterios de priorización", "Sustento en evidencia diagnóstica"]
    }
  },
  {
    pregunta: "¿Cómo van a demostrar que ese problema existe? Con qué instrumento, a quiénes y cuándo.",
    idea: "Esta respuesta es la Fase I. Todo lo demás se puede ajustar después; el instrumento, la población y la fecha de aplicación, no — sin ellos no hay evidencia que presentar el 4 de septiembre.",
    porque: [
      "El instrumento se elige <strong>después</strong> de la hipótesis, nunca antes. Tener un cuestionario a la mano y buscarle población produce datos que no permiten decidir nada; es exactamente lo que apareció al aplicar el tamizaje en clase.",
      "«A quiénes» tampoco es la población entera: es una <strong>población focalizada</strong>, delimitada por el riesgo que ustedes suponen. Aplicarle un instrumento a quien no tiene por qué dar positivo devuelve negativos que no dicen nada.",
      "Las condiciones de aplicación —quién administra, dónde, con qué privacidad— forman parte del dato y se reportan con él. Un resultado obtenido en un salón lleno no equivale a uno obtenido en privado.",
      "Este es el punto que la rúbrica marca como importante y el que más pesa. Un grupo que llega el 4 de septiembre sin haber aplicado nada puede sostener los otros tres puntos, pero no este."
    ],
    punto: {
      n: "Punto 3 de la Fase I",
      t: "Evaluación y tamizaje",
      items: ["Instrumentos utilizados", "Procedimiento de aplicación", "Criterios de selección", "Resultados obtenidos", "Análisis de los hallazgos"]
    }
  },
  {
    pregunta: "Si el tamizaje confirma el problema, ¿qué van a hacer con esa población, y qué necesitan que la institución les autorice?",
    idea: "Un programa que el sitio no permite ejecutar no es un programa. La viabilidad se resuelve ahora, mientras todavía se puede cambiar de plan, y no la semana de la implementación.",
    porque: [
      "El diseño se ordena con tres preguntas: <strong>qué se busca</strong> —objetivos y población objetivo—, <strong>qué se va a hacer</strong> —actividades, cronograma y recursos— y <strong>cómo se sabrá si sirvió</strong> —los indicadores—.",
      "Los indicadores se definen junto con las actividades, no al final. Si no se sabe qué se va a medir, la Fase II se convierte en un informe de lo que se hizo, sin manera de decir si funcionó.",
      "La autorización tiene <strong>nombre y cargo</strong>, y conviene saber si ya hablaron con esa persona. Un permiso que nadie ha pedido todavía es un pendiente, no un supuesto.",
      "Lo que queda descartado se escribe con su razón. Sirve en la sustentación —muestra que hubo decisión y no improvisación— y evita volver a proponer en la Fase II algo que ya se sabía imposible.",
      "La Carta de Ottawa entra acá: el programa tiene que poder señalar en cuáles de sus pilares se apoya. Si no se reconoce en ninguno, probablemente no es un programa de promoción."
    ],
    punto: {
      n: "Punto 4 de la Fase I",
      t: "Diseño del programa",
      items: ["Qué se busca: objetivos y población objetivo", "Qué se va a hacer: actividades, cronograma y recursos", "Cómo se sabrá si sirvió: indicadores y pilares de Ottawa"]
    }
  }
];

/* ============================================================
   LA TARJETA DE CIERRE

   No es una pregunta al salón. Va al final porque es lo único que no
   se puede deducir de haber respondido las cuatro: cómo se convierte
   la hoja en la presentación del 4 de septiembre, y qué parte del
   trabajo no pasa por el salón sino por el sitio.
   ============================================================ */
const CIERRE = {
  tipo: "cierre",
  rotulo: "Cierre",
  titulo: "Qué se llevan de acá",
  banda: "<strong>La hoja no se entrega ni se califica.</strong> La nota está en las dos fases: Fase I el 4 de septiembre y Fase II el 11 de septiembre.",
  pasos: [
    { t: "Deciden",   r: "Las cuatro respuestas de hoy. Lo que quedó en blanco es lo que hay que ir a averiguar al sitio." },
    { t: "Aplican",   r: "El instrumento que eligieron, a la población que delimitaron, en la semana que se fijaron." },
    { t: "Presentan", r: "Fase I, el 4 de septiembre: los cuatro puntos, ya con los resultados del tamizaje." },
    { t: "Ejecutan",  r: "Fase II, el 11 de septiembre: el programa implementado, con sus evidencias y hallazgos." }
  ],
  regla: "El grupo que hoy no pueda responder la tercera pregunta todavía no tiene Fase I: tiene una idea."
};

const TARJETAS = [
  ...PREGUNTAS.map(p => Object.assign({ tipo: "pregunta" }, p)),
  CIERRE
];

/* ============================================================
   CUADRÍCULA
   ============================================================ */
const $ = id => document.getElementById(id);
const contGlobos = $("globos");
let actual = 0;

// La numeración corre solo sobre las preguntas: el cierre lleva rótulo.
let nPregunta = 0;
TARJETAS.forEach((t, i) => {
  if (t.tipo === "pregunta") nPregunta++;
  t.rotulo = t.rotulo || ("Pregunta " + nPregunta);

  const b = document.createElement("button");
  b.className = "globo" + (t.tipo === "pregunta" ? "" : " utilitaria");
  b.type = "button";
  b.dataset.i = i;
  b.innerHTML =
    '<span class="num">' + escapar(t.rotulo) + '</span>' +
    escapar(t.tipo === "pregunta" ? t.pregunta : t.titulo) +
    (t.tipo === "pregunta"
      ? '<span class="pie">' + escapar(t.punto.n) + ' · ' + escapar(t.punto.t) + '</span>'
      : "");
  b.addEventListener("click", () => abrir(i));
  contGlobos.appendChild(b);
});
const TOTAL_PREGUNTAS = nPregunta;

function escapar(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ============================================================
   VISTA DE PROYECCIÓN
   ============================================================ */
const escena = $("escena");

function abrir(i){
  actual = i;
  pintar();
  escena.classList.add("abierta");
  document.body.style.overflow = "hidden";
  (!$("revelar-zona").hidden ? $("bt-revelar") : $("bt-sig")).focus();
}

function cerrar(){
  escena.classList.remove("abierta");
  document.body.style.overflow = "";
  const b = contGlobos.querySelector('[data-i="' + actual + '"]');
  if (b) b.focus();
}

function mover(paso){
  actual = (actual + paso + TARJETAS.length) % TARJETAS.length;
  pintar();
  $("escena-cuerpo").scrollTop = 0;
}

function pintar(){
  const t = TARJETAS[actual];
  const esPregunta = t.tipo === "pregunta";

  $("cuenta").textContent = esPregunta
    ? t.rotulo + " de " + TOTAL_PREGUNTAS
    : t.rotulo;

  const enunciado = esPregunta ? t.pregunta : t.titulo;
  $("q-texto").textContent = enunciado;
  // Las preguntas largas necesitan más caracteres por línea o quedan en columna.
  $("q-texto").classList.toggle("ancha", enunciado.length > 110);

  // Solo las preguntas se tapan: el cierre se muestra entero, porque no hay
  // nada que discutir antes de verlo.
  $("revelar-zona").hidden = !esPregunta;
  $("explica").hidden = true;
  $("panel-cierre").hidden = esPregunta;
  escena.classList.toggle("revelado", !esPregunta);

  if (esPregunta){
    $("idea").textContent = t.idea;
    $("porque").innerHTML = t.porque.map(x => "<li>" + x + "</li>").join("");
    $("punto-r").textContent = t.punto.n;
    $("punto-t").textContent = t.punto.t;
    $("punto-items").innerHTML = t.punto.items.map(x => "<span>" + escapar(x) + "</span>").join("");
  } else {
    $("banda").innerHTML = t.banda;
    $("cadena").innerHTML = t.pasos.map((p, i) =>
      '<div class="paso">' +
        '<div class="paso-n">' + (i + 1) + '</div>' +
        '<div class="paso-t">' + escapar(p.t) + '</div>' +
        '<div class="paso-r">' + escapar(p.r) + '</div>' +
      '</div>').join("");
    $("regla").textContent = "«" + t.regla + "»";
  }
}

function revelar(){
  if (TARJETAS[actual].tipo !== "pregunta") return;
  if (!$("explica").hidden) return;
  $("explica").hidden = false;
  $("revelar-zona").hidden = true;
  escena.classList.add("revelado");
  $("escena-cuerpo").scrollTop = 0;
}

$("bt-revelar").addEventListener("click", revelar);
$("bt-cerrar").addEventListener("click", cerrar);
$("bt-ant").addEventListener("click", () => mover(-1));
$("bt-sig").addEventListener("click", () => mover(1));

document.addEventListener("keydown", e => {
  if (!escena.classList.contains("abierta")) return;

  if (e.key === "Escape"){ cerrar(); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); mover(1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); mover(-1); }
  else if (e.key === " " || e.key === "Enter"){
    // Enter sobre un botón ya hace lo suyo; no lo duplicamos.
    if (e.key === "Enter" && e.target && e.target.tagName === "BUTTON") return;
    e.preventDefault();
    revelar();
  }
});
</script>
