<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calificación en línea</title>
<style>
/* Calificación en línea de los instrumentos completos. Las preguntas y las
   reglas vienen de instrumentos/calificar-datos.js, que genera
   _planes-fuente/instrumentos/generar.py desde las mismas fichas en PDF: lo
   que se califica aquí es exactamente lo que trae la ficha. Nada se envía ni
   se guarda: las respuestas viven solo en esta pestaña. */
:root{
  --bg:#ffffff; --surface:#f6f8f8; --border:#dde5e5;
  --ink:#16232b; --ink-soft:#4b5c63; --ink-faint:#7d8c91;
  --accent:#1f6f78; --accent-dark:#134349; --accent-soft:#e2eff0;
  --alerta:#a83f2b; --alerta-soft:#fbeae6;
  --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:12px;
}
/* Instrumentos de la guía de niños y adolescentes: los colores de sus fichas. */
body.infancia{--accent:#c4663c; --accent-dark:#8a4222; --accent-soft:#f8e7de; --surface:#fdf9f5; --border:#e6d6ca;}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5;
  -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0;}
a{color:var(--accent-dark);}
.wrap{max-width:1180px; margin:0 auto; padding:28px 20px 60px; display:grid;
  grid-template-columns:minmax(0,1fr) 330px; gap:28px; align-items:start;}
.rotulo{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
h1{font-size:clamp(24px,3vw,34px); line-height:1.2;}
.sigla{font-size:14px; font-weight:700; color:var(--accent); margin-top:6px;}
.para{color:var(--ink-soft); margin:12px 0 0; max-width:70ch;}
.aviso{margin:16px 0 0; padding:10px 14px; background:var(--surface); border-radius:10px;
  font-size:13px; color:var(--ink-soft); border:1px solid var(--border);}
.acciones{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.bt{font:inherit; font-size:13.5px; font-weight:600; color:var(--accent-dark); background:var(--bg);
  border:1px solid var(--accent); border-radius:8px; padding:7px 13px; cursor:pointer; text-decoration:none;}
.bt:hover{background:var(--accent-soft);}
.consigna{font-weight:600; margin:24px 0 8px; max-width:75ch;}
.rej-t{font-weight:700; margin:26px 0 8px; font-size:15px;}
table{width:100%; border-collapse:collapse; font-size:14.5px;}
th{background:var(--accent); color:#fff; font-size:11.5px; font-weight:700; padding:7px 4px; text-align:center;
  vertical-align:bottom;}
th:first-child{text-align:left; padding-left:10px;}
td{border-bottom:1px solid var(--border); padding:8px 4px; text-align:center;}
td:first-child{text-align:left; padding-left:10px;}
tr:nth-child(even) td{background:var(--surface);}
tr.falta td:first-child{box-shadow:inset 3px 0 var(--alerta);}
td label{display:inline-flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer;
  font-size:11px; color:var(--ink-faint); min-width:34px;}
/* Entrevistas con clave de colores (C-SSRS): la casilla «Sí» lleva el color del
   nivel de riesgo que marca; las preguntas que dependen de otra se atenúan. */
td .ej{font-weight:400; font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
tr.n-bajo td:first-child, tr.n-moderado td:first-child, tr.n-alto td:first-child{font-weight:600;}
tr.n-bajo td:nth-child(2){background:#fcf1b4 !important;}
tr.n-moderado td:nth-child(2){background:#fbd99c !important;}
tr.n-alto td:nth-child(2){background:#f5b9b3 !important;}
tr.omitida{opacity:.4;}
.leyenda{display:flex; flex-wrap:wrap; gap:16px; margin:10px 0 0; font-size:12.5px; color:var(--ink-soft);}
.leyenda i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
/* Preguntas con opciones propias (HADS): una pregunta por bloque, opciones en lista. */
.lista{padding:12px 0 10px; border-bottom:1px solid var(--border); max-width:75ch;}
.lista-t{font-weight:600; margin:0 0 6px;}
.lista label{display:flex; gap:10px; align-items:center; padding:5px 8px; border-radius:8px; cursor:pointer;}
.lista label:hover{background:var(--surface);}
.lista small{color:var(--ink-faint); font-size:11.5px;}
input[type=radio]{width:18px; height:18px; accent-color:var(--accent); cursor:pointer; margin:0;}
.panel{position:sticky; top:16px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px;}
.panel h2{font-size:19px; margin-bottom:4px;}
.faltan{font-size:12.5px; color:var(--ink-faint); margin-bottom:12px;}
.res{padding:10px 0; border-top:1px solid var(--border);}
.res .n{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.res .v{font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--accent-dark); line-height:1.2;}
.res .r{font-size:13.5px; font-weight:600; color:var(--ink);}
.res .x{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.alerta{margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--alerta-soft);
  border-left:4px solid var(--alerta); font-size:13px; color:#5c2418;}
.alerta a{color:#5c2418; font-weight:700;}
.riesgo{margin-top:14px; padding:12px 16px; border-radius:10px; background:#fbeae6; border-left:4px solid #a83f2b; font-size:13.5px; line-height:1.5; color:#4a1d13;}
.riesgo b{display:block; color:#a83f2b; margin-bottom:4px;}
.riesgo ol{margin:4px 0 0; padding-left:20px;}
.riesgo li{margin-bottom:3px;}
.riesgo a{color:#7a2a1a; font-weight:600;}
.nota-p{font-size:12px; color:var(--ink-faint); margin-top:14px;}
/* Todos los puntos de corte del instrumento, con la banda del resultado marcada. */
.cortes{margin-top:9px;}
.barra-c{display:flex; height:10px; border-radius:5px; overflow:hidden; margin:0 0 7px;}
.barra-c span{display:block; height:100%; border-right:2px solid var(--surface);}
.barra-c span:last-child{border-right:0;}
.marca-c{position:relative; height:22px; margin-top:12px;}
.marca-c i{position:absolute; top:0; transform:translateX(-50%); font-style:normal; font-size:11.5px;
  font-weight:700; line-height:14px; color:var(--accent-dark); white-space:nowrap;}
.marca-c i::after{content:""; position:absolute; left:50%; top:14px; margin-left:-5px; border:5px solid transparent;
  border-top-color:var(--accent-dark); border-bottom-width:0;}
.corte{display:grid; grid-template-columns:64px 1fr; gap:8px; padding:3px 8px; font-size:12.5px;
  color:var(--ink-faint); border-left:3px solid transparent; border-radius:0 6px 6px 0;}
.corte .rg{font-variant-numeric:tabular-nums;}
.corte.aqui{color:var(--ink); font-weight:700; background:var(--accent-soft); border-left-color:var(--accent);}
.indice{grid-column:1 / -1;}
.indice ul{list-style:none; padding:0; margin:16px 0 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px;}
.indice li a{display:block; padding:12px 14px; border:1px solid var(--border); border-radius:10px; text-decoration:none; color:var(--ink);}
.indice li a:hover{border-color:var(--accent); background:var(--accent-soft);}
.indice li b{color:var(--accent-dark);}
.fuente{font-size:12px; color:var(--ink-faint); margin-top:26px;}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);}
  .panel{position:static;}
  td label{min-width:26px;}
}
/* En celulares y tabletas el resultado se comparte como PDF: mientras se arma,
   la hoja toma el ancho de una página, como en la impresión. */
body[data-pdf] .wrap{width:184mm; max-width:none; padding:0;
  grid-template-columns:minmax(0,1fr) 60mm; gap:6mm; background:#fff;}
body[data-pdf] .acciones, body[data-pdf] .aviso{display:none;}
body[data-pdf] .panel{position:static;}
.marca{display:inline-block; width:16px; height:16px; border-radius:50%; border:1.5px solid var(--ink-faint);}
.marca.si{background:var(--accent); border-color:var(--accent);}
#pdf-velo{position:fixed; inset:0; z-index:100000; background:#fff; display:flex; align-items:center;
  justify-content:center; font-size:16px; font-weight:600; color:var(--ink-soft);}
@media print{
  .acciones,.aviso{display:none;}
  .wrap{grid-template-columns:minmax(0,1fr) 260px;}
  .panel{position:static;}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="instrumentos/calificar-datos.js"></script>
<script>
const $ = s => document.querySelector(s);
// El mismo protocolo que muestran los planes junto a los instrumentos de riesgo.
const PROTOCOLO_RIESGO = '<div class="riesgo"><b>Protocolo ante riesgo suicida</b><ol><li>Pregunte directamente por ideas, plan e intención de suicidio. Preguntar no lo induce.</li><li>Si hay riesgo, la persona no se queda sola ni se va sin una valoración de seguridad. Retire los medios letales a su alcance y avise al responsable de la atención.</li><li>Riesgo inminente: urgencias de inmediato, en el servicio más cercano o por la <strong>Línea 123</strong>.</li><li>Orientación en salud mental en todo el país: <strong>Línea 192, opción 4</strong>, del Ministerio de Salud y Protección Social.</li><li>Siga la <a href="rutas-mhgap.html#sui" target="_blank" rel="noopener">ruta de suicidio (módulo SUI) de la guía mhGAP</a> y la ruta de su institución.</li></ol></div>';
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const param = new URLSearchParams(location.search).get("i");
const app = $("#app");
const ES_MOVIL = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  (navigator.maxTouchPoints > 1 && !window.matchMedia("(pointer:fine)").matches);

function indice(){
  document.title = "Calificación en línea";
  const lista = Object.entries(CALIFICAR).sort((a, b) => a[1].sigla.localeCompare(b[1].sigla, "es"));
  app.innerHTML = '<div class="indice"><div class="rotulo">Instrumentos de evaluación</div>' +
    '<h1>Calificación en línea</h1>' +
    '<p class="para">Los instrumentos que la guía reproduce completos, listos para responder y calificar en el navegador. ' +
    'Nada de lo que se marca se envía ni se guarda.</p><ul>' +
    lista.map(([a, d]) => '<li><a href="?i=' + a + '"><b>' + esc(d.sigla) + '</b> · ' + esc(d.titulo) + '</a></li>').join("") +
    '</ul></div>';
}

// La escala completa de puntos de corte: una barra con el ancho de cada banda
// proporcional a su rango, una marca en el puntaje y la lista de bandas.
function escalaCortes(rangos, val){
  const ult = rangos[rangos.length - 1], penult = rangos[rangos.length - 2];
  const fin = ult[1] !== null ? ult[1] : ult[0] + (penult[1] - penult[0]);
  const ini = rangos[0][0], largo = Math.max(1, fin - ini + 1);
  const tono = k => mezclar("#dfe9ea", getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#1f6f78",
    rangos.length === 1 ? 1 : .15 + .85 * k / (rangos.length - 1));
  const barra = rangos.map(([x, y], k) => {
    const hasta = y !== null ? y : fin;
    return '<span style="width:' + ((hasta - x + 1) / largo * 100) + '%;background:' + tono(k) + '"></span>';
  }).join("");
  const pos = Math.max(0, Math.min(100, (Math.min(val, fin) - ini + .5) / largo * 100));
  const lista = rangos.map(([x, y, t]) => {
    const aqui = val >= x && (y === null || val <= y);
    const rg = y === null ? x + " o más" : x === y ? String(x) : x + "–" + y;
    return '<div class="corte' + (aqui ? ' aqui' : '') + '"><span class="rg">' + rg + '</span><span>' + esc(t) + '</span></div>';
  }).join("");
  return '<div class="cortes"><div class="marca-c"><i style="left:' + pos + '%">' + val + '</i></div>' +
    '<div class="barra-c">' + barra + '</div>' + lista + '</div>';
}
function mezclar(a, b, t){
  const n = (c, i) => parseInt(c.substr(1 + i * 2, 2), 16);
  return "#" + [0, 1, 2].map(i => Math.round(n(a, i) + (n(b, i) - n(a, i)) * t).toString(16).padStart(2, "0")).join("");
}

function instrumento(a, d){
  document.title = d.sigla + " · Calificación en línea";
  if (d.estilo === "infancia") document.body.classList.add("infancia");
  let q = 0, num = 0, h = "";
  const puntua = {};
  let niveles = false;
  d.bloques.forEach(b => {
    if (b.t === "consigna"){ h += '<p class="consigna">' + esc(b.x) + '</p>'; return; }
    if (b.lista){
      b.items.forEach(it => {
        q++;
        if (b.puntua) puntua[q] = true;
        h += '<div class="lista" data-q="' + q + '"><p class="lista-t">' + esc(it) + '</p>' + b.ops.map((o, k) =>
          '<label><input type="radio" name="q' + q + '" value="' + b.vals[k] + '"><span>' + esc(o) + '</span>' +
          (b.puntua ? '<small>(' + b.vals[k] + ')</small>' : '') + '</label>').join("") + '</div>';
      });
      return;
    }
    if (b.titulo) h += '<p class="rej-t">' + esc(b.titulo) + '</p>';
    h += '<table><thead><tr><th>' + esc(b.cab) + '</th>' + b.ops.map(o => '<th>' + esc(o) + '</th>').join("") + '</tr></thead><tbody>';
    b.items.forEach(it => {
      q++;
      if (b.puntua) puntua[q] = true;
      const o = typeof it === "string" ? { x: it } : it;   // objeto: {x, ej, nivel, si}
      if (o.nivel) niveles = true;
      const rot = b.numerar ? (++num) + ". " + o.x : o.x;
      h += '<tr data-q="' + q + '"' + (o.si ? ' data-si="' + esc(o.si) + '"' : '') + (o.nivel ? ' class="n-' + o.nivel + '"' : '') +
        '><td>' + esc(rot) + (o.ej ? '<div class="ej">' + esc(o.ej) + '</div>' : '') + '</td>' + b.ops.map((o, k) =>
        '<td><label title="' + esc(o) + '"><input type="radio" name="q' + q + '" value="' + b.vals[k] + '" aria-label="' + esc(o) + '">' +
        (b.puntua && b.ops.join() !== "Sí,No" && b.ops.join() !== "No,Sí" ? b.vals[k] : "") + '</label></td>').join("") + '</tr>';
    });
    h += '</tbody></table>';
  });
  if (niveles) h += '<div class="leyenda"><span><i style="background:#f7e36b"></i>Riesgo bajo</span>' +
    '<span><i style="background:#f5b544"></i>Riesgo moderado</span><span><i style="background:#e2574c"></i>Riesgo alto</span></div>';
  app.innerHTML =
    '<div><div class="rotulo">Calificación en línea</div><h1>' + esc(d.titulo) + '</h1><div class="sigla">' + esc(d.sigla) + '</div>' +
    '<p class="para">' + esc(d.para) + '</p>' +
    '<div class="aviso">Las respuestas no se envían ni se guardan: al cerrar o recargar la página se borran. ' +
    'El resultado orienta, no diagnostica.' + (d.calif.nota ? " " + esc(d.calif.nota) : "") + '</div>' +
    '<div class="acciones"><a class="bt" href="instrumentos/' + a + '.pdf" target="_blank" rel="noopener">Ver la ficha en PDF</a>' +
    '<button class="bt" id="borrar">Borrar respuestas</button><button class="bt" id="imprimir">' +
    (ES_MOVIL ? 'Compartir resultado' : 'Imprimir resultado') + '</button>' +
    '<a class="bt" href="calificar.html">Otros instrumentos</a></div>' +
    h + '<p class="fuente">Fuente: ' + esc(d.cita) + '</p></div>' +
    '<aside class="panel" aria-live="polite"><h2>Resultado</h2><div id="res"></div></aside>';
  const total = q;
  const calc = () => {
    const r = [null];
    for (let i = 1; i <= total; i++){
      const m = document.querySelector('input[name="q' + i + '"]:checked');
      r[i] = m ? Number(m.value) : null;
    }
    const v = i => r[i] == null ? 0 : r[i];
    const S = (x, y) => { let s = 0; for (let i = x; i <= y; i++) s += v(i); return s; };
    const L = l => l.reduce((s, i) => s + v(i), 0);
    const C = (l, val) => l.filter(i => r[i] === val).length;
    const G = l => l.filter(i => r[i] != null && r[i] >= 2).length;
    const R = (i, max) => r[i] == null ? 0 : max - r[i];
    const RANGO = (x, y) => Array.from({ length: y - x + 1 }, (_, k) => x + k);
    const ev = js => Function("r","S","L","C","G","R","RANGO","return (" + js + ");")(r, S, L, C, G, R, RANGO);
    // Preguntas que dependen de otra (data-si): si la condición no se cumple, se
    // desmarcan, se desactivan y no cuentan como faltantes.
    const omitidas = new Set();
    document.querySelectorAll("[data-si]").forEach(fila => {
      const ok = !!ev(fila.dataset.si);
      fila.classList.toggle("omitida", !ok);
      fila.querySelectorAll("input").forEach(x => { x.disabled = !ok; if (!ok) x.checked = false; });
      if (!ok){ r[+fila.dataset.q] = null; omitidas.add(fila.dataset.q); }
    });
    const activas = Object.keys(puntua).filter(i => !omitidas.has(i));
    const sinResp = activas.filter(i => r[i] == null);
    document.querySelectorAll("[data-q]").forEach(tr => tr.classList.toggle("falta", false));
    let out = '<div class="faltan">' + (sinResp.length && !d.calif.nota
      ? "Faltan " + sinResp.length + " de " + activas.length + " respuestas: el resultado es parcial."
      : "Resultado con todas las respuestas marcadas.") + '</div>';
    if (activas.length && sinResp.length === activas.length){
      $("#res").innerHTML = '<div class="faltan">Marque las respuestas: el resultado se calcula a medida que avanza.</div>';
      return;
    }
    d.calif.escalas.forEach(e => {
      const val = ev(e.js);
      let rot = "";
      (e.rangos || []).forEach(([x, y, t]) => { if (val >= x && (y === null || val <= y)) rot = t; });
      const esSN = (e.rangos || []).length && e.rangos.every(([x, y]) => x === y);
      const cortes = !esSN && (e.rangos || []).length >= 2 && !(val === 0 && d.calif.escalas.length > 4)
        ? escalaCortes(e.rangos, val) : "";
      out += '<div class="res"><div class="n">' + esc(e.n) + '</div>' +
        (esSN ? "" : '<div class="v">' + val + '</div>') +
        (rot ? '<div class="r">' + esc(rot) + '</div>' : "") + (e.texto ? '<div class="x">' + esc(e.texto) + '</div>' : "") +
        cortes + '</div>';
    });
    let riesgo = false;
    (d.calif.alertas || []).forEach(al => { if (ev(al.js)){ out += '<div class="alerta">' + esc(al.texto) + '</div>'; if (/suicid/.test(al.texto)) riesgo = true; } });
    if (riesgo) out += PROTOCOLO_RIESGO;
    $("#res").innerHTML = out;
  };
  app.addEventListener("change", calc);
  $("#borrar").addEventListener("click", () => { document.querySelectorAll("input[type=radio]").forEach(x => x.checked = false); calc(); });
  $("#imprimir").addEventListener("click", ev => ES_MOVIL ? compartir(d, ev.currentTarget) : print());
  calc();
}

/* Compartir en celulares y tabletas: el resultado sale como PDF por el menú
   de compartir del sistema; si el navegador no lo permite, se descarga, y si
   no hay conexión para cargar la librería, queda la impresión del sistema. */
let cargaPDF = null;
function cargarPDF(){
  if (window.html2pdf) return Promise.resolve();
  return cargaPDF ||= new Promise((ok, mal) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js";
    sc.onload = ok; sc.onerror = () => { cargaPDF = null; mal(new Error("sin conexión")); };
    document.head.appendChild(sc);
  });
}
// La librería copia la hoja dentro de la página; una copia con los mismos
// botones de opción le quitaría las marcas a la original. Se entrega una copia
// en la que cada opción es un círculo dibujado, lleno si estaba marcada.
function copiaEstatica(){
  const copia = app.cloneNode(true);
  copia.removeAttribute("id");
  const orig = app.querySelectorAll("input[type=radio]");
  copia.querySelectorAll("input[type=radio]").forEach((x, k) => {
    const m = document.createElement("span");
    m.className = "marca" + (orig[k].checked ? " si" : "");
    x.replaceWith(m);
  });
  return copia;
}
async function compartir(d, boton){
  const nombre = (d.sigla + " resultado").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".pdf";
  const texto = boton.textContent, scrollY0 = window.scrollY;
  boton.disabled = true; boton.textContent = "Preparando PDF…";
  try {
    await cargarPDF();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    window.scrollTo(0, 0);
    document.body.dataset.pdf = "1";
    const velo = document.createElement("div");
    velo.id = "pdf-velo"; velo.textContent = "Preparando PDF…";
    document.body.appendChild(velo);
    // Los navegadores móviles no pintan lienzos de más de ~16 millones de
    // píxeles (el PDF sale en blanco): la resolución se ajusta al largo.
    const area = Math.max(1, app.offsetWidth * app.scrollHeight);
    const escala = Math.max(0.8, Math.min(2, Math.sqrt(10e6 / area)));
    const pdf = await html2pdf().set({
      margin: [13, 13, 13, 13], filename: nombre,
      image: { type: "jpeg", quality: 0.92 },
      html2canvas: { scale: escala, useCORS: true, backgroundColor: "#ffffff" },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
      pagebreak: { mode: ["css"], avoid: ["tr", ".res", ".alerta", ".riesgo", ".consigna"] }
    }).from(copiaEstatica()).toPdf().get("pdf");
    const archivo = new File([pdf.output("blob")], nombre, { type: "application/pdf" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        await navigator.share({ files: [archivo], title: d.sigla });
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;   // cerró el menú a propósito
    }
    pdf.save(nombre);
  } catch (err) {
    print();
  } finally {
    delete document.body.dataset.pdf;
    document.getElementById("pdf-velo")?.remove();
    window.scrollTo(0, scrollY0);
    boton.disabled = false; boton.textContent = texto;
  }
}

if (typeof CALIFICAR === "undefined"){
  app.innerHTML = '<p>No se pudieron cargar los instrumentos.</p>';
} else if (param && CALIFICAR[param]){
  instrumento(param, CALIFICAR[param]);
} else {
  indice();
}
</script>
