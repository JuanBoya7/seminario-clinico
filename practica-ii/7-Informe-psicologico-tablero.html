<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe psicológico — Tablero</title>
<style>
/* ============================================================
   TOKENS — los mismos del recurso y de los tableros de los casos
   ============================================================ */
:root{
  --bg:#ffffff;
  --surface:#f6f8f8;
  --surface-alt:#eef2f2;
  --border:#dde5e5;
  --ink:#16232b;
  --ink-soft:#4b5c63;
  --ink-faint:#7d8c91;
  --accent:#1f6f78;
  --accent-dark:#134349;
  --accent-soft:#e2eff0;
  --moderate:#b8722a;
  --moderate-soft:#faf1e4;
  --severe:#a83f2b;
  --severe-soft:#fbeae6;
  --gris:#9aa6ad;
  --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0;}
button{font-family:var(--font-body);}
.wrap{max-width:1180px; margin:0 auto; padding:22px 24px 40px;}

.js-warning{background:var(--severe-soft); border:1px solid var(--severe); color:var(--severe); padding:14px 16px; border-radius:10px; font-size:14px; margin-bottom:20px;}
.aviso-demo{background:var(--moderate-soft); border:1px solid var(--moderate); color:var(--moderate); border-radius:10px; padding:9px 14px; font-size:13.5px; margin-bottom:16px;}
.aviso-demo[hidden]{display:none;}

.cabecera{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:6px;}
.cabecera h1{font-size:26px;}
.controles{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
select{font-family:var(--font-body); font-size:14.5px; font-weight:600; color:var(--ink); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px;}
.bt{font-size:13.5px; font-weight:600; color:var(--ink-soft); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 14px; cursor:pointer;}
.bt:hover{background:var(--surface-alt); color:var(--ink);}
.bt[hidden]{display:none;}
.estado{font-size:12.5px; color:var(--ink-faint); font-family:var(--font-mono);}
.estado.error{color:var(--severe);}

.nav-pantallas{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px;}
.nav-pantallas[hidden]{display:none;}
.pill{font-size:14px; font-weight:600; cursor:pointer; padding:8px 16px; border-radius:99px; border:1px solid var(--border); background:var(--bg); color:var(--ink-soft);}
.pill.is-on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark);}

.panel{border:1px solid var(--border); border-radius:16px; padding:26px 30px 30px;}
.panel .num{font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px;}
/* La pregunta del globo es lo que se lee desde el fondo del salón. */
.panel h2{font-size:clamp(26px,3vw,38px); line-height:1.2; max-width:34ch;}
.panel .sub{font-size:15px; color:var(--ink-faint); margin:10px 0 24px; max-width:72ch;}
.vacio-msg{color:var(--ink-faint); font-size:16px; font-style:italic;}

.fila{display:grid; grid-template-columns:minmax(200px,34%) minmax(0,1fr) 80px; gap:14px; align-items:center; margin-bottom:12px;}
.fila .nom{font-size:16.5px; line-height:1.3;}
.bar{display:flex; height:28px; background:var(--surface-alt); border-radius:6px; overflow:hidden;}
.bar span{display:block; height:100%;}
.fila .val{font-family:var(--font-mono); font-size:14px; color:var(--ink-soft); text-align:right; white-space:nowrap;}

.contador{font-family:var(--font-display); font-size:clamp(72px,11vw,128px); line-height:1; color:var(--accent-dark);}
.contador-t{font-size:18px; color:var(--ink-soft); margin-top:6px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 26px;}
.chip{font-size:14.5px; padding:7px 13px; border-radius:99px; background:var(--accent-soft); color:var(--accent-dark);}
.chip small{font-family:var(--font-mono); font-size:11.5px; margin-left:6px; color:var(--accent);}
.btn-principal{font-size:17px; font-weight:600; color:#fff; background:var(--accent); border:1px solid var(--accent); border-radius:10px; padding:14px 26px; cursor:pointer;}
.btn-principal:hover{background:var(--accent-dark);}

/* ---- Voces: frases reales de los informes, sin número de grupo ---- */
.voces{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:22px; margin-top:28px;}
.col-voz h3{font-size:17px; margin-bottom:10px; padding-bottom:6px; border-bottom:3px solid var(--border);}
.col-voz.mal h3{border-bottom-color:var(--moderate);}
.col-voz.bien h3{border-bottom-color:var(--accent);}
.voz{background:var(--surface); padding:12px 14px; border-radius:8px; margin-bottom:10px; font-size:17px; line-height:1.45;}
.voz .de{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px;}
.siglas-chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:24px;}
.sigla{font-family:var(--font-mono); font-size:19px; font-weight:700; padding:8px 14px; border-radius:8px; background:var(--moderate-soft); color:var(--moderate);}
.sigla small{font-size:12px; font-weight:600; margin-left:6px;}

/* ---- Práctica recomendada: aparece cuando el docente la pide ---- */
.cierre{margin-top:30px; border-top:1px solid var(--border); padding-top:24px;}
.cierre .rot{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:12px;}
.afirmacion{font-family:var(--font-display); font-size:clamp(21px,2.4vw,30px); line-height:1.38; color:var(--accent-dark); background:var(--accent-soft); border-radius:12px; padding:20px 24px; max-width:62ch;}
.afirmacion-fuente{font-size:12.5px; color:var(--ink-faint); margin-top:10px;}

/* Pantalla final */
.sintesis{font-family:var(--font-display); font-size:clamp(28px,3.6vw,44px); line-height:1.3; color:var(--accent-dark); max-width:30ch; margin:18px 0 22px;}

.pie{display:flex; justify-content:space-between; align-items:center; margin-top:16px;}
.pie[hidden]{display:none;}
.pie .cuenta{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);}

@media (max-width:760px){
  .wrap{padding:16px 14px 30px;}
  .panel{padding:20px 18px 22px;}
  .fila{grid-template-columns:minmax(0,1fr); gap:6px;}
  .fila .val{text-align:left;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="js-warning" id="js-warning-fallback">
    Si ves este mensaje, el tablero no se está ejecutando. Ábrelo en un navegador de escritorio.
  </div>
  <div class="aviso-demo" id="aviso-demo" hidden></div>

  <div class="cabecera">
    <div>
      <div class="eyebrow">Informe psicológico · Tablero docente</div>
      <h1>Lo que dejaron los informes</h1>
    </div>
    <div class="controles">
      <select id="f-grupo" aria-label="Grupo del curso"></select>
      <button class="bt" id="bt-tapar" hidden>Volver a tapar</button>
      <span class="estado" id="estado">—</span>
    </div>
  </div>

  <nav class="nav-pantallas" id="nav" hidden></nav>
  <main id="pantalla"></main>
  <div class="pie" id="pie" hidden>
    <button class="bt" id="bt-ant">← Anterior</button>
    <span class="cuenta" id="cuenta"></span>
    <button class="bt" id="bt-sig">Siguiente →</button>
  </div>

</div>

<script>
/* ============================================================
   1. CONFIGURACIÓN
   ============================================================ */
const FUENTE = {
  // La misma dirección que ENVIO.url en 7-Informe-psicologico.html.
  url: "https://script.google.com/a/macros/areandina.edu.co/s/AKfycbxmCer6MqE9JD9MEAhyQnbvDZ8nWfTk1vIkaGZn7we2BAGtb6aDJoNCF6fdYXbIvBrY/exec",
  alterna: true,
  curso: "PII-2026-B",
  caso: "Informe",          // la pestaña de la hoja es "<grupo del curso> Informe"
  refrescoMs: 20000
};
const GRUPOS_CURSO = ["Práctica II"];

// Nombre de pila de cada expediente: es lo único que identifica una frase.
// Las voces no llevan número de grupo — el tablero se proyecta delante del curso.
const EXPEDIENTES = { A: "Samuel", B: "Daniela", C: "Jairo", D: "Mercedes" };

/* ============================================================
   2. LOS GLOBOS
   ============================================================
   Uno por trampa, en el orden del deck (finalidad → redacción → buenas
   prácticas → lectura → ética). Las opciones son las mismas de la
   autoauditoría del recurso, con un rótulo corto para las barras y su lectura:
   «mal» y «bien» deciden en qué columna de voces cae la frase de un grupo;
   «neutro» cuenta en las barras pero no aporta voces.
   ============================================================ */
const GLOBOS = [
  { id: "pregunta", tema: "Finalidad del informe",
    pregunta: "¿Respondieron lo que les preguntaron?",
    sub: "Cada remitente hizo una pregunta concreta. Así clasificó cada equipo la frase con la que la respondió.",
    opciones: [["completa", "Responde todas las partes", "bien"], ["parcial", "Responde solo una parte", "neutro"], ["no", "No la responde de forma directa", "mal"]],
    principio: "El informe existe para responder a quien lo pidió. La conclusión contesta cada parte de la pregunta de remisión, con palabras que el destinatario pueda usar, y no responde preguntas que nadie hizo: una comisaría no pidió saber si el padrastro es culpable.",
    fuente: "Láminas 3 y 12: para qué sirve el informe; del hallazgo a la conclusión." },
  { id: "siglas", tema: "Redacción clínica",
    pregunta: "¿Quién va a leer esas siglas?",
    sub: "Las remisiones venían llenas de siglas. Estas quedaron en los informes sin su forma completa.",
    opciones: [["sin-explicar", "Usaron siglas sin explicarlas", "mal"], ["algunas", "Explicaron algunas", "neutro"], ["todas", "Las explicaron todas, o no las usaron", "bien"]],
    principio: "Un informe lo leen el consultante, otros profesionales y a veces un juez. Las siglas se escriben completas, o completas la primera vez con la sigla entre paréntesis. Vale también para las escalas de las pruebas.",
    fuente: "Lámina 9: evitar siglas y abreviaturas sin aclarar." },
  { id: "rumor", tema: "Buenas prácticas",
    pregunta: "¿Qué hacemos con lo que alguien contó que otro dijo?",
    sub: "Cada expediente traía un dato de oídas: la violencia en la casa, el muchacho mayor, el alcohol en la bodega, la noche en el parque.",
    opciones: [["hecho", "Lo presentaron como un hecho", "mal"], ["atribuido", "Lo atribuyeron, sin darlo por cierto", "bien"], ["excluido", "Lo dejaron fuera, a propósito", "bien"], ["no-visto", "No lo vieron", "neutro"]],
    principio: "Un dato de oídas no es un hallazgo. Si se incluye, se dice de dónde viene y se contrasta con lo evaluado; si no aporta a la pregunta, se deja fuera o se recomienda explorarlo. Nunca se presenta como un hecho.",
    fuente: "Lámina 9: no sustentar rumores ni información no verificada." },
  { id: "contradiccion", tema: "Integración",
    pregunta: "Cuando dos fuentes no dicen lo mismo, ¿a cuál le creemos?",
    sub: "«No estoy deprimido» y un BDI-II de 24; la docente y los padres; «estoy bien» y las pesadillas; «está perdida» y una orientación perfecta.",
    opciones: [["una", "Informaron solo una fuente", "mal"], ["separadas", "Informaron las dos, por separado", "mal"], ["integradas", "Las integraron y explicaron la diferencia", "bien"], ["no-tratado", "No lo trataron", "neutro"]],
    principio: "A ninguna por separado. Integrar es explicar la diferencia: por qué el consultante dice una cosa y la prueba otra, o por qué la docente ve lo que los padres no. Un informe que yuxtapone resultados fragmenta a la persona.",
    fuente: "Láminas 10 y 16: no fragmentar al examinado; integrar los datos." },
  { id: "validez", tema: "Calidad de los instrumentos",
    pregunta: "¿Un puntaje dice siempre lo que parece?",
    sub: "Un MMPI-2 con 36 ítems sin contestar, un MMPI-A defensivo, una subprueba interrumpida por un simulacro, una MoCA aplicada sin lentes.",
    opciones: [["sin-advertir", "Interpretaron sin advertir el problema", "mal"], ["advertido", "Lo advirtieron, pero interpretaron todo", "mal"], ["limitado", "Lo advirtieron y limitaron la interpretación", "bien"], ["no-usada", "No usaron esa prueba", "neutro"]],
    principio: "Antes de interpretar una prueba se mira cómo se aplicó y si el protocolo es válido. El problema se informa, y la interpretación se limita a lo que el protocolo permite.",
    fuente: "Lámina 8: objetividad y calidad de los instrumentos." },
  { id: "fortaleza", tema: "Lectura por áreas y pronóstico",
    pregunta: "¿Qué puede hacer bien esta persona?",
    sub: "Cada expediente traía una fortaleza de pasada: el Lego, la danza, el microfútbol, el pastillero y el coro.",
    opciones: [["no", "No la mencionaron", "mal"], ["mencion", "La mencionaron, sin usarla", "neutro"], ["usada", "La usaron en el pronóstico o las recomendaciones", "bien"]],
    principio: "Las áreas libres de conflicto son parte del informe: sostienen el pronóstico y orientan la intervención. Redactar en positivo es decir lo que la persona sí puede, no suavizar lo que no.",
    fuente: "Láminas 9, 11 y 12: redactar en positivo; áreas libres de conflicto; pronóstico." },
  { id: "intimo", tema: "Ética",
    pregunta: "¿Todo lo que supimos va en el informe?",
    sub: "En los cuatro expedientes alguien contó algo íntimo y pidió que no quedara en ningún papel.",
    opciones: [["incluido", "Lo incluyeron", "mal"], ["suavizado", "Lo incluyeron de forma indirecta", "mal"], ["excluido", "Lo dejaron fuera, a propósito", "bien"], ["no-visto", "No lo vieron", "neutro"]],
    principio: "No. Un informe incluye lo que responde la pregunta de remisión. Lo que el consultante confió con pedido de reserva, y no explica el motivo de consulta, queda fuera: incluirlo vulnera la confidencialidad sin aportar nada.",
    fuente: "Lámina 8: respeto y código deontológico." }
];

const SINTESIS = "El informe no fragmenta al examinado: integra los datos en una descripción coherente, ética y útil para decidir.";

/* ============================================================
   3. DATOS DE EJEMPLO
   ============================================================
   Ocho grupos inventados, dos por expediente. Se usan mientras FUENTE.url
   diga "PENDIENTE", o con ?demo=1 en la dirección, para ensayar el cierre.
   ============================================================ */
const DEMO = [
  { g: 1, h: "10:31", x: "C", aud: { rumor: "hecho", contradiccion: "separadas", validez: "sin-advertir", fortaleza: "no", intimo: "excluido", siglas: "sin-explicar", pregunta: "parcial" },
    hal: { rumor: ["Según su cuñada, lo han visto tomando en la bodega."], contradiccion: ["El BDI-II indica depresión moderada."], validez: ["El MMPI-2 muestra elevación en ansiedad, depresión y preocupaciones por la salud."], siglas: ["TAG", "TDM"] },
    f: "Se evidencian síntomas de ansiedad relacionados con la salud." },
  { g: 2, h: "10:33", x: "C", aud: { rumor: "atribuido", contradiccion: "integradas", validez: "limitado", fortaleza: "usada", intimo: "excluido", siglas: "todas", pregunta: "completa" },
    hal: { rumor: ["La esposa refiere un comentario de terceros sobre consumo en el trabajo, no verificado; el AUDIT indica bajo riesgo."], contradiccion: ["Aunque niega estar deprimido, el BDI-II puntúa 24, sobre todo por ítems corporales como el sueño y el cansancio."], validez: ["El MMPI-2 tiene 36 ítems sin contestar, por lo que las escalas de contenido no se interpretan."], fortaleza: ["Mantiene el entrenamiento de microfútbol de su hija, un recurso para la intervención."], siglas: [] },
    f: "Se identifica un componente ansioso centrado en la salud; se recomienda psicoterapia, sin necesidad actual de remisión a psiquiatría." },
  { g: 3, h: "10:34", x: "A", aud: { rumor: "hecho", contradiccion: "una", validez: "sin-advertir", fortaleza: "mencion", intimo: "incluido", siglas: "sin-explicar", pregunta: "parcial" },
    hal: { rumor: ["La docente informa que el padre maltrataba a la madre, lo que podría explicar su conducta."], contradiccion: ["Según la docente, presenta inatención e hiperactividad, compatibles con TDAH."], validez: ["La memoria de trabajo (82) está en promedio bajo, lo que confirma dificultades de atención."], fortaleza: ["Le gusta armar Lego."], intimo: ["La madre tiene antecedente de depresión en tratamiento con sertralina."], siglas: ["TDAH", "PIAR"] },
    f: "Se sugiere valoración por neuropediatría por posible TDAH." },
  { g: 4, h: "10:36", x: "A", aud: { rumor: "excluido", contradiccion: "integradas", validez: "limitado", fortaleza: "usada", intimo: "excluido", siglas: "algunas", pregunta: "completa" },
    hal: { contradiccion: ["La docente reporta inatención, pero los padres no; los síntomas aparecen en las tareas de lectura."], validez: ["Dígitos se interrumpió por un simulacro, por lo que la memoria de trabajo se interpreta con cautela."], fortaleza: ["Su fortaleza visoespacial permite usar apoyos visuales y material concreto."], siglas: ["DUA"] },
    f: "El perfil corresponde a una dificultad específica en la lectura; se recomiendan más tiempo, evaluación oral y apoyos visuales." },
  { g: 5, h: "10:37", x: "B", aud: { rumor: "atribuido", contradiccion: "separadas", validez: "sin-advertir", fortaleza: "usada", intimo: "suavizado", siglas: "sin-explicar", pregunta: "parcial" },
    hal: { rumor: ["La tía refiere rumores del barrio sobre una relación con un joven mayor, sin confirmar."], contradiccion: ["Daniela refiere estar bien.", "La CPSS-5 puntúa 29, por debajo del punto de corte."], validez: ["En el MMPI-A todas las escalas clínicas están dentro de lo normal."], fortaleza: ["La danza urbana es un espacio protector."], intimo: ["Refiere una relación afectiva en el grupo de danza que su madre desconoce."], siglas: ["VIF", "NNA"] },
    f: "Daniela presenta afectación emocional por los hechos de violencia que presenció." },
  { g: 6, h: "10:39", x: "B", aud: { rumor: "excluido", contradiccion: "integradas", validez: "limitado", fortaleza: "usada", intimo: "excluido", siglas: "todas", pregunta: "completa" },
    hal: { contradiccion: ["Aunque dice que ya pasó, presenta pesadillas, evitación y sobresalto."], validez: ["El MMPI-A es defensivo (Mentira y Corrección elevadas), así que las escalas clínicas normales no descartan malestar."], fortaleza: ["Cuidó a su hermano y llamó al 123; la danza es un recurso."], siglas: [] },
    f: "Presenta síntomas de estrés postraumático asociados a los hechos presenciados; se recomienda atención psicológica centrada en el trauma." },
  { g: 7, h: "10:40", x: "D", aud: { rumor: "hecho", contradiccion: "una", validez: "sin-advertir", fortaleza: "no", intimo: "incluido", siglas: "sin-explicar", pregunta: "parcial" },
    hal: { rumor: ["La vecina la ha visto perdida en el parque de noche."], contradiccion: ["La hija refiere que ya no se acuerda de nada."], validez: ["Obtuvo 21 en la MoCA, por debajo del punto de corte, compatible con deterioro cognitivo."], intimo: ["El esposo tuvo otra familia en Mariquita, lo que agrava su duelo."], siglas: ["DCL", "EA"] },
    f: "El puntaje de la MoCA sugiere un deterioro cognitivo leve." },
  { g: 8, h: "10:42", x: "D", aud: { rumor: "atribuido", contradiccion: "integradas", validez: "limitado", fortaleza: "usada", intimo: "excluido", siglas: "todas", pregunta: "completa" },
    hal: { rumor: ["Una vecina afirma haberla visto sola de noche; el portero lo contradice."], contradiccion: ["Aunque la hija la describe perdida, está orientada y recupera las palabras con pistas."], validez: ["La MoCA se aplicó sin lentes; se recomienda repetirla."], fortaleza: ["Maneja sola su pastillero y canta en el coro."], siglas: [] },
    f: "El perfil es más compatible con un cuadro depresivo, sin descartar un deterioro cognitivo; se recomienda repetir la MoCA con lentes y reevaluar en seis meses." }
];

function entregasDemo(cuantas){
  const hoy = new Date();
  return DEMO.slice(0, cuantas).map(x => {
    const [hh, mm] = x.h.split(":").map(Number);
    return { cursoGrupo: GRUPOS_CURSO[0], grupo: "Grupo " + x.g,
             enviado: new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate(), hh, mm).toISOString(),
             expediente: x.x, aud: x.aud, hallazgos: x.hal, frase: x.f };
  });
}

/* ============================================================
   4. CARGA (fetch, con JSONP de respaldo)
   ============================================================ */
const MODO_DEMO = FUENTE.url === "PENDIENTE" || /[?&]demo=1\b/.test(location.search);
let demoVisibles = 5;

function direcciones(){
  const lista = [FUENTE.url];
  if (!FUENTE.alterna) return lista;
  const otra = FUENTE.url.indexOf("/a/macros/") !== -1
    ? FUENTE.url.replace(/\/a\/macros\/[^/]+\/s\//, "/macros/s/")
    : FUENTE.url.replace("/macros/s/", "/a/macros/areandina.edu.co/s/");
  if (otra !== FUENTE.url) lista.push(otra);
  return lista;
}

function urlResumen(base, grupo){
  return base + "?tablero=" + encodeURIComponent(FUENTE.caso) + "&curso=" + encodeURIComponent(FUENTE.curso) +
    (grupo ? "&grupo=" + encodeURIComponent(grupo) : "") + "&t=" + Date.now();
}

let contadorCallback = 0;
function pedirJsonp(url){
  return new Promise((resolver, rechazar) => {
    const nombre = "__informe_cb_" + (++contadorCallback);
    const script = document.createElement("script");
    const limpiar = () => { delete window[nombre]; script.remove(); };
    const reloj = setTimeout(() => { limpiar(); rechazar(new Error("sin respuesta a tiempo")); }, 15000);
    window[nombre] = datos => { clearTimeout(reloj); limpiar(); resolver(datos); };
    script.onerror = () => { clearTimeout(reloj); limpiar(); rechazar(new Error("script bloqueado o sin respuesta")); };
    script.src = url + "&callback=" + nombre;
    document.body.appendChild(script);
  });
}

async function pedirResumen(grupo){
  let ultimoFallo = null;
  for (const base of direcciones()) {
    const url = urlResumen(base, grupo);
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (errFetch) {
      try { return await pedirJsonp(url); }
      catch (errScript) { ultimoFallo = new Error("fetch: " + errFetch.message + " · script: " + errScript.message); }
    }
  }
  throw ultimoFallo || new Error("sin dirección");
}

/* ============================================================
   5. PANTALLAS
   ============================================================ */
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const numeroDeGrupo = e => parseInt(String(e.grupo).replace(/\D/g, ""), 10) || 0;
const plural = (n, uno, varios) => n === 1 ? uno : varios;
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
const grupoElegido = () => document.getElementById("f-grupo").value;
const quien = e => (grupoElegido() ? "" : e.cursoGrupo + " · ") + e.grupo;
const COLOR = { mal: "var(--moderate)", bien: "var(--accent)", neutro: "var(--gris)" };
const sinEntregas = `<div class="vacio-msg">Todavía no llegó ninguna entrega de este grupo.</div>`;

function pantallaEnvios(E){
  const orden = E.slice().sort((a, b) => (a.cursoGrupo + numeroDeGrupo(a)).localeCompare(b.cursoGrupo + numeroDeGrupo(b), "es", { numeric: true }));
  const chips = orden.map(e => {
    const hora = e.enviado ? new Date(e.enviado).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
    return `<span class="chip">${esc(quien(e))} · ${esc(EXPEDIENTES[e.expediente] || "—")}${hora ? `<small>${hora}</small>` : ""}</span>`;
  }).join("");
  return `<section class="panel">
    <div class="contador">${E.length}</div>
    <div class="contador-t">${plural(E.length, "equipo envió su informe y su autoauditoría", "equipos enviaron su informe y su autoauditoría")}</div>
    <div class="chips">${chips || '<span class="vacio-msg">Esperando la primera entrega…</span>'}</div>
    <div class="sub">Los resultados están tapados mientras los equipos terminan. Destápalos cuando hayan enviado todos.</div>
    <button class="btn-principal" id="bt-destapar">Destapar resultados</button>
  </section>`;
}

// Una frase por voz, como máximo tres por columna, alternando expedientes para
// que no hable siempre el mismo caso.
function voces(E, globo, lectura){
  const codigos = globo.opciones.filter(o => o[2] === lectura).map(o => o[0]);
  const fuentes = E.filter(e => codigos.includes((e.aud || {})[globo.id]));
  const lista = [];
  fuentes.forEach(e => {
    const frases = globo.id === "pregunta" ? (e.frase ? [e.frase] : []) : ((e.hallazgos || {})[globo.id] || []);
    if (frases.length) lista.push({ quien: EXPEDIENTES[e.expediente] || "—", frase: frases[0] });
  });
  const vistos = {}, orden = [];
  lista.forEach(v => { if (!vistos[v.quien]) { vistos[v.quien] = 1; orden.push(v); } });
  lista.forEach(v => { if (!orden.includes(v)) orden.push(v); });
  return orden.slice(0, 3);
}

let mostrada = {};   // qué globos ya destaparon su práctica recomendada

function pantallaGlobo(E, i){
  const g = GLOBOS[i];
  const cabeza = `<div class="num">Globo ${i + 1} de ${GLOBOS.length} · ${esc(g.tema)}</div><h2>${esc(g.pregunta)}</h2><div class="sub">${esc(g.sub)}</div>`;
  if (!E.length) return `<section class="panel">${cabeza}${sinEntregas}</section>`;

  const n = E.length;
  const filas = g.opciones.map(([cod, rot, lec]) => {
    const c = E.filter(e => (e.aud || {})[g.id] === cod).length;
    return `<div class="fila"><div class="nom">${esc(rot)}</div>
      <div class="bar"><span style="width:${pct(c, n)}%;background:${COLOR[lec]}"></span></div>
      <div class="val">${c} de ${n}</div></div>`;
  }).join("");

  let medio = "";
  if (g.id === "siglas") {
    const cuenta = {};
    E.forEach(e => ((e.hallazgos || {}).siglas || []).forEach(s => cuenta[s] = (cuenta[s] || 0) + 1));
    const orden = Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a]);
    medio = orden.length
      ? `<div class="siglas-chips">${orden.map(s => `<span class="sigla">${esc(s)}<small>×${cuenta[s]}</small></span>`).join("")}</div>`
      : `<div class="vacio-msg" style="margin-top:20px">Ningún informe dejó siglas de la remisión sin su forma completa.</div>`;
  } else {
    const mal = voces(E, g, "mal"), bien = voces(E, g, "bien");
    const col = (clase, titulo, vs, vacio) => `<div class="col-voz ${clase}"><h3>${titulo}</h3>${
      vs.length ? vs.map(v => `<div class="voz"><span class="de">${esc(v.quien)}</span>«${esc(v.frase)}»</div>`).join("")
                : `<div class="vacio-msg">${vacio}</div>`}</div>`;
    medio = `<div class="voces">
      ${col("mal", "Así quedó escrito", mal, "Ningún equipo dejó una frase de este lado.")}
      ${col("bien", "Así lo resolvieron", bien, g.id === "intimo" || g.id === "rumor"
          ? "Quien lo resolvió dejándolo fuera no tiene frase que mostrar."
          : "Ningún equipo dejó una frase de este lado.")}
    </div>`;
  }

  const cierre = mostrada[g.id]
    ? `<div class="afirmacion">${esc(g.principio)}</div><div class="afirmacion-fuente">${esc(g.fuente)}</div>`
    : `<button class="btn-principal" id="bt-principio">Mostrar la práctica recomendada</button>`;

  return `<section class="panel">${cabeza}${filas}${medio}
    <div class="cierre"><div class="rot">Práctica recomendada</div>${cierre}</div>
  </section>`;
}

function pantallaSintesis(E){
  const n = E.length;
  const resueltas = GLOBOS.map(g => {
    const bien = g.opciones.filter(o => o[2] === "bien").map(o => o[0]);
    return { g, c: E.filter(e => bien.includes((e.aud || {})[g.id])).length };
  }).sort((a, b) => a.c - b.c);
  const filas = n ? resueltas.map(r => `<div class="fila"><div class="nom">${esc(r.g.pregunta)}</div>
      <div class="bar"><span style="width:${pct(r.c, n)}%;background:var(--accent)"></span></div>
      <div class="val">${r.c} de ${n}</div></div>`).join("") : sinEntregas;
  return `<section class="panel">
    <div class="num">Cierre</div>
    <div class="sintesis">${esc(SINTESIS)}</div>
    <div class="sub">Cuántos equipos resolvieron cada punto, de menor a mayor.</div>
    ${filas}
  </section>`;
}

const PANTALLAS = GLOBOS.map((g, i) => ({ rotulo: (i + 1) + ". " + g.tema, pintar: E => pantallaGlobo(E, i), globo: g.id }))
  .concat([{ rotulo: "Cierre", pintar: pantallaSintesis }]);

/* ============================================================
   6. ESTADO Y PINTADO
   ============================================================ */
let entregas = [];
let actual = 0;
let firma = "";
let cargando = false;

const claveDestapado = () => "informe_tablero_destapado:" + FUENTE.curso + ":" + (grupoElegido() || "todos");
function destapado(){ try { return sessionStorage.getItem(claveDestapado()) === "1"; } catch (e) { return !!window.__destapado; } }
function fijarDestapado(si){
  try { si ? sessionStorage.setItem(claveDestapado(), "1") : sessionStorage.removeItem(claveDestapado()); }
  catch (e) { window.__destapado = si; }
}
function visibles(){ const g = grupoElegido(); return entregas.filter(e => !g || e.cursoGrupo === g); }

function pintar(){
  const E = visibles();
  const abierto = destapado();
  const cont = document.getElementById("pantalla");
  document.getElementById("nav").hidden = !abierto;
  document.getElementById("pie").hidden = !abierto;
  document.getElementById("bt-tapar").hidden = !abierto;
  if (!abierto) { cont.innerHTML = pantallaEnvios(E); return; }
  document.getElementById("nav").innerHTML = PANTALLAS.map((x, i) =>
    `<button class="pill${i === actual ? " is-on" : ""}" data-ir="${i}">${esc(x.rotulo)}</button>`).join("");
  document.getElementById("cuenta").textContent = `${actual + 1} de ${PANTALLAS.length} · ${E.length} ${plural(E.length, "equipo", "equipos")}`;
  cont.innerHTML = PANTALLAS[actual].pintar(E);
}

function ir(i){ actual = (i + PANTALLAS.length) % PANTALLAS.length; pintar(); window.scrollTo(0, 0); }

function mostrarPrincipio(){
  const id = PANTALLAS[actual].globo;
  if (!id || mostrada[id]) return;
  mostrada[id] = true;
  pintar();
  const caja = document.querySelector(".afirmacion");
  if (caja) caja.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ============================================================
   7. CICLO DE ACTUALIZACIÓN
   ============================================================ */
function avisar(texto, error){
  const el = document.getElementById("estado");
  el.textContent = texto;
  el.classList.toggle("error", !!error);
}

async function actualizar(){
  if (cargando) return;
  cargando = true;
  try {
    let nuevas;
    if (MODO_DEMO) {
      nuevas = entregasDemo(demoVisibles);
      avisar("datos de ejemplo · " + new Date().toLocaleTimeString());
    } else {
      avisar("actualizando…");
      const datos = await pedirResumen(grupoElegido());
      if (!datos || datos.ok === false) throw new Error(datos && datos.error ? datos.error : "respuesta inválida");
      nuevas = Array.isArray(datos.entregas) ? datos.entregas : [];
      avisar("actualizado " + new Date().toLocaleTimeString());
    }
    // Solo se repinta si llegó algo distinto: repintar por repintar movería la
    // pantalla en medio de la discusión.
    const nuevaFirma = JSON.stringify(nuevas);
    if (nuevaFirma !== firma) { firma = nuevaFirma; entregas = nuevas; pintar(); }
  } catch (err) {
    avisar("sin conexión con el receptor — " + err.message, true);
  } finally {
    cargando = false;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const aviso = document.getElementById("js-warning-fallback");
  if (aviso) aviso.style.display = "none";
  try {
    const sel = document.getElementById("f-grupo");
    sel.innerHTML = GRUPOS_CURSO.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("") +
      (GRUPOS_CURSO.length > 1 ? `<option value="">Todos los grupos</option>` : "");
    try {
      const previo = localStorage.getItem("informe_tablero_grupo:" + FUENTE.curso);
      if (previo !== null && [...sel.options].some(o => o.value === previo)) sel.value = previo;
    } catch (e) {}
    sel.addEventListener("change", () => {
      try { localStorage.setItem("informe_tablero_grupo:" + FUENTE.curso, sel.value); } catch (e) {}
      actual = 0; mostrada = {}; firma = ""; entregas = [];
      pintar(); actualizar();
    });

    if (MODO_DEMO) {
      const av = document.getElementById("aviso-demo");
      av.hidden = false;
      av.textContent = FUENTE.url === "PENDIENTE"
        ? "Datos de ejemplo: el receptor todavía no está configurado en este tablero. Sirven para ensayar el cierre."
        : "Datos de ejemplo (?demo=1): nada de esto viene de la hoja de entregas.";
      const goteo = setInterval(() => {
        if (demoVisibles >= DEMO.length) { clearInterval(goteo); return; }
        demoVisibles++; actualizar();
      }, 4000);
    }

    document.addEventListener("click", ev => {
      const b = ev.target.closest("button");
      if (!b) return;
      if (b.id === "bt-destapar") { fijarDestapado(true); actual = 0; pintar(); }
      else if (b.id === "bt-principio") mostrarPrincipio();
      else if (b.dataset.ir !== undefined) ir(Number(b.dataset.ir));
    });
    document.getElementById("bt-ant").addEventListener("click", () => ir(actual - 1));
    document.getElementById("bt-sig").addEventListener("click", () => ir(actual + 1));
    document.getElementById("bt-tapar").addEventListener("click", () => { fijarDestapado(false); pintar(); });
    document.addEventListener("keydown", ev => {
      if (!destapado() || ev.target.tagName === "SELECT") return;
      if (ev.key === "ArrowRight") { ev.preventDefault(); ir(actual + 1); }
      else if (ev.key === "ArrowLeft") { ev.preventDefault(); ir(actual - 1); }
      // Barra espaciadora: destapa la práctica recomendada del globo en pantalla.
      else if ((ev.key === " " || ev.code === "Space") && ev.target.tagName !== "BUTTON") { ev.preventDefault(); mostrarPrincipio(); }
    });

    pintar();
    actualizar();
    setInterval(actualizar, FUENTE.refrescoMs);
  } catch (err) {
    if (aviso) { aviso.style.display = ""; aviso.textContent = "Error al iniciar el tablero: " + err.message; }
  }
});
</script>
