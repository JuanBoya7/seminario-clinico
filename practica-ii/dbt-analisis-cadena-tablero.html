<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis en cadena — Tablero</title><style>
/* ============================================================
   TOKENS — los mismos de la actividad y de los tableros de caso
   ============================================================ */
:root{
  --bg:#ffffff; --surface:#f6f8f8; --surface-alt:#eef2f2; --border:#dde5e5;
  --ink:#16232b; --ink-soft:#4b5c63; --ink-faint:#7d8c91;
  --accent:#1f6f78; --accent-dark:#134349; --accent-soft:#e2eff0;
  --moderate:#b8722a; --moderate-soft:#faf1e4; --severe:#a83f2b; --severe-soft:#fbeae6;
  --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0;}
button{font-family:var(--font-body);}
.wrap{max-width:1240px; margin:0 auto; padding:22px 24px 40px;}
.js-warning{background:var(--severe-soft); border:1px solid var(--severe); color:var(--severe); padding:14px 16px; border-radius:10px; font-size:14px; margin-bottom:20px;}
.aviso-demo{background:var(--moderate-soft); border:1px solid var(--moderate); color:var(--moderate); border-radius:10px; padding:9px 14px; font-size:13.5px; margin-bottom:16px;}
.aviso-demo[hidden]{display:none;}

/* ---- Cabecera ---- */
.cabecera{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:6px;}
.cabecera h1{font-size:26px;}
.controles{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
select{font-family:var(--font-body); font-size:14.5px; font-weight:600; color:var(--ink); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px;}
.bt{font-size:13.5px; font-weight:600; color:var(--ink-soft); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 14px; cursor:pointer;}
.bt:hover{background:var(--surface-alt); color:var(--ink);}
.bt.is-on{background:var(--moderate-soft); border-color:var(--moderate); color:var(--moderate);}
.bt[hidden]{display:none;}
.estado{font-size:12.5px; color:var(--ink-faint); font-family:var(--font-mono);}
.estado.error{color:var(--severe);}

.panel{border:1px solid var(--border); border-radius:16px; padding:26px 30px 30px;}
.panel h2{font-size:clamp(22px,2.4vw,30px);}
.panel .sub{font-size:14.5px; color:var(--ink-faint); margin:6px 0 22px; max-width:70ch;}
.vacio-msg{color:var(--ink-faint); font-size:16px; font-style:italic;}

/* ---- Antes de destapar ---- */
.contador{font-family:var(--font-display); font-size:clamp(72px,11vw,128px); line-height:1; color:var(--accent-dark);}
.contador-t{font-size:18px; color:var(--ink-soft); margin-top:6px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 26px;}
.chip{font-size:14.5px; padding:7px 13px; border-radius:99px; background:var(--accent-soft); color:var(--accent-dark);}
.chip small{font-family:var(--font-mono); font-size:11.5px; margin-left:6px; color:var(--accent);}
.btn-principal{font-size:17px; font-weight:600; color:#fff; background:var(--accent); border:1px solid var(--accent); border-radius:10px; padding:14px 26px; cursor:pointer;}
.btn-principal:hover{background:var(--accent-dark);}

/* ---- Los globos: uno por grupo ---- */
.globos{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:26px 20px; margin:8px auto 0; max-width:780px; justify-items:center;}
@media (max-width:640px){.globos{grid-template-columns:repeat(2,minmax(0,1fr));} .globo{width:150px; height:150px; padding:12px;} .globo .p{font-size:18px;}}
.globo{width:190px; height:190px; border-radius:50%; border:3px solid var(--accent); background:var(--accent-soft);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px;
  cursor:pointer; color:var(--accent-dark); transition:transform .15s, box-shadow .15s; font-family:var(--font-body);}
.globo:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(19,67,73,.18);}
.globo .g{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;}
.globo .p{font-family:var(--font-display); font-size:21px; font-weight:600; line-height:1.15; margin:6px 0 4px;}
.globo .t{font-size:13px; line-height:1.3; color:var(--ink-soft);}
.globo.sin{border-style:dashed; border-color:var(--border); background:var(--surface); color:var(--ink-faint); cursor:default;}
.globo.sin:hover{transform:none; box-shadow:none;}
.globo.sin .t{color:var(--ink-faint);}

/* ---- El detalle de un grupo: relato arriba, cadena debajo ---- */
.volver{margin-bottom:16px;}
.relato{font-family:var(--font-display); font-size:clamp(17px,1.6vw,21px); line-height:1.55; color:var(--ink);
  background:var(--surface); border-left:5px solid var(--accent); border-radius:0 12px 12px 0; padding:16px 22px; margin:14px 0 26px; max-width:none;}
.persona{font-family:var(--font-mono); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent);}

/* Cadena: cuatro eslabones arriba que avanzan a la derecha, la vuelta y cuatro abajo que regresan. */

/* ============================================================
   3. DATOS DE EJEMPLO (?demo=1)
   ============================================================ */
function entregasDemo(){
  const errores = { 2: ["emociones", "impulso"], 4: ["corto", "largo"] };
  return [1, 2, 3, 4, 5].map(g => {
    const s = SIT[(g - 1) % SIT.length];
    const letras = KEYS.map(k => s.clave[k]);
    (errores[g] ? [errores[g]] : []).forEach(([a, b]) => {
      const i = KEYS.indexOf(a), j = KEYS.indexOf(b);
      [letras[i], letras[j]] = [letras[j], letras[i]];
    });
    return { cursoGrupo: GRUPOS_CURSO[0], grupo: "Grupo " + g, enviado: new Date().toISOString(), eslabones: letras,
             nivel: "", intervencion: ["impulso", "pensamientos", "pensamientos", "evento", "impulso"][g - 1],
             habilidad: ["STOP", "Verificar los hechos", "Verificar los hechos", "DEAR MAN", "STOP"][g - 1],
             aplicacion: "Detenerse, respirar y no actuar hasta que baje la rabia." };
  });
}

/* ============================================================
   4. CARGA (fetch, con JSONP de respaldo; las dos formas de la dirección)
   ============================================================ */
const MODO_DEMO = FUENTE.url === "PENDIENTE" || /[?&]demo=1\b/.test(location.search);
function direcciones(){
  const lista = [FUENTE.url];
  if (!FUENTE.alterna) return lista;
  const otra = FUENTE.url.indexOf("/a/macros/") !== -1
    ? FUENTE.url.replace(/\/a\/macros\/[^/]+\/s\//, "/macros/s/")
    : FUENTE.url.replace("/macros/s/", "/a/macros/areandina.edu.co/s/");
  if (otra !== FUENTE.url) lista.push(otra);
  return lista;
}
function urlResumen(base, grupo){
  return base + "?tablero=" + encodeURIComponent(FUENTE.caso) + "&curso=" + encodeURIComponent(FUENTE.curso) +
    (grupo ? "&grupo=" + encodeURIComponent(grupo) : "") + "&t=" + Date.now();
}
let contadorCallback = 0;
function pedirJsonp(url){
  return new Promise((resolver, rechazar) => {
    const nombre = "__dbt_cb_" + (++contadorCallback);
    const script = document.createElement("script");
    const limpiar = () => { delete window[nombre]; script.remove(); };
    const reloj = setTimeout(() => { limpiar(); rechazar(new Error("sin respuesta a tiempo")); }, 15000);
    window[nombre] = datos => { clearTimeout(reloj); limpiar(); resolver(datos); };
    script.onerror = () => { clearTimeout(reloj); limpiar(); rechazar(new Error("script bloqueado o sin respuesta")); };
    script.src = url + "&callback=" + nombre;
    document.body.appendChild(script);
  });
}
async function pedirResumen(grupo){
  let ultimoFallo = null;
  for (const base of direcciones()) {
    const url = urlResumen(base, grupo);
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (errFetch) {
      try { return await pedirJsonp(url); }
      catch (errScript) { ultimoFallo = new Error("fetch: " + errFetch.message + " · script: " + errScript.message); }
    }
  }
  throw ultimoFallo || new Error("sin dirección");
}

/* ============================================================
   5. PANTALLAS
   ============================================================ */
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const numeroDeGrupo = e => parseInt(String(e.grupo).replace(/\D/g, ""), 10) || 0;
const plural = (n, uno, varios) => n === 1 ? uno : varios;
// En la lectura docente, las habilidades van en negrita para que se vean entre el texto.
const HABILIDADES_RESALTAR = ["STOP", "TIP", "aceptación radical", "mente sabia", "verificar los hechos",
  "acción opuesta", "ACA CUIDA", "DEAR MAN", "AVES", "VIDA", "validar"];
const LETRA = "A-Za-zÁÉÍÓÚáéíóúÑñ";
const resaltar = t => HABILIDADES_RESALTAR.reduce((html, h) =>
  html.replace(new RegExp("(^|[^" + LETRA + "])(" + h + ")(?![" + LETRA + "])", "gi"), "$1<b>$2</b>"), esc(t));
const situacionDe = n => SIT[(Math.max(1, n) - 1) % SIT.length];
// Entregas de esta actividad: cada eslabón es una letra. Las del caso Valeria, que siguen en la
// misma pestaña de la hoja, traen texto libre y no se muestran.
const esNueva = e => Array.isArray(e.eslabones) && e.eslabones.length === 8 && e.eslabones.every(x => /^[A-J]$/.test(String(x).trim()));

let entregas = [], destapado = false, abierto = 0, verClave = false;

function porGrupo(){
  const m = {};
  entregas.filter(esNueva).forEach(e => { const n = numeroDeGrupo(e); if (n) m[n] = e; });
  return m;
}

function pantallaEspera(){
  const m = porGrupo(), nums = Object.keys(m).map(Number).sort((a, b) => a - b);
  const chips = nums.map(n => `<span class="chip">Grupo ${n}<small>${esc(situacionDe(n).nombre)}</small></span>`).join("");
  return `<section class="panel">
    <div class="contador">${nums.length}</div>
    <div class="contador-t">${plural(nums.length, "grupo envió su cadena", "grupos enviaron su cadena")}</div>
    <div class="chips">${chips || '<span class="vacio-msg">Esperando la primera entrega…</span>'}</div>
    <p class="sub">Las cadenas están tapadas para que ningún grupo ajuste la suya a la de los demás. Destápenlas cuando hayan enviado todos.</p>
    <button class="btn-principal" id="bt-destapar">Destapar las cadenas</button>
  </section>`;
}

function pantallaGlobos(){
  const m = porGrupo();
  const nums = Array.from(new Set([1, 2, 3, 4, 5, 6].concat(Object.keys(m).map(Number)))).sort((a, b) => a - b);
  const globos = nums.map(n => {
    const s = situacionDe(n), e = m[n];
    return e
      ? `<button class="globo" data-g="${n}"><span class="g">Grupo ${n}</span><span class="p">${esc(s.nombre)}</span><span class="t">${esc(s.titulo)}</span></button>`
      : `<div class="globo sin"><span class="g">Grupo ${n}</span><span class="p">${esc(s.nombre)}</span><span class="t">Sin envío</span></div>`;
  }).join("");
  return `<section class="panel"><h2>Las cadenas del curso</h2>
    <p class="sub">Abran el globo de cada grupo: arriba la situación, debajo la cadena tal como la armaron.</p>
    <div class="globos">${globos}</div></section>`;
}

function eslabonHtml(e, s, i){
  const letra = String(e.eslabones[i] || "").trim();
  const texto = s.letras[letra];
  const k = KEYS[i];
  const ok = letra === s.clave[k];
  let cls = "eslabon p" + (i + 1);
  if (k === "conducta") cls += " conducta";
  if (k === e.intervencion) cls += " corte" + (i < 3 ? "" : i === 3 ? " abajo" : " izq");
  const marca = verClave ? `<span class="marca ${ok ? "ok" : "mal"}">${ok ? "✓" : "✗"}</span>` : "";
  const tijera = k === e.intervencion ? `<span class="tijera">Aquí la cortan</span>` : "";
  return `<div class="${cls}">${tijera}${marca}<div class="in"><span class="n">${esc(NOMBRES[i])}</span>
    <span class="x${texto ? "" : " vacio"}">${texto ? esc(texto) : "sin dato"}</span></div></div>`;
}

function pantallaDetalle(n){
  const e = porGrupo()[n], s = situacionDe(n);
  if (!e) { abierto = 0; return pantallaGlobos(); }
  const uniones = [1, 2, 3, 4, 5, 6, 7].map(u => `<div class="union${u === 4 ? " v" : ""} u${u}"></div>`).join("");
  const eslabones = KEYS.map((_, i) => eslabonHtml(e, s, i)).join("");
  const donde = NOMBRES[KEYS.indexOf(e.intervencion)] || e.intervencion || "—";
  const usadas = e.eslabones.map(x => String(x).trim());
  const sobrantes = s.sobran.map(l => `«${esc(s.letras[l])}»${usadas.includes(l) ? " (quedó dentro de la cadena)" : ""}`).join(" y ");
  const aciertos = KEYS.filter((k, i) => String(e.eslabones[i]).trim() === s.clave[k]).length;
  // Lo que no coincide va en el panel, no dentro del eslabón: el hueco no da para dos textos.
  const fuera = KEYS.map((k, i) => String(e.eslabones[i]).trim() === s.clave[k] ? ""
    : `<li><b>${esc(NOMBRES[i])}:</b> ${esc(s.letras[s.clave[k]])}</li>`).join("");
  const clave = verClave ? `<div class="clave-panel"><span class="r">Clave</span>
      <p><b>${aciertos} de 8</b> datos en su eslabón. Los que sobran: ${sobrantes}.</p>
      ${fuera ? `<ul>${fuera}</ul>` : ""}
      <p><b>Un corte posible:</b> ${resaltar(s.corte)}</p></div>` : "";
  return `<section class="panel">
    <button class="bt volver" id="bt-volver">&larr; Volver a los globos</button>
    <div class="eyebrow">Grupo ${n}</div>
    <h2>${esc(s.titulo)}</h2>
    <div class="persona">${esc(s.persona)}</div>
    <p class="relato">${esc(s.texto)}</p>
    <div class="cadena">${eslabones}${uniones}</div>
    <div class="corte-panel">
      <span class="r">Cortan en</span><span class="v"><b>${esc(donde)}</b></span>
      <span class="r">Con</span><span class="hab">${esc(e.habilidad || "—")}</span>
      <span class="r">Cómo</span><span class="v">${esc(e.aplicacion || "—")}</span>
    </div>${clave}
  </section>`;
}

function pintar(){
  const p = document.getElementById("pantalla");
  p.innerHTML = !destapado ? pantallaEspera() : abierto ? pantallaDetalle(abierto) : pantallaGlobos();
  document.getElementById("bt-tapar").hidden = !destapado;
  const bc = document.getElementById("bt-clave");
  bc.hidden = !(destapado && abierto);
  bc.textContent = verClave ? "Ocultar la clave" : "Mostrar la clave";
  bc.classList.toggle("is-on", verClave);
  const d = document.getElementById("bt-destapar");
  if (d) d.addEventListener("click", () => { destapado = true; pintar(); });
  p.querySelectorAll(".globo[data-g]").forEach(g => g.addEventListener("click", () => { abierto = Number(g.dataset.g); verClave = false; pintar(); window.scrollTo(0, 0); }));
  const v = document.getElementById("bt-volver");
  if (v) v.addEventListener("click", () => { abierto = 0; verClave = false; pintar(); });
}

/* ============================================================
   6. ACTUALIZACIÓN
   ============================================================ */
async function actualizar(){
  const estado = document.getElementById("estado");
  const grupo = document.getElementById("f-grupo").value;
  if (MODO_DEMO) { entregas = entregasDemo(); estado.textContent = "datos de ejemplo"; pintar(); return; }
  try {
    const datos = await pedirResumen(grupo);
    if (!datos || datos.ok === false) throw new Error((datos && datos.error) || "respuesta vacía");
    if (document.getElementById("f-grupo").value !== grupo) return;
    entregas = datos.entregas || [];
    estado.textContent = "actualizado " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    estado.classList.remove("error");
  } catch (err) {
    estado.textContent = "no fue posible leer la hoja";
    estado.classList.add("error");
  }
  // Mientras un grupo expone, el refresco no le cambia la pantalla: solo actualiza los datos.
  pintar();
}

/* ============================================================
   7. INICIALIZACIÓN
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  const warn = document.getElementById("js-warning-fallback");
  if (warn) warn.style.display = "none";
  try {
    const sel = document.getElementById("f-grupo");
    sel.innerHTML = GRUPOS_CURSO.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
    sel.addEventListener("change", () => { entregas = []; destapado = false; abierto = 0; verClave = false; pintar(); actualizar(); });
    document.getElementById("bt-tapar").addEventListener("click", () => { destapado = false; abierto = 0; verClave = false; pintar(); });
    document.getElementById("bt-clave").addEventListener("click", () => { verClave = !verClave; pintar(); });
    if (MODO_DEMO) {
      const aviso = document.getElementById("aviso-demo");
      aviso.hidden = false;
      aviso.textContent = "Modo de ensayo: se muestran datos de ejemplo, no las entregas reales.";
    }
    pintar();
    actualizar();
    setInterval(actualizar, FUENTE.refrescoMs);
  } catch (err) {
    if (warn) { warn.style.display = "block"; warn.textContent = "Ocurrió un error al iniciar el tablero: " + (err && err.message ? err.message : err); }
  }
});
