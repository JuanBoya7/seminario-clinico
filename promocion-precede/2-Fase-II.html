<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparación de la Fase II — Tres preguntas para el salón</title>
<style>
/* ============================================================
   TOKENS
   Estructura tomada del deck de cierre del tamizaje
   (4-Tamizaje-SRQ-debate.html): los dos son recursos de
   proyección y se manejan igual. Lo que cambia es el acento,
   que acá es el de la Fase II en la página de lineamientos de
   programas de promoción en salud, para que se distinga de un
   vistazo del deck del diagnóstico preliminar, que es rojo.
   ============================================================ */
:root{
  --bg:#ffffff;
  --surface:#faf7f0;
  --surface-alt:#f3ede2;
  --border:#e4ddd0;
  --ink:#201d18;
  --ink-soft:#5c5648;
  --ink-faint:#8a8272;
  --accent:#4e8598;
  --accent-dark:#2f5d6e;
  --accent-soft:#eaf3f5;
  --font-display:"Spectral","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cat1:#b4531c;
  --cat1-soft:#f8ece2;
  --cat2:#1f6f8b;
  --cat2-soft:#e6f0f3;
  --cat3:#6b4c9a;
  --cat3-soft:#efeaf7;
  --radius:14px;
  --shadow-card:0 1px 2px rgba(32,29,24,0.04), 0 6px 22px rgba(32,29,24,0.07);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink);}

/* ============================================================
   PORTADA
   ============================================================ */
.wrap{
  max-width:1180px; margin:0 auto;
  padding:clamp(30px,6vh,64px) 32px 80px;
  min-height:100vh;
  display:flex; flex-direction:column; justify-content:center;
}

.globos{
  display:grid;
  grid-template-columns:repeat(2,minmax(300px,1fr));
  gap:38px 30px;
}

/* Con un número impar de globos el último quedaría solo contra el margen
   izquierdo. Se lo pasa a fila completa y se lo centra. */
.globos > .globo:last-child:nth-child(odd){
  grid-column:1 / -1;
  justify-self:center;
  width:calc(50% - 15px);
}

@media (max-width:820px){
  .globos{grid-template-columns:1fr; gap:32px 0;}
  .globos > .globo:last-child:nth-child(odd){grid-column:auto; width:100%;}
}

.globo{
  position:relative;
  display:block; width:100%; text-align:left;
  font-family:var(--font-display);
  font-size:clamp(19px,1.85vw,23px);
  line-height:1.34; letter-spacing:-.005em;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  padding:26px 26px 30px;
  cursor:pointer;
  box-shadow:var(--shadow-card);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.globo:hover, .globo:focus-visible{
  transform:translateY(-3px);
  box-shadow:0 2px 4px rgba(32,29,24,.05), 0 14px 30px rgba(32,29,24,.11);
  background:var(--bg);
  outline:none;
}
.globo:focus-visible{border-color:var(--accent);}

/* La colita del bocadillo. Dos capas: el borde y el relleno encima. */
.globo::before, .globo::after{
  content:""; position:absolute; left:34px; width:0; height:0;
  border-style:solid;
}
.globo::before{
  bottom:-15px;
  border-width:15px 15px 0 0;
  border-color:var(--border) transparent transparent transparent;
}
.globo::after{
  bottom:-13px;
  border-width:13px 13px 0 0;
  border-color:var(--surface) transparent transparent transparent;
  transition:border-top-color .16s ease;
}
.globo:hover::after, .globo:focus-visible::after{border-top-color:var(--bg);}

.globo .num{
  display:block;
  font-family:var(--font-body);
  font-size:11.5px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
  color:var(--accent); margin-bottom:13px;
}
.globo .pie{
  display:block; margin-top:16px;
  font-family:var(--font-body);
  font-size:12.5px; font-weight:500; color:var(--ink-faint);
}

/* La tarjeta de cierre no es una pregunta al salón: sin colita y con el
   borde en el acento, para que se lea como otra cosa. */
.globo.utilitaria{
  background:var(--bg);
  border-color:var(--accent-soft);
  border-width:2px;
}
.globo.utilitaria::before, .globo.utilitaria::after{display:none;}

/* ============================================================
   VISTA DE PROYECCIÓN
   ============================================================ */
.escena{
  position:fixed; inset:0; z-index:50;
  background:var(--bg);
  display:none;
  flex-direction:column;
}
.escena.abierta{display:flex;}

.escena-barra{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 26px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.escena-barra .cuenta{
  font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint);
}
.escena-barra .btns{display:flex; align-items:center; gap:8px;}
.bt{
  font-family:var(--font-body); font-size:13.5px; font-weight:600;
  color:var(--ink-soft); background:var(--bg);
  border:1px solid var(--border); border-radius:8px;
  padding:7px 14px; cursor:pointer;
  transition:background .14s, color .14s, border-color .14s;
}
.bt:hover{background:var(--surface-alt); color:var(--ink);}
.bt.primario{background:var(--accent); border-color:var(--accent); color:#fff;}
.bt.primario:hover{background:var(--accent-dark); border-color:var(--accent-dark); color:#fff;}

.escena-cuerpo{
  flex:1 1 auto; overflow-y:auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:clamp(24px,4vh,56px) clamp(20px,5vw,64px) 40px;
}
.escena-inner{width:100%; max-width:1000px;}

/* Etapa 1: la pregunta sola, mientras el grupo la responde en la hoja. */
.q-texto{
  font-family:var(--font-display);
  font-size:clamp(28px,3.9vw,50px);
  line-height:1.2; letter-spacing:-.015em;
  color:var(--ink);
  max-width:none;
  transition:font-size .22s ease, max-width .22s ease;
}
.q-texto.ancha{max-width:none;}

/* Etapa 2: ya se respondió y se discutió. La pregunta baja a encabezado y
   el cuerpo deja de centrarse verticalmente — si no, con contenido más
   alto que la pantalla la primera línea queda fuera del scroll. */
.escena.revelado .escena-cuerpo{justify-content:flex-start;}
.escena.revelado .q-texto,
.escena.revelado .q-texto.ancha{
  font-size:clamp(20px,2.2vw,29px);
  max-width:none;
  color:var(--ink-soft);
}

/* La tarjeta de cierre no es una pregunta destapada: nada estuvo oculto,
   así que el título se queda a tamaño de portada y el bloque se centra.
   El centrado va por margen automático y no por justify-content: con
   centrado real, un contenido más alto que la pantalla desborda por
   arriba y la primera línea queda fuera del alcance del scroll. */
.escena.cierre .escena-inner{margin-block:auto;}
.escena.cierre .q-texto,
.escena.cierre .q-texto.ancha{
  font-size:clamp(26px,3.4vw,44px);
  max-width:none;
  color:var(--ink);
  margin-bottom:clamp(26px,4.5vh,44px);
}
.escena.cierre .paso .paso-r{font-size:clamp(13px,1.4vw,16.5px);}

.revelar-zona{margin-top:clamp(28px,5vh,52px);}
.revelar-zona .nota{
  margin-top:14px; font-size:13px; color:var(--ink-faint); max-width:none;
}

/* Etapa 2: la puesta en común. */
.explica{
  margin-top:clamp(26px,4vh,44px);
  padding-top:clamp(24px,3.5vh,38px);
  border-top:1px solid var(--border);
}
.explica[hidden]{display:none;}

.idea{
  font-family:var(--font-display);
  font-size:clamp(21px,2.5vw,31px);
  line-height:1.32; letter-spacing:-.01em;
  color:var(--accent-dark);
  background:var(--accent-soft);
  border-radius:var(--radius);
  padding:22px 26px;
  max-width:none;
}

.porque{margin-top:clamp(22px,3vh,32px);}
.porque ul{margin:0; padding:0; list-style:none;}
.porque li{
  position:relative;
  padding-left:26px; margin-bottom:15px;
  font-size:clamp(16px,1.7vw,21px);
  line-height:1.5; color:var(--ink-soft);
  max-width:none;
}
.porque li:last-child{margin-bottom:0;}
.porque li::before{
  content:""; position:absolute; left:6px; top:.62em;
  width:7px; height:7px; border-radius:50%; background:var(--accent);
}
.porque li strong{color:var(--ink); font-weight:600;}

/* El puente con la Fase II: cada pregunta es uno de sus tres puntos, y
   los ítems son los que la rúbrica va a evaluar en la sustentación. */
.punto{
  margin-top:clamp(26px,3.6vh,38px);
  border:1px solid var(--border);
  border-left:4px solid var(--accent);
  border-radius:var(--radius);
  background:var(--surface);
  padding:20px 24px;
  max-width:none;
}
.punto .punto-r{
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent);
}
.punto .punto-t{
  font-family:var(--font-display);
  font-size:clamp(18px,2vw,26px); line-height:1.22;
  margin-top:6px; color:var(--ink);
}
.punto .punto-items{
  display:flex; flex-wrap:wrap; gap:7px;
  margin-top:14px;
}
.punto .punto-items span{
  padding:6px 12px; border-radius:999px;
  background:var(--bg); border:1px solid var(--border);
  font-size:clamp(12.5px,1.3vw,14.5px); font-weight:500; color:var(--ink-soft);
}

/* --- Panel de cierre --------------------------------------------- */
.panel-cierre[hidden]{display:none;}
.banda{
  font-size:clamp(13px,1.35vw,16px); color:var(--ink-soft);
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 18px; margin-bottom:22px;
}
.banda strong{color:var(--ink);}

.cadena{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}
.paso{
  position:relative;
  border-top:3px solid var(--accent);
  padding:14px 12px 0 0;
}
.paso .paso-n{
  font-size:11px; font-weight:700; letter-spacing:.15em;
  color:var(--accent); text-transform:uppercase;
}
.paso .paso-t{
  font-family:var(--font-display);
  font-size:clamp(19px,2.2vw,28px); line-height:1.2;
  margin-top:6px; color:var(--ink);
}
.paso .paso-r{
  margin-top:10px;
  font-size:clamp(12.5px,1.3vw,15px); line-height:1.45;
  color:var(--ink-soft);
}
.paso:not(:last-child)::after{
  content:"→";
  position:absolute; right:-4px; top:-2px;
  transform:translateY(-55%);
  font-size:20px; line-height:1; color:var(--accent);
}
@media (max-width:820px){
  .cadena{grid-template-columns:1fr; gap:20px;}
  .paso:not(:last-child)::after{content:"↓"; right:auto; left:0; top:auto; bottom:-18px; transform:none;}
}

.regla{
  margin-top:clamp(26px,4vh,40px);
  font-family:var(--font-display);
  font-size:clamp(20px,2.4vw,30px); line-height:1.32;
  color:var(--accent-dark); background:var(--accent-soft);
  border-radius:var(--radius); padding:24px 28px;
  max-width:none;
}

/* La tarjeta de rotación reusa el panel del cierre, pero sus tres
   columnas no son una secuencia —son tres preguntas simultáneas sobre
   la misma hoja—, así que pierden las flechas. */
.escena.rotacion .cadena{grid-template-columns:repeat(3,1fr);}
.escena.rotacion .paso:not(:last-child)::after{content:none;}
.escena.rotacion .paso .paso-t{font-size:clamp(18px,2vw,25px);}
@media (max-width:820px){
  .escena.rotacion .cadena{grid-template-columns:1fr;}
}

/* ============================================================
   LA FASE — material de consulta

   Vive debajo de la cuadrícula y nunca se proyecta: la escena es un
   overlay a pantalla completa, así que esto solo lo ve quien abre el
   archivo. Por eso la rúbrica y el marco de evaluación pueden estar acá
   sin estorbar en el salón, y por eso el deck se puede repartir.
   ============================================================ */
.pagina{max-width:1180px; margin:0 auto; padding:0 32px 90px;}

.tira{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px;
  padding:18px 22px; margin-bottom:clamp(34px,6vh,58px);
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--accent-soft);
}
.tira .tira-f{
  font-family:var(--font-display); font-size:clamp(18px,2vw,25px);
  line-height:1.2; color:var(--accent-dark);
}
.tira .tira-d{font-size:13.5px; color:var(--ink-soft);}
.tira .tira-p{
  margin-left:auto; font-family:var(--font-display); font-weight:600;
  font-size:clamp(18px,2vw,25px); color:var(--accent-dark);
}
@media (max-width:600px){ .tira .tira-p{margin-left:0;} }

.seccion{margin-bottom:clamp(38px,7vh,68px);}
.seccion[hidden]{display:none;}
.seccion-r{
  font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
  color:var(--accent); margin-bottom:8px;
}
.seccion-t{
  font-family:var(--font-display); font-size:clamp(22px,2.6vw,31px);
  line-height:1.2; letter-spacing:-.01em; color:var(--ink);
}
.seccion-s{margin-top:11px; max-width:none; font-size:14.5px; line-height:1.65; color:var(--ink-soft);}
.seccion-s p{margin:0 0 10px;}
.seccion-s p:last-child{margin-bottom:0;}
.seccion-s strong{color:var(--ink); font-weight:600;}

/* --- Entregables ------------------------------------------------ */
.entregables{margin-top:24px; display:grid; gap:12px;}
.ent{
  border:1px solid var(--border); border-left:4px solid var(--accent);
  border-radius:var(--radius); background:var(--surface); padding:16px 20px;
}
.ent-n{
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent);
}
.ent-t{
  font-family:var(--font-display); font-size:clamp(17px,1.8vw,22px);
  line-height:1.25; margin-top:4px; color:var(--ink);
}
.ent-i{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
/* La etiqueta dentro de un ítem: versalitas y cuerpo pequeño, para que
   acompañe a la frase sin competir con ella. */
.ent-i span .et, .punto-items span .et{
  display:inline-block; margin:0 0 0 5px; vertical-align:1px;
  padding:1px 6px; border:none; border-radius:999px;
  background:var(--surface-alt);
  font-size:9.5px; font-weight:600; line-height:1.5;
  letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-faint);
}
.ent-i span .et:first-of-type, .punto-items span .et:first-of-type{margin-left:9px;}
.ent-i span i{
  font-style:normal; font-weight:700; font-size:11px;
  color:var(--accent); margin-right:7px;
}
.ent-i span{
  padding:5px 11px; border-radius:999px;
  background:var(--bg); border:1px solid var(--border);
  font-size:13px; color:var(--ink-soft);
}

/* --- Rúbrica ---------------------------------------------------- */
.rub{margin-top:24px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.rub details{border-bottom:1px solid var(--border);}
.rub details:last-child{border-bottom:none;}
.rub summary{
  list-style:none; cursor:pointer;
  display:flex; align-items:center; gap:14px;
  padding:14px 18px; background:var(--bg);
  font-size:15px; font-weight:600; color:var(--ink);
}
.rub summary::-webkit-details-marker{display:none;}
.rub summary:hover{background:var(--surface);}
.rub summary .peso{margin-left:auto; font-family:var(--font-display); color:var(--accent);}
.rub summary::after{content:"+"; color:var(--accent); font-size:19px; line-height:1; width:1ch;}
.rub details[open] summary::after{content:"\2013";}
.rub .niveles{padding:4px 18px 18px; background:var(--surface); display:grid; gap:9px;}
.rub .nivel{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start;}
.rub .nivel b{
  font-family:var(--font-display); font-size:15px;
  color:var(--accent-dark); background:var(--accent-soft);
  border-radius:7px; padding:3px 0; min-width:3ch; text-align:center;
}
.rub .nivel span{font-size:14px; line-height:1.5; color:var(--ink-soft);}
.rub-pie{margin-top:12px; font-size:12.5px; color:var(--ink-faint);}

/* --- El marco de intervención ----------------------------------- */
/* Dos bloques, no una lista de seis. No compiten entre sí: el
   determinante dice sobre qué causa modificable se actúa y el estadio
   en qué momento se entra, así que cada grupo elige uno de cada uno.
   Entre los dos va un puente que enuncia la relación.

   Cada bloque es un desplegable, como los grupos del recurso de
   pruebas de tamizaje. Plegados, los dos caben en una sola pantalla y
   se leen como lo que son —las dos decisiones que hay que tomar antes
   de diseñar—, en vez de como seis opciones sueltas. El resumen
   conserva la línea que dice de qué decide el bloque, que es lo que
   permite elegir cuál abrir sin abrirlos todos.

   La regla de estilo del bloque 'como' se conserva: el marco puede
   volver a crecer, y sin ella habría que reponerla. */
.mrc-grupo{margin-top:22px;}
.mrc-grupo > summary{
  list-style:none; cursor:pointer;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface); padding:17px 20px 19px;
  transition:background .14s, border-color .14s;
}
.mrc-grupo > summary::-webkit-details-marker{display:none;}
.mrc-grupo > summary:hover{background:var(--surface-alt); border-color:var(--accent-soft);}
.mrc-grupo[open] > summary{
  border-bottom-left-radius:0; border-bottom-right-radius:0;
  border-color:var(--accent-soft); background:var(--accent-soft);
}
.mrc-grupo > summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.mrc-eje{
  display:inline-block;
  padding:3px 12px; border-radius:999px;
  background:var(--accent); color:#fff;
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
}
.mrc-grupo.como .mrc-eje{background:var(--ink-soft);}
.mrc-cab{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:10px;}
.mrc-cab h3{
  font-family:var(--font-display); font-size:clamp(19px,2.1vw,26px);
  line-height:1.2; color:var(--ink);
}
.mrc-cab .n{
  font-size:12px; font-weight:600; color:var(--ink-faint);
  background:var(--bg); border:1px solid var(--border);
  border-radius:999px; padding:2px 10px;
}
/* El signo cambia con el estado: es la única señal de que hay más. */
.mrc-cab .mas{
  margin-left:auto; flex:none;
  font-size:20px; line-height:1; color:var(--accent); font-weight:400;
}
.mrc-grupo[open] .mrc-cab .mas::after{content:"\2013";}
.mrc-grupo:not([open]) .mrc-cab .mas::after{content:"+";}
.mrc-grupo.como .mrc-cab .mas{color:var(--ink-soft);}
/* La línea del resumen: de qué decide el bloque, en una frase. */
.mrc-sub{
  margin:9px 0 0; max-width:none;
  font-size:14px; line-height:1.6; color:var(--ink-soft);
}
.mrc-cuerpo{
  border:1px solid var(--accent-soft); border-top:none;
  border-radius:0 0 var(--radius) var(--radius);
  padding:2px 20px 24px;
}
.mrc-lead{
  margin:18px 0 0; max-width:none;
  font-size:14px; line-height:1.6; color:var(--ink-soft);
}
.mrc-lead strong{color:var(--ink); font-weight:600;}

/* El nombre del marco, desplegado letra por letra. Las dos mitades van
   en columnas para que se vea el reparto —antes y después— y las tres
   primeras letras van encendidas porque son las tres categorías que el
   estudiante acaba de leer: ese es el remate. */
.acr{
  margin-top:26px; padding:22px 24px 24px;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--bg);
}
.acr-r{
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint);
}
.acr-n{
  margin-top:7px;
  font-family:var(--font-display); font-size:clamp(24px,3.2vw,38px);
  line-height:1.05; letter-spacing:-.01em;
}
.acr-n .a{color:var(--accent);}
.acr-n .g{color:var(--ink-faint); font-weight:400;}
.acr-n .b{color:var(--ink);}
/* La autoría va bajo el nombre, en cuerpo pequeño: identifica el marco
   sin competir con el título. */
.acr-aut{
  margin-top:5px;
  font-size:13px; font-style:italic; color:var(--ink-faint);
}
/* Las referencias, con sangría francesa. Van en la última sección de la
   página: dentro del marco cortaban la explicación. */
.refs{margin-top:22px; font-size:13px; line-height:1.65; color:var(--ink-soft);}
.refs div{padding-left:26px; text-indent:-26px; margin-bottom:11px;}
.refs div:last-child{margin-bottom:0;}
.refs i{font-style:italic;}
.acr-s{
  margin:11px 0 0; max-width:none;
  font-size:14px; line-height:1.6; color:var(--ink-soft);
}
.acr-s strong{color:var(--ink); font-weight:600; font-style:italic;}
.acr-g{
  margin-top:20px; display:grid; gap:20px 28px;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
}
.acr-h{
  font-family:var(--font-display); font-size:17px; color:var(--ink);
  padding-bottom:7px; border-bottom:1px solid var(--border);
}
.acr-h span{
  display:block; margin-top:3px;
  font-family:var(--font-body); font-size:12.5px; font-weight:500;
  color:var(--ink-faint);
}
/* La frase de la que sale la sigla. Va entera y con las iniciales
   resaltadas dentro: así se lee que es una oración y no una lista de
   componentes, que era lo que confundía. Las tres primeras van en
   acento porque son las causas; las otras cuatro solo nombran lo que se
   hace con ellas. */
.acr-f{
  margin-top:12px;
  font-size:clamp(14px,1.5vw,16.5px); line-height:1.75; color:var(--ink-soft);
}
.acr-f span{white-space:nowrap;}
.acr-f b{
  font-family:var(--font-display); font-size:1.32em; font-weight:600;
  color:var(--ink-faint); line-height:1;
}
.acr-f .on{color:var(--ink); font-weight:600;}
.acr-f .on b{color:var(--accent);}
.acr-es{
  margin-top:10px; padding-left:11px;
  border-left:2px solid var(--border);
  font-size:13px; line-height:1.55; color:var(--ink-faint);
}
.acr-pie{
  margin-top:18px; padding-top:14px; border-top:1px solid var(--border);
  font-size:13.5px; line-height:1.55; color:var(--ink-soft);
}

/* El puente: una línea rotulada que dice cómo se relacionan los dos
   bloques. Es lo único que impide leerlos como dos listas sueltas. */
.mrc-puente{
  display:flex; align-items:center; gap:14px;
  margin:26px 0 0;
  font-size:13px; font-weight:600; color:var(--ink-faint);
}
.mrc-puente::before, .mrc-puente::after{
  content:""; flex:1; height:1px; background:var(--border);
}

.mrc{
  margin-top:20px; display:grid;
  grid-template-columns:repeat(auto-fit,minmax(235px,1fr)); gap:16px 20px;
}
.mrc-c{border-top:3px solid var(--accent); padding:13px 0 0;}
.mrc-grupo.como .mrc-c{border-top-color:var(--ink-faint);}
.mrc-t{
  font-family:var(--font-display); font-size:clamp(17px,1.8vw,21px);
  line-height:1.25; color:var(--ink);
}
.mrc-e{margin-top:9px; font-size:14px; line-height:1.55; color:var(--ink-soft);}
/* Las pildoras son botones: cada una guarda la definicion de su fase o
   de su actividad, y se abre al presionarla. La definicion no vive en
   un tooltip porque en el salon se proyecta y se lee en voz alta; tiene
   que quedar en pantalla hasta que alguien la cierre. */
.mrc-x{margin-top:11px; display:flex; flex-wrap:wrap; gap:6px;}
.mrc-x button{
  padding:4px 10px 4px 24px; border-radius:999px;
  background:var(--surface); border:1px solid var(--border);
  font:inherit; font-size:12.5px; color:var(--ink-soft);
  cursor:pointer; position:relative; text-align:left;
  transition:background .15s, border-color .15s, color .15s;
}
/* El signo es el unico indicio de que la pildora se puede abrir, asi
   que va siempre visible y no solo al pasar el cursor. */
.mrc-x button::before{
  content:"+";
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  font-size:13px; line-height:1; color:var(--ink-faint);
}
.mrc-x button:hover{border-color:var(--accent); color:var(--ink);}
.mrc-x button[aria-expanded="true"]{
  background:var(--accent); border-color:var(--accent); color:#fff;
}
.mrc-x button[aria-expanded="true"]::before{content:"\2212"; color:#fff;}
.mrc-grupo.como .mrc-x button:hover{border-color:var(--ink-soft);}
.mrc-grupo.como .mrc-x button[aria-expanded="true"]{
  background:var(--ink-soft); border-color:var(--ink-soft);
}
/* La definicion se abre debajo de toda la fila y no junto a su pildora:
   asi el ancho no depende de donde quedo la pildora al ajustarse. */
.mrc-d{
  margin-top:9px; padding:10px 13px; border-radius:9px;
  background:var(--accent-soft);
  font-size:13.5px; line-height:1.55; color:var(--ink);
}
.mrc-d[hidden]{display:none;}
.mrc-d b{font-weight:600;}
.mrc-grupo.como .mrc-d{background:var(--surface); border:1px solid var(--border);}
/* El fundamento teorico: de donde sale la categoria. Va en cuerpo
   pequeno y con rotulo propio porque es respaldo para la sustentacion,
   no una opcion que haya que decidir. */
.mrc-b{
  margin-top:10px; padding-left:11px;
  border-left:2px solid var(--border);
  font-size:12.5px; line-height:1.5; color:var(--ink-faint);
}
.mrc-b b{
  display:block; margin-bottom:2px;
  font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-soft);
}

.mrc-q{
  margin-top:11px; padding:11px 14px; border-radius:9px;
  background:var(--accent-soft);
  font-family:var(--font-display); font-size:15.5px; line-height:1.35;
  color:var(--accent-dark);
}

/* --- Ligadura por color ------------------------------------------ */
/* El ejemplo de la entrada y las tarjetas comparten color: es lo que
   evita tener que rehacer de memoria cuál era cuál. La etiqueta con el
   nombre va siempre, porque el color solo no basta cuando se imprime en
   gris o quien lee no lo distingue. */
.lig{font-weight:600;}
.lig-1{color:var(--cat1);}
.lig-2{color:var(--cat2);}
.lig-3{color:var(--cat3);}
.lig b{
  display:inline-block; margin-left:6px; vertical-align:2px;
  padding:1px 7px; border-radius:999px;
  font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
}
.lig-1 b{background:var(--cat1-soft);}
.lig-2 b{background:var(--cat2-soft);}
.lig-3 b{background:var(--cat3-soft);}

/* La tarjeta devuelve el color del tramo que le corresponde. */
.mrc-grupo .mrc-c.c1{border-top-color:var(--cat1);}
.mrc-grupo .mrc-c.c2{border-top-color:var(--cat2);}
.mrc-grupo .mrc-c.c3{border-top-color:var(--cat3);}
.mrc-c.c1 .mrc-t{color:var(--cat1);}
.mrc-c.c2 .mrc-t{color:var(--cat2);}
.mrc-c.c3 .mrc-t{color:var(--cat3);}
.mrc-grupo .mrc-c.c1 .mrc-x button:hover{border-color:var(--cat1);}
.mrc-grupo .mrc-c.c2 .mrc-x button:hover{border-color:var(--cat2);}
.mrc-grupo .mrc-c.c3 .mrc-x button:hover{border-color:var(--cat3);}
.mrc-grupo .mrc-c.c1 .mrc-x button[aria-expanded="true"]{background:var(--cat1); border-color:var(--cat1);}
.mrc-grupo .mrc-c.c2 .mrc-x button[aria-expanded="true"]{background:var(--cat2); border-color:var(--cat2);}
.mrc-grupo .mrc-c.c3 .mrc-x button[aria-expanded="true"]{background:var(--cat3); border-color:var(--cat3);}
.mrc-grupo .mrc-c.c1 .mrc-d{background:var(--cat1-soft);}
.mrc-grupo .mrc-c.c2 .mrc-d{background:var(--cat2-soft);}
.mrc-grupo .mrc-c.c3 .mrc-d{background:var(--cat3-soft);}

/* --- Marco a la vista (sin desplegables) ---------------------------- */
.mrc-grupo.fijo{margin-top:24px;}
.mrc-grupo.fijo .mrc-head{
  border:1px solid var(--accent-soft); border-bottom:none;
  border-radius:var(--radius) var(--radius) 0 0;
  background:var(--accent-soft); padding:16px 20px 17px;
}
.mrc-grupo.fijo .mrc-head h3{
  margin-top:9px;
  font-family:var(--font-display); font-size:clamp(19px,2.1vw,25px);
  line-height:1.2; color:var(--ink);
}
.mrc-grupo.fijo .mrc-sub{margin-top:6px;}
.mrc-grupo.fijo .mrc-cuerpo{padding:4px 20px 22px; background:var(--bg);}
.mrc-grupo.fijo.como .mrc-head{background:var(--surface-alt); border-color:var(--border);}
.mrc-grupo.fijo.como .mrc-cuerpo{border-color:var(--border);}
.mrc-grupo.fijo .mrc{gap:14px;}
.mrc-grupo.fijo .mrc-c{
  background:var(--surface); border-radius:0 0 10px 10px;
  padding:13px 15px 15px; display:flex; flex-direction:column;
}
.mrc-grupo.fijo .mrc-t{font-size:clamp(16.5px,1.7vw,19px);}
.mrc-grupo.fijo .mrc-e{margin-top:6px; font-size:13.5px; line-height:1.5;}
/* Ejemplos: término y definición, alineados en una lista breve. */
.mrc-l{list-style:none; margin:11px 0 0; padding:0; display:grid; gap:7px;}
.mrc-l li{
  padding-left:10px; border-left:2px solid var(--border);
  font-size:13px; line-height:1.45; color:var(--ink-soft);
}
.mrc-l li b{display:block; color:var(--ink); font-weight:600; font-size:13.5px;}
.mrc-c.c1 .mrc-l li{border-left-color:var(--cat1-soft);}
.mrc-c.c2 .mrc-l li{border-left-color:var(--cat2-soft);}
.mrc-c.c3 .mrc-l li{border-left-color:var(--cat3-soft);}
/* La cita va al pie de la tarjeta, como respaldo y no como contenido. */
.mrc-grupo.fijo .mrc-b{
  margin-top:auto; padding:10px 0 0; border-left:none;
  font-size:11.5px; font-style:italic; color:var(--ink-faint);
}
.mrc-grupo.fijo .mrc-l + .mrc-b,
.mrc-grupo.fijo .mrc-e + .mrc-b{margin-top:auto;}

/* Matriz de importancia por modificabilidad. */
.mtz{
  margin-top:16px; display:grid; gap:6px;
  grid-template-columns:minmax(78px,.55fr) 1fr 1fr;
}
.mtz-h, .mtz-v{
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); display:flex; align-items:center;
}
.mtz-h{justify-content:center; padding:4px 0; text-align:center;}
.mtz-v{padding-right:6px; line-height:1.3;}
.mtz-c{
  padding:12px 14px; border-radius:10px;
  font-size:13.5px; line-height:1.45; color:var(--ink-soft);
  background:var(--surface); border:1px solid var(--border);
}
.mtz-n{
  display:block; margin-bottom:3px;
  font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-faint);
}
.mtz-c.q1{background:var(--accent); border-color:var(--accent); color:#fff;}
.mtz-c.q1 .mtz-n{color:rgba(255,255,255,.8);}
.mtz-c.q2{background:var(--accent-soft); border-color:var(--accent-soft); color:var(--ink);}
.mtz-c.q4{background:transparent; border-style:dashed; color:var(--ink-faint);}
.mtz-b{margin-top:10px !important;}
@media (max-width:600px){
  .mtz{grid-template-columns:72px 1fr 1fr; gap:5px;}
  .mtz-h, .mtz-v{font-size:9px; letter-spacing:.02em;}
  .mtz-h, .mtz-v{text-transform:none; font-size:11px; letter-spacing:0;}
  .mtz-n{font-size:9.5px; letter-spacing:.04em;}
  .mtz-c{padding:9px 10px; font-size:12.5px;}
  .mrc-grupo.fijo .mrc-cuerpo{padding:4px 14px 18px;}
  .mrc-grupo.fijo .mrc-head{padding:14px 14px 15px;}
}

@media print{
  .escena{display:none !important;}
  .globo{break-inside:avoid; box-shadow:none;}
}
</style>
</head>
<body>

<div class="wrap" id="portada">
  <div class="globos" id="globos"></div>
</div>

<!-- ============================================================
     Material de consulta. Nunca se proyecta: la escena lo tapa.
     ============================================================ -->
<div class="pagina">
  <div class="tira">
    <span class="tira-f" id="tira-f"></span>
    <span class="tira-d" id="tira-d"></span>
    <span class="tira-p" id="tira-p"></span>
  </div>

  <section class="seccion" id="sec-encuadre" hidden>
    <div class="seccion-r">La actividad</div>
    <h2 class="seccion-t" id="enc-t"></h2>
    <div class="seccion-s" id="enc-s"></div>
  </section>

  <section class="seccion">
    <div class="seccion-r">Qué se sustenta</div>
    <h2 class="seccion-t" id="ent-t"></h2>
    <div class="seccion-s" id="ent-s"></div>
    <div class="entregables" id="entregables"></div>
  </section>

  <section class="seccion">
    <div class="seccion-r">El marco</div>
    <h2 class="seccion-t" id="mrc-t"></h2>
    <div class="seccion-s" id="mrc-s"></div>
    <div id="mrc"></div>
  </section>

  <section class="seccion">
    <div class="seccion-r">Cómo se califica</div>
    <h2 class="seccion-t" id="rub-t"></h2>
    <div class="seccion-s" id="rub-s"></div>
    <div class="rub" id="rub"></div>
    <div class="rub-pie">Cada criterio despliega sus descriptores de desempeño en cinco niveles, calificados sobre 5.</div>
  </section>

    <section class="seccion">
      <div class="seccion-r">Referencias</div>
      <div class="refs" id="refs"></div>
    </section>
</div>

<!-- ============================================================
     Vista de proyección
     ============================================================ -->
<div class="escena" id="escena" role="dialog" aria-modal="true" aria-labelledby="q-texto">
  <div class="escena-barra">
    <div class="cuenta" id="cuenta"></div>
    <div class="btns">
      <button class="bt" id="bt-ant" title="Anterior (←)">← Anterior</button>
      <button class="bt" id="bt-sig" title="Siguiente (→)">Siguiente →</button>
      <button class="bt" id="bt-cerrar" title="Volver a la cuadrícula (Esc)">Cerrar</button>
    </div>
  </div>

  <div class="escena-cuerpo" id="escena-cuerpo">
    <div class="escena-inner">
      <div class="q-texto" id="q-texto"></div>

      <div class="revelar-zona" id="revelar-zona">
        <button class="bt primario" id="bt-revelar">Puesta en común</button>
        <div class="nota">Se presiona cuando los grupos ya escribieron su respuesta.</div>
      </div>

      <div class="explica" id="explica" hidden>
        <div class="idea" id="idea"></div>
        <div class="porque"><ul id="porque"></ul></div>
        <div class="punto" id="punto">
          <div class="punto-r" id="punto-r"></div>
          <div class="punto-t" id="punto-t"></div>
          <div class="punto-items" id="punto-items"></div>
        </div>
      </div>

      <!-- Cierre: qué queda armado y qué falta -->
      <div class="panel-cierre" id="panel-cierre" hidden>
        <div class="banda" id="banda"></div>
        <div class="cadena" id="cadena"></div>
        <div class="regla" id="regla"></div>
      </div>
    </div>
  </div>
</div>

          "es": "Condiciones políticas, normativas y organizacionales."
        }
      ],
      "pie": "Green et al. (2022), glosario y capítulo 1."
    },
    "grupos": [
      {
        "eje": "Lo que se mide",
        "titulo": "Niveles de evaluación",
        "sub": "Cada nivel responde una pregunta distinta. En esta actividad se exigen proceso y corto plazo.",
        "lead": "Asistencia y satisfacción muestran participación, no cambio.",
        "modo": "que",
        "componentes": [
          {
            "title": "Proceso",
            "cat": 1,
            "explanation": "¿Se hizo lo planeado? Si no hubo cambio, es lo que permite saber por qué.",
            "base": "Green et al. (2022), cap. 9; Rossi et al. (2004), cap. 2.",
            "examples": [
              { "t": "Cobertura", "d": "Cuántos participaron de los esperados." },
              { "t": "Permanencia", "d": "Cuántos empezaron y cuántos terminaron." },
              { "t": "Fidelidad", "d": "Qué se mantuvo, qué se ajustó y por qué." }
            ]
          },
          {
            "title": "Corto y mediano plazo",
            "cat": 2,
            "explanation": "¿Cambió el determinante (corto) o la conducta (mediano)? Se compara con la medición inicial de la Fase I.",
            "base": "Green et al. (2022), cap. 9.",
            "examples": [
              { "t": "Antes y después", "d": "Describe un cambio observado, no prueba que el programa lo causó." },
              { "t": "Solo al cierre", "d": "Describe el nivel alcanzado, no cuánto cambió." },
              { "t": "Sin cambio", "d": "También es un hallazgo; se reporta y se explica." }
            ]
          },
          {
            "title": "Largo plazo",
            "cat": 3,
            "explanation": "¿Mejoró la salud o la calidad de vida? Excede el tiempo de la actividad: se nombra como límite del alcance.",
            "base": "Green et al. (2022), cap. 9."
          }
        ],
        "puente": "Lo que se pudo medir depende de lo que el sitio dejó hacer."
      },
      {
        "eje": "Lo que lo condiciona",
        "titulo": "Condiciones del sitio",
        "sub": "Qué de lo previsto en la Fase I se confirmó, qué apareció sin anticiparse y qué puede continuar.",
        "lead": "Retomen las tres verificaciones de la Fase I —quién autoriza, recursos y ruta de remisión— y compárenlas con lo ocurrido.",
        "modo": "como",
        "componentes": [
          {
            "title": "Política",
            "explanation": "Qué prioriza la institución y para quién.",
            "examples": [
              { "t": "Prioridades", "d": "Cuánto espacio tuvo el programa en el sitio." },
              { "t": "Presupuesto", "d": "Qué definió el tamaño real del programa." }
            ]
          },
          {
            "title": "Normativa",
            "explanation": "Reglas que hubo que cumplir para ejecutar.",
            "examples": [
              { "t": "Consentimiento", "d": "Evidencias sin exponer datos identificables." },
              { "t": "Ruta de remisión", "d": "Si se usó y cómo funcionó." }
            ]
          },
          {
            "title": "Organizacional",
            "explanation": "Horarios, espacios, personal y quién decide.",
            "examples": [
              { "t": "Horarios y espacios", "d": "Qué recortó lo planeado." },
              { "t": "Continuidad", "d": "Quién del sitio podría sostener el programa." }
            ]
          }
        ]
      }
    ]
  }
};

/* ============================================================
   LAS TRES PREGUNTAS (versión breve)

   Una pregunta por punto de la fase. Se recorta la extensión, no los
   elementos: se evalúan el proceso y el indicador de la Fase I, que
   es lo que Green et al. (2022, apéndice A) considera exigible a todo
   programa; el largo plazo queda como delimitación del alcance.
   ============================================================ */
const PREGUNTAS = [
  {
    "pregunta": "¿Qué van a hacer exactamente con esa población, y cómo va a quedar registrado?",
    "idea": "Decidan antes de implementar qué evidencia permitirá explicar lo que hicieron y su relación con el determinante.",
    "porque": [
      "Describan <strong>qué se hizo, con quiénes y cómo</strong> se aplicó la orientación elegida, y los <strong>ajustes</strong> frente al diseño con sus razones.",
      "Integren evidencias en el PPTX: materiales, datos agregados o registros de ejecución, sin exponer datos identificables."
    ],
    "punto": {
      "n": "Punto 1 de la Fase II",
      "t": "Implementación",
      "items": [
        "Actividades ejecutadas, participantes y ajustes frente a lo planeado",
        "Evidencias de la ejecución integradas en las diapositivas"
      ]
    }
  },
  {
    "pregunta": "¿Con qué van a comparar lo que pase, para poder decir que algo cambió?",
    "idea": "La referencia es el objetivo y el indicador de la Fase I, con su medición inicial. Junto a él, el proceso dice si el programa se ejecutó como se diseñó.",
    "porque": [
      "Observen el <strong>indicador</strong> de la Fase I de la misma manera al cierre y reporten <strong>dos o tres datos de proceso</strong>: cobertura, permanencia y fidelidad.",
      "Una diferencia antes-después describe un <strong>cambio observado</strong>, no prueba que el programa lo causó; sin medición inicial solo se describe el <strong>nivel al cierre</strong>."
    ],
    "punto": {
      "n": "Punto 2 de la Fase II",
      "t": "Hallazgos",
      "items": [
        "Indicador de la Fase I frente a su medición inicial y datos de proceso<span class=\"et\">proceso</span><span class=\"et\">corto plazo</span><span class=\"et\">mediano plazo</span>",
        "Alcance de las conclusiones y limitaciones"
      ]
    }
  },
  {
    "pregunta": "¿Qué del sitio hizo posible lo que lograron, y qué le queda a la población cuando ustedes se vayan?",
    "idea": "Contrasten las condiciones que anticiparon en la Fase I con las que encontraron, y propongan una continuidad que el sitio pueda sostener.",
    "porque": [
      "Expliquen qué <strong>facilitó o dificultó</strong> la implementación y cuánto de eso estaba previsto.",
      "Señalen <strong>qué podría continuar y quién podría sostenerlo</strong>, distinguiendo los acuerdos confirmados de las propuestas."
    ],
    "punto": {
      "n": "Punto 3 de la Fase II",
      "t": "Reflexión final",
      "items": [
        "Condiciones del sitio frente a lo previsto<span class=\"et\">política</span><span class=\"et\">normativa</span><span class=\"et\">organizacional</span>",
        "Continuidad viable: responsables y límites"
      ]
    }
  }
];

// El deck de la Fase II se proyecta en una franja corta, al terminar las
// sustentaciones: no hay tiempo para la rotación de hojas.
const ROTACION = null;

/* ============================================================
   LA TARJETA DE CIERRE

   No es una pregunta al salón. Va al final porque es lo único que las
   tres preguntas no cubren: que una parte considerable de la nota no
   depende de lo que hicieron en el sitio sino de cómo lo cuenten.
   ============================================================ */
const CIERRE = {
  tipo: "cierre",
  rotulo: "Cierre",
  titulo: "Cómo se sustenta",
  pasos: [
    { t: "Implementan", r: "El programa en el sitio, con la población y la metodología que decidieron en la Fase I." },
    { t: "Registran",   r: "Mientras ocurre, no después. Con alguien del grupo que tenga ese rol asignado." },
    { t: "Analizan",    r: "Los indicadores del determinante y la referencia disponible, distinguiendo cambio observado de nivel al cierre." },
    { t: "Sustentan",   r: "Presentación oral con PPTX; evidencias integradas en las diapositivas, sin documento adicional." }
  ],
  regla: "Casi un tercio de la nota de la Fase II no depende de lo que hicieron, sino de cómo lo cuentan: dominio conceptual y organización de la presentación."
};

// La rotación solo existe donde hay franja de clase para ella; en el otro
// deck ROTACION es null y la tarjeta simplemente no aparece.
const TARJETAS = [
  ...PREGUNTAS.map(p => Object.assign({ tipo: "pregunta" }, p))
  ];

/* ============================================================
   CUADRÍCULA
   ============================================================ */
const $ = id => document.getElementById(id);
const contGlobos = $("globos");
let actual = 0;

// La numeración corre solo sobre las preguntas: el cierre lleva rótulo.
let nPregunta = 0;
TARJETAS.forEach((t, i) => {
  if (t.tipo === "pregunta") nPregunta++;
  t.rotulo = t.rotulo || ("Pregunta " + nPregunta);

  const b = document.createElement("button");
  b.className = "globo" + (t.tipo === "pregunta" ? "" : " utilitaria");
  b.type = "button";
  b.dataset.i = i;
  b.innerHTML =
    '<span class="num">' + escapar(t.rotulo) + '</span>' +
    escapar(t.tipo === "pregunta" ? t.pregunta : t.titulo) +
    (t.tipo === "pregunta"
      ? '<span class="pie">' + escapar(t.punto.n) + ' · ' + escapar(t.punto.t) + '</span>'
      : "");
  b.addEventListener("click", () => abrir(i));
  contGlobos.appendChild(b);
});
const TOTAL_PREGUNTAS = nPregunta;

function escapar(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ============================================================
   VISTA DE PROYECCIÓN
   ============================================================ */
const escena = $("escena");

function abrir(i){
  actual = i;
  pintar();
  escena.classList.add("abierta");
  document.body.style.overflow = "hidden";
  (!$("revelar-zona").hidden ? $("bt-revelar") : $("bt-sig")).focus();
}

function cerrar(){
  escena.classList.remove("abierta");
  document.body.style.overflow = "";
  const b = contGlobos.querySelector('[data-i="' + actual + '"]');
  if (b) b.focus();
}

function mover(paso){
  actual = (actual + paso + TARJETAS.length) % TARJETAS.length;
  pintar();
  $("escena-cuerpo").scrollTop = 0;
}

function pintar(){
  const t = TARJETAS[actual];
  const esPregunta = t.tipo === "pregunta";

  $("cuenta").textContent = esPregunta
    ? t.rotulo + " de " + TOTAL_PREGUNTAS
    : t.rotulo;

  const enunciado = esPregunta ? t.pregunta : t.titulo;
  $("q-texto").textContent = enunciado;
  // Las preguntas largas necesitan más caracteres por línea o quedan en columna.
  $("q-texto").classList.toggle("ancha", enunciado.length > 110);

  // Solo las preguntas se tapan: el cierre se muestra entero, porque no hay
  // nada que discutir antes de verlo.
  $("revelar-zona").hidden = !esPregunta;
  $("explica").hidden = true;
  $("panel-cierre").hidden = esPregunta;
  escena.classList.toggle("revelado", !esPregunta);
  escena.classList.toggle("cierre", !esPregunta);
  escena.classList.toggle("rotacion", t.tipo === "rotacion");

  if (esPregunta){
    $("idea").textContent = t.idea;
    $("porque").innerHTML = t.porque.map(x => "<li>" + x + "</li>").join("");
    $("punto-r").textContent = t.punto.n;
    $("punto-t").textContent = t.punto.t;
    $("punto-items").innerHTML = t.punto.items.map(x => "<span>" + x + "</span>").join("");
  } else {
    // La banda es opcional: el cierre de la Fase II va sin ella.
    $("banda").hidden = !t.banda;
    $("banda").innerHTML = t.banda || "";
    $("cadena").innerHTML = t.pasos.map((p, i) =>
      '<div class="paso">' +
        '<div class="paso-n">' + (i + 1) + '</div>' +
        '<div class="paso-t">' + escapar(p.t) + '</div>' +
        '<div class="paso-r">' + escapar(p.r) + '</div>' +
      '</div>').join("");
    // La regla es opcional, como la banda: la rotación va sin ninguna de las dos.
    $("regla").hidden = !t.regla;
    $("regla").textContent = t.regla ? "«" + t.regla + "»" : "";
  }
}

function revelar(){
  if (TARJETAS[actual].tipo !== "pregunta") return;
  if (!$("explica").hidden) return;
  $("explica").hidden = false;
  $("revelar-zona").hidden = true;
  escena.classList.add("revelado");
  $("escena-cuerpo").scrollTop = 0;
}

$("bt-revelar").addEventListener("click", revelar);
$("bt-cerrar").addEventListener("click", cerrar);
$("bt-ant").addEventListener("click", () => mover(-1));
$("bt-sig").addEventListener("click", () => mover(1));

document.addEventListener("keydown", e => {
  if (!escena.classList.contains("abierta")) return;

  if (e.key === "Escape"){ cerrar(); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); mover(1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); mover(-1); }
  else if (e.key === " " || e.key === "Enter"){
    // Enter sobre un botón ya hace lo suyo; no lo duplicamos.
    if (e.key === "Enter" && e.target && e.target.tagName === "BUTTON") return;
    e.preventDefault();
    revelar();
  }
});
/* ============================================================
   MATERIAL DE CONSULTA

   Los entregables no se declaran aparte: son los puntos de las
   preguntas. Declararlos dos veces era justamente lo que hacía que el
   documento general y los decks se contradijeran.
   ============================================================ */
$("tira-f").textContent = FASE.titulo;
$("tira-d").textContent = FASE.fecha;
$("tira-p").textContent = FASE.peso;

if (FASE.encuadre){
  $("sec-encuadre").hidden = false;
  $("enc-t").textContent = FASE.encuadre.t;
  $("enc-s").innerHTML = FASE.encuadre.s;
}

$("ent-t").textContent = FASE.entregables.t;
$("ent-s").innerHTML = FASE.entregables.s;
// La numeración corre a lo largo de toda la fase y no dentro de cada
// punto: así la lista se lee como el guión de la sustentación, en el
// orden en que hay que organizarla.
let nEnt = 0;
$("entregables").innerHTML = PREGUNTAS.map(p =>
  '<div class="ent">' +
    '<div class="ent-n">' + escapar(p.punto.n) + '</div>' +
    '<div class="ent-t">' + escapar(p.punto.t) + '</div>' +
    '<div class="ent-i">' + p.punto.items.map(x =>
      '<span><i>' + (++nEnt) + '</i>' + x + '</span>').join("") + '</div>' +
  '</div>').join("");

$("rub-t").textContent = FASE.rubrica.t;
$("rub-s").innerHTML = FASE.rubrica.s;
// Los descriptores vienen de mejor a peor; el nivel es 5 menos el índice.
$("rub").innerHTML = FASE.rubrica.criterios.map(c =>
  '<details>' +
    '<summary>' + escapar(c.criterio) +
      '<span class="peso">' + c.peso + '%</span>' +
    '</summary>' +
    '<div class="niveles">' + c.niveles.map((n, i) =>
      '<div class="nivel"><b>' + (5 - i) + '</b><span>' + escapar(n) + '</span></div>'
    ).join("") + '</div>' +
  '</details>').join("");

$("refs").innerHTML = FASE.referencias.map(x => '<div>' + x + '</div>').join("");

$("mrc-t").textContent = FASE.marco.t;
$("mrc-s").innerHTML = FASE.marco.s;
/* Marco a la vista: sin desplegables ni pildoras. Cada bloque muestra su
   encabezado, la guia y las tarjetas con sus ejemplos como lista de
   termino y definicion. Un bloque con "matriz" se dibuja como la tabla
   de 2x2 de Green et al. (2022, fig. 5.4); sus componentes van en el
   orden de los cuadrantes 1, 2, 3 y 4. */
$("mrc").innerHTML =
  (FASE.marco.acronimo ? pintarAcronimo(FASE.marco.acronimo) : "") +
  FASE.marco.grupos.map((g, i, a) =>
  (i ? '<div class="mrc-puente">' + escapar(a[i - 1].puente) + '</div>' : "") +
  '<section class="mrc-grupo fijo' + (g.modo === "como" ? " como" : "") + '">' +
    '<div class="mrc-head">' +
      '<span class="mrc-eje">' + escapar(g.eje) + '</span>' +
      '<h3>' + escapar(g.titulo) + '</h3>' +
      '<p class="mrc-sub">' + escapar(g.sub) + '</p>' +
    '</div>' +
    '<div class="mrc-cuerpo">' +
      (g.lead ? '<p class="mrc-lead">' + g.lead + '</p>' : "") +
      (g.matriz ? pintarMatriz(g.componentes) :
      '<div class="mrc">' + g.componentes.map(c =>
        '<div class="mrc-c' + (c.cat ? " c" + c.cat : "") + '">' +
          '<div class="mrc-t">' + escapar(c.title) + '</div>' +
          (c.explanation ? '<div class="mrc-e">' + escapar(c.explanation) + '</div>' : "") +
          (c.examples ? '<ul class="mrc-l">' + c.examples.map(x =>
            '<li><b>' + escapar(x.t) + '</b><span>' + escapar(x.d || "") + '</span></li>').join("") +
          '</ul>' : "") +
          (c.question ? '<div class="mrc-q">' + escapar(c.question) + '</div>' : "") +
          (c.base ? '<div class="mrc-b">' + escapar(c.base) + '</div>' : "") +
        '</div>').join("") +
      '</div>') +
    '</div>' +
  '</section>').join("");

function pintarMatriz(q){
  const celda = (c, n) =>
    '<div class="mtz-c q' + n + '"><span class="mtz-n">Cuadrante ' + n + '</span>' +
    escapar(c.explanation) + '</div>';
  return '<div class="mtz">' +
    '<div class="mtz-0"></div>' +
    '<div class="mtz-h">Más importante</div><div class="mtz-h">Menos importante</div>' +
    '<div class="mtz-v">Más modificable</div>' + celda(q[0], 1) + celda(q[2], 3) +
    '<div class="mtz-v">Menos modificable</div>' + celda(q[1], 2) + celda(q[3], 4) +
  '</div>' +
  (q[0].base ? '<div class="mrc-b mtz-b">' + escapar(q[0].base) + '</div>' : "");
}

// El nombre del marco: dos columnas de siete letras, con las tres
// primeras encendidas.
function pintarAcronimo(a){
  return '<div class="acr">' +
    '<div class="acr-r">' + escapar(a.r) + '</div>' +
    '<div class="acr-n"><span class="a">' + escapar(a.a) + '</span>' +
      '<span class="g">-</span><span class="b">' + escapar(a.b) + '</span></div>' +
    (a.aut ? '<div class="acr-aut">' + escapar(a.aut) + '</div>' : "") +
    '<p class="acr-s">' + a.s + '</p>' +
    '<div class="acr-g">' + a.cols.map(c =>
      '<div>' +
        '<div class="acr-h">' + escapar(c.h) + '<span>' + escapar(c.sub) + '</span></div>' +
        '<div class="acr-f">' + c.frase.map(x =>
          '<span' + (x.on ? ' class="on"' : '') + '>' +
            '<b>' + escapar(x.i) + '</b>' + escapar(x.r) +
          '</span>').join(" ") +
        '</div>' +
        '<div class="acr-es">' + escapar(c.es) + '</div>' +
      '</div>').join("") +
    '</div>' +
    '<div class="acr-pie">' + escapar(a.pie) + '</div>' +
  '</div>';
}

/* Una sola definicion abierta por tarjeta: abrir otra reemplaza a la
   anterior en lugar de acumular paneles. Volver a presionar la misma
   pildora la cierra. */
$("mrc").addEventListener("click", e => {
  const b = e.target.closest(".mrc-x button");
  if (!b) return;
  const fila = b.parentNode;
  const panel = fila.nextElementSibling;
  const abierta = b.getAttribute("aria-expanded") === "true";
  fila.querySelectorAll("button").forEach(o => o.setAttribute("aria-expanded", "false"));
  if (abierta) {
    panel.hidden = true;
    return;
  }
  b.setAttribute("aria-expanded", "true");
  panel.innerHTML = "<b>" + escapar(b.dataset.t) + ".</b> " + escapar(b.dataset.def);
  panel.hidden = false;
});

</script>
