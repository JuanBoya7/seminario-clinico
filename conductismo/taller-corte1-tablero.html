<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un aporte, tres preguntas — Tablero</title><style>
/* ============================================================
   TOKENS — los mismos de la actividad y del tablero del simulacro
   ============================================================ */
:root{
  --bg:#ffffff;
  --surface:#f6f8f8;
  --surface-alt:#eef2f2;
  --border:#dde5e5;
  --ink:#16232b;
  --ink-soft:#4b5c63;
  --ink-faint:#7d8c91;
  --accent:#1f6f78;
  --accent-dark:#134349;
  --accent-soft:#e2eff0;
  --moderate:#b8722a;
  --moderate-soft:#faf1e4;
  --severe:#a83f2b;
  --severe-soft:#fbeae6;
  /* Un color por explicación, agrupados en dos familias con los colores del
     deck de consumo e impulsos: turquesa, lo que hace la sustancia; coral, lo
     que hace la persona. Ninguno sugiere "correcto": la rúbrica no califica
     acertar, y el tablero tampoco debe insinuarlo. */
  --c-intox:#0F4F49;
  --c-bajon:#1C7A70;
  --c-motivo:#3A9E92;
  --c-reaccion:#9A3A24;
  --c-relacion:#C8583A;
  --c-nodecide:#8a97a0;
  --fam-sustancia:#1C7A70;
  --fam-persona:#C8583A;
  --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5;
     -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0;}
button{font-family:var(--font-body);}

.wrap{max-width:1180px; margin:0 auto; padding:22px 24px 40px;}

.js-warning{background:var(--severe-soft); border:1px solid var(--severe); color:var(--severe);
  padding:14px 16px; border-radius:10px; font-size:14px; margin-bottom:20px;}
.aviso-demo{background:var(--moderate-soft); border:1px solid var(--moderate); color:var(--moderate);
  border-radius:10px; padding:9px 14px; font-size:13.5px; margin-bottom:16px;}
.aviso-demo[hidden]{display:none;}

/* ---- Cabecera ---- */
.cabecera{display:flex; align-items:flex-end; justify-content:space-between;
  gap:16px; flex-wrap:wrap; margin-bottom:16px;}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--accent-dark); margin-bottom:6px;}
.cabecera h1{font-size:26px;}
.controles{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
select{font-family:var(--font-body); font-size:14.5px; font-weight:600; color:var(--ink);
  background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px;}
.bt{font-size:13.5px; font-weight:600; color:var(--ink-soft); background:var(--bg);
  border:1px solid var(--border); border-radius:8px; padding:8px 14px; cursor:pointer;}
.bt:hover{background:var(--surface-alt); color:var(--ink);}
.bt[hidden]{display:none;}
.estado{font-size:12.5px; color:var(--ink-faint); font-family:var(--font-mono);}
.estado.error{color:var(--severe);}

/* ---- Navegación entre las dos pantallas ---- */
.nav-pantallas{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px;}
.nav-pantallas[hidden]{display:none;}
.pill{font-size:14px; font-weight:600; cursor:pointer; padding:8px 16px; border-radius:99px;
  border:1px solid var(--border); background:var(--bg); color:var(--ink-soft);}
.pill.is-on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark);}

/* ---- Panel: una pantalla a la vez, pensada para proyectar ---- */
.panel{border:1px solid var(--border); border-radius:16px; padding:26px 30px 30px;}
.panel h2{font-size:clamp(22px,2.4vw,30px);}
.panel .sub{font-size:14.5px; color:var(--ink-faint); margin:6px 0 22px; max-width:70ch;}
.vacio-msg{color:var(--ink-faint); font-size:16px; font-style:italic;}

/* La frase se redacta con los datos, no está escrita de antemano. */
.frase{font-family:var(--font-display); font-size:clamp(20px,2.3vw,28px); line-height:1.35;
  color:var(--ink); border-left:5px solid var(--accent); padding:4px 0 4px 18px; margin-top:24px;}
.frase em{font-style:normal; color:var(--accent-dark);}

/* ---- Filas con barra ---- */
.fila{display:grid; grid-template-columns:minmax(180px,32%) minmax(0,1fr) 90px; gap:14px;
  align-items:center; margin-bottom:12px;}
.fila .nom{font-size:16.5px; line-height:1.3;}
.lectura{font-weight:700; font-size:15px;}
.pista{display:block; font-size:14px; font-style:italic; color:var(--ink-soft);}
.bar{display:flex; height:28px; background:var(--surface-alt); border-radius:6px; overflow:hidden;}
.bar span{display:flex; align-items:center; justify-content:center; height:100%;
  color:#fff; font-family:var(--font-mono); font-size:14px; font-weight:700; overflow:hidden;}
.fila .val{font-family:var(--font-mono); font-size:14px; color:var(--ink-soft); text-align:right;
  white-space:nowrap;}

/* ---- Antes de destapar: cuántos enviaron ---- */
.contador{font-family:var(--font-display); font-size:clamp(72px,11vw,128px); line-height:1;
  color:var(--accent-dark);}
.contador-t{font-size:18px; color:var(--ink-soft); margin-top:6px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 26px;}
.chip{font-size:14.5px; padding:7px 13px; border-radius:99px; background:var(--accent-soft);
  color:var(--accent-dark);}
.chip small{font-family:var(--font-mono); font-size:11.5px; margin-left:6px; color:var(--accent);}
.btn-principal{font-size:17px; font-weight:600; color:#fff; background:var(--accent);
  border:1px solid var(--accent); border-radius:10px; padding:14px 26px; cursor:pointer;}
.btn-principal:hover{background:var(--accent-dark);}
.btn-principal[hidden]{display:none;}

/* ---- Las situaciones: una barra por situación, repartida por explicación ---- */
.leyenda{display:flex; gap:8px 18px; flex-wrap:wrap; margin:0 0 16px; font-size:14px; color:var(--ink-soft);}
.leyenda i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px;}
.leyenda .fam{font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; margin-right:2px;}
.leyenda .sep{width:1px; align-self:stretch; background:var(--border);}
.barras{display:flex; flex-direction:column; gap:4px;}
.bar-fam{display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--surface-alt);}

/* ---- Situaciones: una fila por día, pensada para leer de lejos ----
   La barra reparte a los grupos en tres bloques (sustancia, persona, sin
   decidir), cada uno con su nombre y su número; debajo, en palabras, qué
   explicación eligieron dentro de cada familia. */
.dias{display:flex; flex-direction:column; gap:14px; margin-top:6px;}
.dia{display:grid; grid-template-columns:minmax(170px,26%) minmax(0,1fr) 84px; gap:16px;
  align-items:start; padding:12px 0 14px; border-top:1px solid var(--border);}
.dia-nom > b{display:block; font-size:19px; font-weight:600; line-height:1.2;}
.dia-nom > small{display:block; font-size:13.5px; color:var(--ink-faint); margin-top:2px;}
.lect{margin-top:8px; font-size:13.5px; line-height:1.35; padding-left:9px; border-left:3px solid;}
.lect .r{display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-faint);}
.lect b{font-weight:700; font-size:14.5px;}
.lect i{color:var(--ink-soft);}
.fambar{display:flex; height:38px; border-radius:8px; overflow:hidden; background:var(--surface-alt);}
.fambar span{display:flex; align-items:center; justify-content:center; height:100%; color:#fff;
  font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; padding:0 6px;}
.desglose{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:7px; font-size:14.5px;}
.desglose span b{font-family:var(--font-mono); margin-left:4px;}
.dia .val{font-family:var(--font-mono); font-size:14px; color:var(--ink-soft); text-align:right;
  padding-top:10px; white-space:nowrap;}
.leyenda3{display:flex; gap:10px 22px; flex-wrap:wrap; margin:0 0 4px; font-size:15px; color:var(--ink-soft);}
.leyenda3 i{display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:7px; vertical-align:-2px;}
@media (max-width:760px){
  .dia{grid-template-columns:minmax(0,1fr); gap:8px;}
  .dia .val{text-align:left; padding-top:0;}
}
.sit{border-top:1px solid var(--border); padding:12px 0 10px;}
.sit summary{list-style:none; cursor:pointer;}
.sit summary::-webkit-details-marker{display:none;}
.sit .fila{margin-bottom:0;}
.sit .nom small, .sit-plana .nom small{display:block; font-size:12px; color:var(--ink-faint);}
.sit-voces{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; margin-top:12px;}
.sit-voz{border-left:4px solid var(--border); border-radius:0 8px 8px 0; padding:9px 12px;
  font-size:15px; line-height:1.4; background:var(--surface);}
.sit-voz .de{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px;}

/* ---- Voces ---- */
/* 200px: con los cinco veredictos presentes, entran las cinco columnas en una
   pantalla de proyector en vez de mandar la última a una segunda fila. */
.voces{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px;}
.col-voz h3{font-size:17px; margin-bottom:10px; padding-bottom:6px; border-bottom:3px solid var(--border);}
.voz{background:var(--surface); padding:12px 14px; border-radius:8px; margin-bottom:10px;
  font-size:16px; line-height:1.45;}
.voz .de{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px;}

/* ---- Lo que exige cada veredicto: siempre a la vista, bajo su columna ---- */
/* El fondo es el color de su veredicto aclarado: la tira lateral y el fondo
   dicen lo mismo, uno fuerte y otro suave. */
.col-afirm{border-left:4px solid var(--border); background:var(--surface); border-radius:0 8px 8px 0;
  padding:10px 12px 10px 14px; margin-top:6px; font-size:15px; line-height:1.45; color:var(--ink);}
.col-afirm .rot-col{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px;}
.col-afirm .fuente-col{font-size:12px; color:var(--ink-faint); margin-top:6px;}
.col-afirm .fuente-col strong{color:var(--ink-soft); font-weight:600;}

/* ---- Cierre: una sola afirmación, con el video completo ----
   Aparece recién cuando el docente la pide: primero se discuten las voces y
   las cuatro afirmaciones, y el cierre llega para integrar, no para adelantar. */
.cierre{margin-top:30px; border-top:1px solid var(--border); padding-top:24px;}
.cierre .rot{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--accent-dark); margin-bottom:12px;}
.afirmacion{font-family:var(--font-display); font-size:clamp(20px,2.3vw,28px); line-height:1.4;
  color:var(--accent-dark); background:var(--accent-soft); border-radius:12px; padding:20px 24px;
  max-width:70ch;}
.afirmacion-fuente{font-size:12.5px; color:var(--ink-faint); margin-top:10px;}
.afirmacion-fuente strong{color:var(--ink-soft); font-weight:600;}

.pie{display:flex; justify-content:space-between; align-items:center; margin-top:16px;}
.pie[hidden]{display:none;}
.pie .cuenta{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint);}

@media (max-width:760px){
  .wrap{padding:16px 14px 30px;}
  .panel{padding:20px 18px 22px;}
  .fila{grid-template-columns:minmax(0,1fr); gap:6px;}
  .fila .val{text-align:left;}
}

.grupos{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; margin-top:6px;}
.grupo{border:1px solid var(--border); border-radius:12px; padding:18px 20px;}
.grupo h3{font-size:20px; margin:2px 0 10px;}
.grupo ol{margin:0; padding-left:20px; font-size:15px; line-height:1.4;}
.grupo li{margin:0 0 6px;}
.grupo li b{color:var(--accent-dark);}
.grupo .sol{background:var(--accent-soft); border-radius:8px; padding:10px 12px; margin-top:10px; font-size:15px;}
.grupo .ref{border-left:4px solid var(--moderate); background:var(--moderate-soft); border-radius:0 8px 8px 0; padding:10px 12px; margin-top:10px; font-size:14.5px;}
.grupo .ref .r{display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--moderate); margin-bottom:4px;}
.grupo .meta{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); margin-top:8px;}

.aviso-demo[hidden]{display:none;}
.estado.error{color:var(--severe);}
.bt[hidden]{display:none;}
.panel h2{margin-bottom:0;}
.campo{margin:8px 0 0; font-size:14.5px; line-height:1.45;}
.campo .r{display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:2px;}
.postura{margin:0 0 22px;}
.postura h3{font-size:19px; margin-bottom:8px;}
.barra{display:flex; height:40px; border-radius:8px; overflow:hidden; background:var(--surface-alt);}
.barra span{display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; padding:0 8px;}
.etq{display:inline-block; font-family:var(--font-mono); font-size:11px; font-weight:700; color:#fff; background:var(--accent); border-radius:4px; padding:1px 7px; margin-right:6px;}
.grupos{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));}
</style>
</head>
<body>
<div class="wrap">

  <div class="js-warning" id="js-warning-fallback">
    Si ven este mensaje, el tablero no se está ejecutando. Ábranlo en un navegador de escritorio.
  </div>
  <div class="aviso-demo" id="aviso-demo" hidden></div>

  <div class="cabecera">
    <div>
      <div class="eyebrow">Espacio de discusión · Corte 1 · Tablero docente</div>
      <h1>Un aporte, tres preguntas</h1>
    </div>
    <div class="controles">
      <select id="f-grupo" aria-label="Grupo del curso"></select>
      <button class="bt" id="bt-tapar" hidden>Volver a tapar</button>
      <span class="estado" id="estado">—</span>
    </div>
  </div>

  <main id="pantalla"></main>

</div>

<script>
/* ============================================================
   1. CONFIGURACIÓN
   ============================================================ */
const FUENTE = {
  // La misma dirección que ENVIO.url en taller-corte1.html: el receptor de los casos,
  // que también atiende el modo de lectura (?tablero=Taller C1).
  // Con "PENDIENTE" el tablero muestra datos de ejemplo.
  url: "https://script.google.com/a/macros/areandina.edu.co/s/AKfycbxmCer6MqE9JD9MEAhyQnbvDZ8nWfTk1vIkaGZn7we2BAGtb6aDJoNCF6fdYXbIvBrY/exec",
  // Reintenta con la otra forma de la misma dirección (de dominio / corta).
  alterna: true,
  curso: "TMC-2026-2",
  caso: "Taller C1",     // la pestaña de la hoja es "402 Taller C1"
  refrescoMs: 20000
};

// Opciones del selector. Deben coincidir con el desplegable de la actividad y con
// CURSOS en el receptor.
const GRUPOS_CURSO = ["402"];

/* ============================================================
   2. QUÉ SE MUESTRA DE CADA ENTREGA
   ============================================================
   CAMPOS: [id del campo en la actividad, rótulo]. POSTURAS: [grupo de opción
   única, pregunta, {valor: rótulo}]; cada una se resume en una barra.
   ============================================================ */
const CAMPOS = [["ct-autor", "Autor"], ["f-aporte", "Aporte"], ["f-limites", "Límites o críticas"], ["f-relevancia", "Relevancia hoy"], ["f-implicaciones", "Implicaciones"]];
const POSTURAS = [];
const CAMPO_TITULO = "ct-autor";
const COLORES = ["var(--accent)", "var(--moderate)"];

/* ============================================================
   3. DATOS DE EJEMPLO
   ============================================================
   Se usan mientras FUENTE.url diga "PENDIENTE", o con ?demo=1 en la
   dirección, para ensayar antes de la clase.
   ============================================================ */
function entregasDemo(){
  return [1, 2, 3].map(g => {
    const textos = {}, opciones = {};
    CAMPOS.forEach(([id, r]) => { textos[id] = "(ejemplo) " + r; });
    POSTURAS.forEach(([id, , ops]) => { const v = Object.keys(ops); opciones[id] = v[g % v.length]; });
    return { cursoGrupo: "402", grupo: "Grupo " + g, enviado: new Date().toISOString(), textos, opciones };
  });
}

/* ============================================================
   4. CARGA (fetch, con JSONP de respaldo)
   ============================================================
   Igual que el tablero de Sergio: fetch primero —Apps Script responde con
   Access-Control-Allow-Origin: *— y el <script> con callback como respaldo si
   fetch falla. Se prueban las dos formas de la dirección.
   ============================================================ */
const MODO_DEMO = FUENTE.url === "PENDIENTE" || /[?&]demo=1\b/.test(location.search);

function direcciones(){
  const lista = [FUENTE.url];
  if (!FUENTE.alterna) return lista;
  const otra = FUENTE.url.indexOf("/a/macros/") !== -1
    ? FUENTE.url.replace(/\/a\/macros\/[^/]+\/s\//, "/macros/s/")
    : FUENTE.url.replace("/macros/s/", "/a/macros/areandina.edu.co/s/");
  if (otra !== FUENTE.url) lista.push(otra);
  return lista;
}

function urlResumen(base, grupo){
  return base + "?tablero=" + encodeURIComponent(FUENTE.caso) +
    "&curso=" + encodeURIComponent(FUENTE.curso) +
    (grupo ? "&grupo=" + encodeURIComponent(grupo) : "") +
    "&t=" + Date.now();
}

let contadorCallback = 0;
function pedirJsonp(url){
  return new Promise((resolver, rechazar) => {
    const nombre = "__taller_cb_" + (++contadorCallback);
    const script = document.createElement("script");
    const limpiar = () => { delete window[nombre]; script.remove(); };
    const reloj = setTimeout(() => { limpiar(); rechazar(new Error("sin respuesta a tiempo")); }, 15000);
    window[nombre] = datos => { clearTimeout(reloj); limpiar(); resolver(datos); };
    script.onerror = () => { clearTimeout(reloj); limpiar(); rechazar(new Error("script bloqueado o sin respuesta")); };
    script.src = url + "&callback=" + nombre;
    document.body.appendChild(script);
  });
}

async function pedirResumen(grupo){
  let ultimoFallo = null;
  for (const base of direcciones()) {
    const url = urlResumen(base, grupo);
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (errFetch) {
      try { return await pedirJsonp(url); }
      catch (errScript) { ultimoFallo = new Error("fetch: " + errFetch.message + " · script: " + errScript.message); }
    }
  }
  throw ultimoFallo || new Error("sin dirección");
}

/* ============================================================
   5. PANTALLAS
   ============================================================ */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const numeroDeGrupo = e => parseInt(String(e.grupo).replace(/\D/g, ""), 10) || 0;
const plural = (n, uno, varios) => n === 1 ? uno : varios;
let entregas = [], destapado = false;

function pantallaEspera(E){
  const orden = E.slice().sort((a, b) => numeroDeGrupo(a) - numeroDeGrupo(b));
  const chips = orden.map(e => `<span class="chip">${esc(e.grupo)}</span>`).join("");
  return `<section class="panel">
    <div class="contador">${E.length}</div>
    <div class="contador-t">${plural(E.length, "grupo envió su taller", "grupos enviaron su taller")}</div>
    <div class="chips">${chips || '<span class="vacio-msg">Esperando la primera entrega…</span>'}</div>
    <p class="sub">Las respuestas están tapadas para que ningún grupo ajuste las suyas a las de los demás. Destápenlas cuando hayan enviado todos.</p>
    <button class="btn-principal" id="bt-destapar">Destapar resultados</button>
  </section>`;
}

// Cómo se repartió el curso en cada pregunta de postura.
function pantallaPosturas(E){
  return POSTURAS.map(([id, pregunta, ops]) => {
    const cuenta = Object.keys(ops).map(v => [v, E.filter(e => (e.opciones || {})[id] === v).length]);
    const total = cuenta.reduce((s, x) => s + x[1], 0) || 1;
    const tramos = cuenta.filter(x => x[1]).map(([v, n], i) =>
      `<span style="width:${n / total * 100}%;background:${COLORES[Object.keys(ops).indexOf(v) % COLORES.length]}">${esc(ops[v])} · ${n}</span>`).join("");
    return `<div class="postura"><h3>${esc(pregunta)}</h3><div class="barra">${tramos}</div></div>`;
  }).join("");
}

function pantallaGrupos(E){
  const orden = E.slice().sort((a, b) => numeroDeGrupo(a) - numeroDeGrupo(b));
  const tarjetas = orden.map(e => {
    const x = e.textos || {}, o = e.opciones || {};
    const etiquetas = POSTURAS.map(([id, , ops]) => o[id] ? `<span class="etq">${esc(ops[o[id]])}</span>` : "").join("");
    const titulo = CAMPO_TITULO ? esc(x[CAMPO_TITULO] || "") : etiquetas;
    const campos = CAMPOS.filter(([id]) => id !== CAMPO_TITULO).map(([id, r]) =>
      `<p class="campo"><span class="r">${esc(r)}</span>${esc(x[id] || "")}</p>`).join("");
    return `<article class="grupo"><div class="eyebrow">${esc(e.grupo)}</div><h3>${titulo}</h3>${campos}</article>`;
  }).join("");
  return `<section class="panel"><h2>Las respuestas del curso</h2>
    <p class="sub">Se muestra el último envío de cada grupo, como punto de partida para la discusión.</p>
    ${pantallaPosturas(E)}
    <div class="grupos">${tarjetas || '<p class="vacio-msg">Todavía no llegó ninguna entrega.</p>'}</div></section>`;
}

function pintar(){
  document.getElementById("pantalla").innerHTML = destapado ? pantallaGrupos(entregas) : pantallaEspera(entregas);
  document.getElementById("bt-tapar").hidden = !destapado;
  const b = document.getElementById("bt-destapar");
  if (b) b.addEventListener("click", () => { destapado = true; pintar(); });
}

/* ============================================================
   6. ACTUALIZACIÓN
   ============================================================ */
async function actualizar(){
  const estado = document.getElementById("estado");
  const grupo = document.getElementById("f-grupo").value;
  if (MODO_DEMO) {
    entregas = entregasDemo();
    estado.textContent = "datos de ejemplo";
    pintar();
    return;
  }
  try {
    const datos = await pedirResumen(grupo);
    if (!datos || datos.ok === false) throw new Error((datos && datos.error) || "respuesta vacía");
    if (document.getElementById("f-grupo").value !== grupo) return;   // cambiaron de grupo mientras tanto
    entregas = datos.entregas || [];
    estado.textContent = "actualizado " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    estado.classList.remove("error");
  } catch (err) {
    estado.textContent = "no fue posible leer la hoja";
    estado.classList.add("error");
  }
  pintar();
}

/* ============================================================
   7. INICIALIZACIÓN
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  const warn = document.getElementById("js-warning-fallback");
  if (warn) warn.style.display = "none";
  try {
    const sel = document.getElementById("f-grupo");
    sel.innerHTML = GRUPOS_CURSO.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("");
    sel.addEventListener("change", () => { entregas = []; destapado = false; pintar(); actualizar(); });
    document.getElementById("bt-tapar").addEventListener("click", () => { destapado = false; pintar(); });
    if (MODO_DEMO) {
      const aviso = document.getElementById("aviso-demo");
      aviso.hidden = false;
      aviso.textContent = "Modo de ensayo: se muestran datos de ejemplo, no las entregas reales.";
    }
    pintar();
    actualizar();
    setInterval(actualizar, FUENTE.refrescoMs);
  } catch (err) {
    if (warn) {
      warn.style.display = "block";
      warn.textContent = "Ocurrió un error al iniciar el tablero: " + (err && err.message ? err.message : err);
    }
  }
});
</script>
