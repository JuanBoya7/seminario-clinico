<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe psicológico — Qué evitar</title>
<style>
/* ============================================================
   TOKENS — los del recurso y de los globos del tamizaje SRQ
   ============================================================ */
:root{
  --bg:#ffffff;
  --surface:#f6f8f8;
  --surface-alt:#eef2f2;
  --border:#dde5e5;
  --ink:#16232b;
  --ink-soft:#4b5c63;
  --ink-faint:#7d8c91;
  --accent:#1f6f78;
  --accent-dark:#134349;
  --accent-soft:#e2eff0;
  --moderate:#b8722a;
  --moderate-soft:#faf1e4;
  --severe:#a83f2b;
  --severe-soft:#fbeae6;
  --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --radius:14px;
  --shadow-card:0 1px 2px rgba(22,35,43,0.04), 0 6px 22px rgba(22,35,43,0.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.55; -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink);}
button,select{font-family:var(--font-body);}

.js-warning{background:var(--severe-soft); border:1px solid var(--severe); color:var(--severe); padding:14px 16px; border-radius:10px; font-size:14px; margin:16px;}

/* ---- Controles del docente: discretos, arriba a la derecha ---- */
.controles{
  position:fixed; top:12px; right:16px; z-index:20;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
}
.controles select{font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:5px 8px;}
.estado{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);}
.estado.error{color:var(--severe);}

/* ============================================================
   LOS GLOBOS
   ============================================================ */
.wrap{
  max-width:1180px; margin:0 auto;
  padding:clamp(48px,8vh,84px) 32px 64px;
  min-height:100vh;
  display:flex; flex-direction:column; justify-content:center;
}
.globos{display:grid; grid-template-columns:repeat(2,minmax(300px,1fr)); gap:34px 30px;}
/* Con siete globos, el último pasa a fila completa y se centra. */
.globos > .globo:last-child:nth-child(odd){grid-column:1 / -1; justify-self:center; width:calc(50% - 15px);}
@media (max-width:820px){
  .wrap{padding:64px 16px 40px;}
  .globos{grid-template-columns:1fr; gap:30px 0;}
  .globos > .globo:last-child:nth-child(odd){grid-column:auto; width:100%;}
}
.globo{
  position:relative; display:block; width:100%; text-align:left;
  font-family:var(--font-display); font-size:clamp(19px,1.85vw,23px);
  line-height:1.34; letter-spacing:-.005em; color:var(--ink);
  background:var(--surface); border:1px solid var(--border); border-radius:22px;
  padding:24px 26px 28px; cursor:pointer; box-shadow:var(--shadow-card);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.globo:hover, .globo:focus-visible{
  transform:translateY(-3px);
  box-shadow:0 2px 4px rgba(22,35,43,.05), 0 14px 30px rgba(22,35,43,.11);
  background:var(--bg); outline:none;
}
.globo:focus-visible{border-color:var(--accent);}
.globo::before, .globo::after{content:""; position:absolute; left:34px; width:0; height:0; border-style:solid;}
.globo::before{bottom:-15px; border-width:15px 15px 0 0; border-color:var(--border) transparent transparent transparent;}
.globo::after{bottom:-13px; border-width:13px 13px 0 0; border-color:var(--surface) transparent transparent transparent; transition:border-top-color .16s ease;}
.globo:hover::after, .globo:focus-visible::after{border-top-color:var(--bg);}
.globo .num{display:block; font-family:var(--font-body); font-size:11.5px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); margin-bottom:12px;}

/* ============================================================
   VISTA DE PROYECCIÓN
   ============================================================ */
.escena{position:fixed; inset:0; z-index:50; background:var(--bg); display:none; flex-direction:column;}
.escena.abierta{display:flex;}
.escena-barra{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 26px; border-bottom:1px solid var(--border); background:var(--surface);
}
.escena-barra .cuenta{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);}
.escena-barra .btns{display:flex; align-items:center; gap:8px;}
.bt{
  font-size:13.5px; font-weight:600; color:var(--ink-soft); background:var(--bg);
  border:1px solid var(--border); border-radius:8px; padding:7px 14px; cursor:pointer;
  transition:background .14s, color .14s, border-color .14s;
}
.bt:hover{background:var(--surface-alt); color:var(--ink);}
.bt.primario{background:var(--accent); border-color:var(--accent); color:#fff;}
.bt.primario:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
.bt[hidden]{display:none;}

.escena-cuerpo{flex:1 1 auto; overflow-y:auto; padding:clamp(24px,4vh,48px) clamp(20px,5vw,64px) 48px;}
.escena-inner{width:100%; max-width:1080px; margin:0 auto;}

.q-texto{
  font-family:var(--font-display); font-size:clamp(28px,3.6vw,46px);
  line-height:1.2; letter-spacing:-.015em; color:var(--ink); max-width:28ch;
  transition:font-size .22s ease;
}
/* Abierto el argumento, el título baja a encabezado y le deja la pantalla al contenido. */
.escena.avanzado .q-texto{font-size:clamp(21px,2.2vw,29px); max-width:none; color:var(--ink-soft);}

/* En el expediente: lo primero que se ve, el dato del caso */
.caso-dato{margin-top:clamp(20px,3vh,32px); background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius); padding:16px 22px;}
.rot{display:block; font-family:var(--font-mono); font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:6px;}
.caso-dato p{margin:0; font-size:clamp(17px,1.7vw,21px); line-height:1.5; color:var(--ink); max-width:80ch;}

/* Perfil del MMPI-2 (solo el globo de validez) */
.perfil{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:16px; margin-top:16px;}
.perfil-col{background:var(--bg); border:1px solid var(--border); border-top:3px solid var(--accent); border-radius:10px; padding:12px 16px;}
.perfil-col.no{border-top-color:var(--moderate);}
.perfil-rot{font-family:var(--font-mono); font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-dark);}
.perfil-col.no .perfil-rot{color:var(--moderate);}
.perfil-sub{font-size:14px; color:var(--ink-soft); margin:2px 0 8px;}
.perfil ul{list-style:none; margin:0; padding:0;}
.perfil li{display:flex; justify-content:space-between; gap:12px; font-size:15.5px; line-height:1.45; padding:2px 0; border-bottom:1px dotted var(--border); color:var(--ink-soft);}
.perfil li:last-child{border-bottom:none;}
.perfil li b{font-family:var(--font-mono); font-weight:400;}
.perfil li.alta{color:var(--ink); font-weight:700;}
.perfil li.alta b{font-weight:700;}
.perfil-bajas{margin:8px 0 0; font-size:13px; line-height:1.45; color:var(--ink-faint);}
.perfil-nota{margin:10px 0 0; font-size:14.5px; line-height:1.5; color:var(--ink-soft); max-width:none;}

.paso-zona{margin-top:clamp(22px,4vh,40px);}

/* Argumento */
.concepto{margin-top:clamp(20px,3vh,30px); background:var(--accent-soft); border-left:4px solid var(--accent); border-radius:0 var(--radius) var(--radius) 0; padding:16px 22px;}
.concepto p{margin:0; font-size:clamp(16.5px,1.55vw,19.5px); line-height:1.55; color:var(--ink); max-width:82ch;}
.concepto .citas{margin-top:10px; font-size:13px; line-height:1.45; color:var(--accent-dark);}
.concepto .citas span{white-space:nowrap;}
.referencias{margin-top:28px; border-top:1px solid var(--border); padding-top:12px;}
.referencias .rot{color:var(--ink-faint); font-weight:600;}
.referencias p{font-size:12.5px; line-height:1.45; color:var(--ink-faint); margin:0 0 4px; padding-left:22px; text-indent:-22px;}

/* Informes: frases reales, sin número de grupo */
.ausencia{margin-top:clamp(20px,3vh,28px); font-size:15.5px; color:var(--ink-soft);}
.voces{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:22px; margin-top:20px;}
.col-voz h3{font-size:18px; margin-bottom:10px; padding-bottom:6px; border-bottom:3px solid var(--border);}
.col-voz.mal h3{border-bottom-color:var(--moderate);}
.col-voz.bien h3{border-bottom-color:var(--accent);}
.voz{padding:12px 14px; border-radius:8px; margin-bottom:10px; font-size:16.5px; line-height:1.45;}
.col-voz.mal .voz{background:var(--moderate-soft);}
.col-voz.bien .voz{background:var(--accent-soft);}
.voz mark{background:transparent; color:inherit; font-weight:700;}
.resp-linea{margin-bottom:9px;}
.resp-linea:last-child{margin-bottom:0;}
.resp-rot{display:block; font-family:var(--font-mono); font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:2px;}
.resp-falta{font-style:italic; color:var(--severe);}
.vacio-msg{color:var(--ink-faint); font-size:15.5px; font-style:italic;}
.siglas-rot{font-size:15px; color:var(--ink-soft); margin-top:clamp(20px,3vh,28px);}
.siglas-chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
.sigla{font-family:var(--font-mono); font-size:19px; font-weight:700; padding:8px 14px; border-radius:8px; background:var(--moderate-soft); color:var(--moderate);}
.sigla small{font-size:12px; font-weight:600; margin-left:6px;}
.siglas-parciales{margin-top:24px;}
.col-voz.parcial h3{border-bottom:3px solid var(--moderate);}
.voz-parcial{background:#f7f5ef; border:1px solid #ded7c6; border-left:4px solid var(--moderate);}
.siglas-etiqueta{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#705522; margin-bottom:10px;}
.voz mark.sigla-explicada{color:#175b58; background:#dcefeb; border-radius:3px; padding:0 2px;}
.voz mark.sigla-pendiente{color:#9c3038; background:#fae7e8; text-decoration:underline; text-decoration-style:dotted; text-decoration-thickness:2px; text-underline-offset:4px; padding:0 2px; border-radius:3px;}
.siglas-claves{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; padding-top:10px; border-top:1px solid #d7d6cd; font-size:14px; font-weight:600;}
.clave-explicada{color:#175b58;}
.clave-pendiente{color:#9c3038;}
.aviso-datos{margin-top:18px; font-size:14px; color:var(--severe); background:var(--severe-soft); border-radius:8px; padding:10px 14px;}

[hidden]{display:none !important;}

@media (max-width:760px){
  .escena-barra{padding:10px 14px;}
  .escena-cuerpo{padding:20px 16px 40px;}
}
</style>
</head>
<body>

<div class="js-warning" id="js-warning-fallback">
  Si ves este mensaje, el tablero no se está ejecutando. Ábrelo en un navegador de escritorio.
</div>

<div class="controles">
  <select id="f-grupo" aria-label="Grupo del curso"></select>
  <span class="estado" id="estado">—</span>
</div>

<div class="wrap">
  <div class="globos" id="globos"></div>
</div>

<!-- ============================================================
     Vista de proyección: título → argumento y expediente → informes
     ============================================================ -->
<div class="escena" id="escena" role="dialog" aria-modal="true" aria-labelledby="q-texto">
  <div class="escena-barra">
    <div class="cuenta" id="cuenta"></div>
    <div class="btns">
      <button class="bt" id="bt-ant" title="Anterior (←)">← Anterior</button>
      <button class="bt" id="bt-sig" title="Siguiente (→)">Siguiente →</button>
      <button class="bt" id="bt-cerrar" title="Volver a los globos (Esc)">Cerrar</button>
    </div>
  </div>
  <div class="escena-cuerpo" id="escena-cuerpo">
    <div class="escena-inner">
      <h1 class="q-texto" id="q-texto"></h1>
      <div class="paso-zona"><button class="bt primario" id="bt-argumento">Argumento</button></div>
      <div id="argumento" hidden>
        <div class="concepto"><p id="concepto"></p><div class="citas" id="citas"></div></div>
        <div class="caso-dato"><span class="rot">En el expediente</span><p id="caso"></p></div>
        <div id="perfil"></div>
        <div class="paso-zona"><button class="bt primario" id="bt-informes">Informes</button></div>
      </div>
      <div id="informes" hidden></div>
      <div class="referencias" id="referencias" hidden></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1. CONFIGURACIÓN
   ============================================================ */
const FUENTE = {
  // La misma dirección que ENVIO.url en 7-Informe-psicologico.html.
  url: "https://script.google.com/a/macros/areandina.edu.co/s/AKfycbxmCer6MqE9JD9MEAhyQnbvDZ8nWfTk1vIkaGZn7we2BAGtb6aDJoNCF6fdYXbIvBrY/exec",
  alterna: true,
  curso: "SPI-2026-2",
  caso: "Informe",          // la pestaña de la hoja es "<grupo del curso> Informe"
  refrescoMs: 20000
};
const GRUPOS_CURSO = ["901", "902", "903"];

/* ============================================================
   2. LOS GLOBOS
   ============================================================
   Uno por trampa del expediente de Jairo, en el orden del deck. Cada globo
   abre, en este orden: el título solo; el argumento con sus fuentes y, justo
   debajo, el dato del expediente; y las frases de los informes. El título dice qué evitar, como el recuadro
   «¿Qué evitar?» de la apertura.
   Las citas remiten a REFERENCIAS por su clave.
   ============================================================ */
const REFERENCIAS = {
  gm2009: "Groth-Marnat, G. (2009). <i>Handbook of psychological assessment</i> (5.ª ed.). John Wiley &amp; Sons.",
  gmd2014: "Groth-Marnat, G. y Davis, A. (2014). <i>Psychological report writing assistant</i>. John Wiley &amp; Sons.",
  sch2018: "Schneider, W. J., Lichtenberger, E. O., Mather, N. y Kaufman, N. L. (2018). <i>Essentials of assessment report writing</i> (2.ª ed.). John Wiley &amp; Sons.",
  aera2014: "American Educational Research Association, American Psychological Association y National Council on Measurement in Education. (2014). <i>Standards for educational and psychological testing</i>. AERA.",
  ley1090: "Congreso de la República de Colombia. (2006). <i>Ley 1090 de 2006, por la cual se reglamenta el ejercicio de la profesión de Psicología, se dicta el Código Deontológico y Bioético y otras disposiciones</i>."
};

const GLOBOS = [
  { id: "pregunta", tema: "Finalidad del informe",
    titulo: "Evitar dejar sin respuesta la pregunta de quien remite",
    caso: "La médica preguntó dos cosas: si hay un componente ansioso o depresivo que explique los síntomas, y si Jairo requiere manejo por psicología o remisión a psiquiatría.",
    concepto: "El informe existe para responder la pregunta de quien remite. Cada parte de esa pregunta recibe una respuesta explícita en la conclusión, en palabras que el destinatario pueda usar para decidir. Una estrategia sencilla es numerar las preguntas en el motivo de consulta y responderlas con los mismos números. Si una parte no puede responderse con los datos disponibles, se dice y se explica por qué.",
    citas: [["gm2009", "Groth-Marnat, 2009, cap. 15"], ["gmd2014", "Groth-Marnat y Davis, 2014, cap. 2"], ["sch2018", "Schneider et al., 2018, cap. 8"]],
    lamina: "Láminas 3 y 12" },
  { id: "siglas", tema: "Redacción clínica",
    titulo: "Evitar siglas sin su forma completa",
    caso: "La remisión de la médica traía cinco siglas: IDx, TAG, TDM, IAM y EKG.",
    concepto: "Un informe lo leen personas que no comparten la jerga del evaluador: el consultante, otros profesionales, a veces un juez. Cada sigla se escribe completa la primera vez, con la sigla entre paréntesis, y solo se conserva si se va a repetir. Los nombres de las pruebas siguen la misma regla. Hasta los términos técnicos que parecen claros son malinterpretados con frecuencia, incluso por profesionales.",
    citas: [["sch2018", "Schneider et al., 2018, cap. 3"], ["gmd2014", "Groth-Marnat y Davis, 2014, cap. 2"]],
    lamina: "Lámina 9" },
  { id: "rumor", tema: "Buenas prácticas",
    titulo: "Evitar presentar como hecho un dato no verificado",
    caso: "Liliana contó que Yolanda le dijo que un compañero le contó que a Jairo lo han visto tomando en la bodega. Nadie lo vio; Jairo reporta cerveza cada quince días y el AUDIT dio 6.",
    concepto: "Un dato de oídas no es un hallazgo. Lo que no pudo verificarse se omite, o se incluye nombrando su fuente («según refiere su esposa…») y contrastándolo con lo evaluado. La información de terceros se verifica antes de usarla, con más cuidado si quien la aporta tiene interés en el resultado. Nunca se redacta como un hecho.",
    citas: [["sch2018", "Schneider et al., 2018, cap. 4"], ["aera2014", "AERA, APA y NCME, 2014, cap. 10"]],
    lamina: "Lámina 9",
    ausente: "no mencionan el rumor" },
  { id: "contradiccion", tema: "Integración",
    titulo: "Evitar interpretar las fuentes por separado",
    caso: "Jairo dijo «Yo no estoy deprimido. Lo mío es físico», y su BDI-II dio 24, con el puntaje concentrado en ítems corporales (sueño, energía, cansancio) y los cognitivos en cero.",
    concepto: "Integrar no es poner los resultados uno al lado del otro: es combinar las fuentes y dar cuenta de las que se contradicen. Una discrepancia entre lo que dice la persona y lo que muestra una prueba no es un error que haya que descartar; suele ser información clínica que el informe explica. Un informe organizado prueba por prueba fragmenta a la persona.",
    citas: [["gmd2014", "Groth-Marnat y Davis, 2014, cap. 2"], ["gm2009", "Groth-Marnat, 2009, cap. 15"]],
    lamina: "Láminas 10 y 16" },
  { id: "validez", tema: "Calidad de los instrumentos",
    titulo: "Evitar interpretar un protocolo sin revisar su validez",
    caso: "Jairo dejó 36 ítems del MMPI-2 sin contestar, 31 de ellos después del 370: «las últimas me dio pereza». La hoja mostraba elevadas las escalas de contenido.",
    concepto: "Antes de interpretar un puntaje se revisa si el protocolo es válido. En el MMPI-2, con treinta o más ítems sin contestar lo más probable es que el protocolo sea inválido, y eso se informa. Las escalas básicas salen de los primeros 370 ítems; varias de las demás, entre ellas las de contenido, dependen de la parte final. Si las omisiones están al final, las básicas se leen con cautela y las de contenido no se interpretan; también es defendible no interpretar el protocolo. Anunciar «reservas» y concluir a partir de las escalas afectadas no es limitar la lectura.",
    citas: [["gm2009", "Groth-Marnat, 2009, cap. 7"]],
    lamina: "Lámina 8",
    // El perfil de Jairo, tal como lo trae el expediente, partido por lo que
    // se puede leer: para contrastar en vivo qué escalas citó cada informe.
    perfil: {
      basicas: [["Hipocondría (Hs)", 78], ["Depresión (D)", 72], ["Histeria (Hy)", 80], ["Desviación psicopática (Pd)", 55],
                ["Masculinidad-feminidad (Mf)", 48], ["Paranoia (Pa)", 58], ["Psicastenia (Pt)", 66], ["Esquizofrenia (Sc)", 60],
                ["Hipomanía (Ma)", 45], ["Introversión social (Si)", 62]],
      contenido: [["Ansiedad (ANX)", 75], ["Depresión (DEP)", 74], ["Preocupaciones por la salud (HEA)", 82],
                  ["Dificultades en el trabajo (WRK)", 66], ["Indicadores negativos de tratamiento (TRT)", 70]],
      contenidoBajas: "Miedos (FRS), Obsesividad (OBS), Pensamiento extravagante (BIZ), Enojo (ANG), Cinismo (CYN), Prácticas antisociales (ASP), Personalidad tipo A (TPA), Baja autoestima (LSE), Incomodidad social (SOD) y Problemas familiares (FAM)",
      notas: ["«Depresión» está en los dos grupos: D 72 es básica; DEP 74, de contenido. «Ansiedad» es solo de contenido; lo más cercano entre las básicas es Psicastenia (Pt) 66.",
              "Infrecuencia posterior (Fb) 71, por encima de Infrecuencia (F) 62: la parte final de la prueba se respondió con menos cuidado."]
    } },
  { id: "fortaleza", tema: "Lectura por áreas y pronóstico",
    titulo: "Evitar describir solo déficits",
    caso: "Jairo sigue entrenando los sábados el equipo de microfútbol de su hija («ni me acuerdo del pecho»), y en el trabajo «es el que sabe dónde está todo».",
    concepto: "Los informes tienden a enumerar déficits. Describir también las fortalezas y los recursos de la persona equilibra la descripción, favorece la relación con quien lo lee y orienta el tratamiento, que puede apoyarse en ellas para mejorar los resultados. No son un adorno: las áreas libres de conflicto sostienen el pronóstico.",
    citas: [["gm2009", "Groth-Marnat, 2009, cap. 15"], ["gmd2014", "Groth-Marnat y Davis, 2014, cap. 3"]],
    lamina: "Láminas 9, 11 y 12",
    ausente: "no mencionan ninguna fortaleza" },
  { id: "intimo", tema: "Ética",
    titulo: "Evitar incluir información confidencial ajena a la remisión",
    caso: "Jairo contó una relación de hace doce años, dijo que no tenía nada que ver con lo que le pasa y pidió que no quedara «en ningún papel». El informe va a su médica.",

    citas: [["ley1090", "Ley 1090 de 2006, art. 2, num. 5"], ["sch2018", "Schneider et al., 2018, cap. 4 y cap. 10, que cita la norma 4.04 del código de ética de la APA"]],
    lamina: "Lámina 8",
    ausente: "no incluyen el dato" }
];

const COLUMNAS = { mal: "Puede mejorar", bien: "Bien resuelto" };

/* ============================================================
   3. DETECCIÓN EN LOS INFORMES
   ============================================================
   El tablero lee las cuatro secciones de cada informe y ubica, para cada
   globo, las frases que tocan la trampa y de qué lado caen. Todo se compara
   en minúsculas y sin tildes. Las reglas se afinaron con los siete informes
   reales de Práctica II (2026-10-03): ver el comentario de cada una.
   Es una lectura de apoyo para la discusión, no una calificación.
   ============================================================ */
const SECCIONES = [["motivo", "f-motivo"], ["historia", "f-historia"], ["resultados", "f-resultados"], ["conclusion", "f-conclusion"]];

// Quita tildes sin cambiar la longitud del texto: las posiciones de una
// coincidencia en el texto normalizado sirven para resaltar en el original.
const normalizar = s => Array.from(String(s || "")).map(c => c.normalize("NFD")[0]).join("").toLowerCase();

// Corta en saltos de línea (hay quien escribe en listas, sin puntos) y en
// punto, signo de cierre o punto y coma seguidos de espacio.
function frasesDe(textos){
  const out = [];
  SECCIONES.forEach(([sec]) => String(textos[sec] || "").split(/\n+/).forEach(linea => {
    linea.replace(/^\s*[-•*]\s*/, "").split(/(?<=[.!?;])\s+/).forEach(f => {
      f = f.trim();
      if (f.length > 3) out.push({ sec, f, n: normalizar(f) });
    });
  }));
  return out;
}

const R = {
  // Rumor: solo lo que viene del rumor. «Alcohol» a secas atrapaba el
  // resultado del AUDIT, que todos informan (3 de 3 hallazgos eran eso).
  rumor: /bodega|yolanda|lo han visto|lo habrian visto|lo vieron|habria(n)? visto|tomando|(beb|tom|consum)\w* .{0,40}(trabajo|jornada|laboral)|(trabajo|jornada|laboral).{0,40}(beb|tom|alcohol|licor|embriag)|embriag|rumor|de oidas/,
  atribuido: /segun|refiere|refirio|comenta|menciona|reporta|informa|cuenta|conto|habria|de oidas|rumor|tercer|(no|sin) (se )?(pudo |ha podido )?(verific|confirm|comprob)|no verificad|no confirmad|sin evidencia/,
  // Fuentes que no coinciden: las frases del BDI-II y las que hablan de
  // concordancia entre pruebas y entrevista.
  contraCand: /\bbdi|beck|deprimid|no esta deprimido|lo suyo es fisico|niega|negacion|sin (cons)?ciencia|contrasta|discrep|no coincide|(consistentes|congruentes|coinciden) con la entrevista|segun lo evidenciado en las pruebas|integracion de (la )?entrevista/,
  contraBien: /contrasta|discrep|no coincide|sin (cons)?ciencia|a pesar de|aunque (el paciente |jairo )?(niega|refiere|dice|manifiesta)|niega.{0,80}(bdi|puntaj|prueba|inventario)|(bdi|beck|depresiv).{0,160}(aunque|pero|sin embargo|mientras).{0,100}(no se report|sin |en cero|ausen)|malestar (emocional )?(mediante|a traves|en el cuerpo)|expres\w* .{0,40}(cuerpo|corporal|somatic)|(items?|reactivos?) (corporales|somaticos|fisicos)|cognitiv\w* .{0,25}(en cero|ausentes|sin puntaje)|somatiz\w*.{0,80}(negacion|niega|atribu)|integracion de (la )?entrevista y (las )?pruebas/,
  contraMal: /\bbdi|beck|(consistentes|congruentes|coinciden) con la entrevista|segun lo evidenciado en las pruebas|niveles de (ansiedad y )?depresi/,
  // Validez: «omit» no encontraba «omisiones», y «MPI-2» o «MMPI2» se
  // escapaban. Bien resuelto si además limita la lectura a las básicas, dice
  // que las de contenido no se interpretan, o declara el protocolo inválido
  // por las omisiones (la regla de Groth-Marnat, 2009, cap. 7, para 30 o más).
  validezCand: /\bm?mpi|omision|omitid|sin contestar|sin responder|items? sin|hipocondr|histeria|psicastenia|triada|invalid|desestim/,
  validezBien: /(omision|omitid|sin contestar|sin responder|items? sin)[^]*?(no se interpreta|no son interpretables|no se pueden interpretar|solo (se interpretan |se leen |se pueden leer )?(las )?(escalas )?basicas|unicamente (las )?(escalas )?basicas|basicas (si )?se (pueden )?(leer|interpretar))|(no se interpreta|solo (se interpretan )?(las )?(escalas )?basicas)[^]*?(omision|omitid|sin contestar)|(omision|omitid|sin contestar|sin responder|items? sin)[^]*?(invalid|desestim)|(invalid|desestim)[^]*?(omision|omitid|sin contestar|sin responder|items? sin)/,
  // Fortaleza: además del microfútbol, la red de apoyo y la estabilidad que
  // un grupo usó en el pronóstico. Bien resuelto si aparece en la conclusión,
  // que es donde va el pronóstico; en la historia es solo una mención.
  fortaleza: /microf|futbol|entrena|fortalez|recursos? (personal|propio|de afrontamiento)|sabe donde esta|red de apoyo|apoyo (familiar|de su esposa|de su familia|social)|estabilidad (familiar|laboral)|insercion (social|laboral)|se mantiene activo|factor(es)? protector|confiable/,
  intimo: /relacion extra|extramatrimonial|infidel|otra mujer|amante|aventura|doce anos|12 anos|relacion (de hace|pasada|anterior|fuera)|vida de pareja de hace/,
  // Pregunta de remisión, en la conclusión: (1) se pronuncia sobre el
  // componente ansioso o depresivo; (2) sobre psicología o psiquiatría.
  // Un diagnóstico solo, sin verbo que lo afirme, no responde la pregunta.
  parte1: /componente (ansios|depresiv|emocional|ansioso-depresiv)|((se )?(confirm|evidenci|identific|observ|present|sugier|encuentr|aprecia)\w*|hay|existe|compatible con|presencia de).{0,60}(ansi|depres)/,
  parte2: /psicoterap|terapia|psicologic|(manejo|intervencion|tratamiento|atencion|seguimiento) (por |desde |con |en )?(la )?psicolog|psiquiatr/
};

// Siglas de la remisión y su forma completa.
const SIGLAS = { IDx: ["impresion diagnostica"], TAG: ["ansiedad generalizada"], TDM: ["depresivo mayor"],
                 IAM: ["infarto agudo", "infarto de miocardio"], EKG: ["electrocardiograma"],
                 // Formas del expediente; aceptar singular y plural y puntajes (HEA=82).
                 ANX: ["ansiedad"], DEP: ["depresion"],
                 HEA: ["preocupaciones por la salud", "preocupacion por la salud"],
                 WRK: ["dificultades en el trabajo"], TRT: ["indicadores negativos de tratamiento"],
                 VRIN: ["inconsistencia de respuestas variables"], TRIN: ["inconsistencia de respuestas verdaderas"],
                 Hs: ["hipocondria"], Hy: ["histeria"], D: ["depresion"],
                 Pd: ["desviacion psicopatica"], Mf: ["masculinidad-feminidad", "masculinidad feminidad"],
                 Pa: ["paranoia"], Pt: ["psicastenia"], Sc: ["esquizofrenia"],
                 Ma: ["hipomania"], Si: ["introversion social"],
                 F: ["infrecuencia"], Fb: ["infrecuencia posterior"], Fp: ["infrecuencia psicopatologica"],
                 L: ["mentira"], K: ["correccion"] };
// Siglas que no se cuentan: los instrumentos, que la sección 3 del informe ya
// trae escritos completos (también «MPI-2», el error de tipeo de un grupo);
// números romanos, y palabras escritas en mayúscula.
const SIGLAS_PERMITIDAS = new Set(["MMPI", "MPI", "BDI", "BAI", "AUDIT", "II", "III", "IV",
  "EL", "LA", "LOS", "LAS", "DE", "DEL", "Y", "EN", "SE", "NO", "SI", "UN", "UNA", "AL", "CON", "POR", "QUE", "ES", "SU", "LO", "O", "A"]);
// Límites Unicode: una vocal acentuada nunca parte una palabra en falsas siglas.
const escaparRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const conSigla = s => new RegExp("(?<![\\p{L}\\p{M}\\p{N}_])" + escaparRegex(s) + "(?![\\p{L}\\p{M}\\p{N}_])", "iu");
const contieneForma = (texto, forma) => conSigla(forma).test(texto.replace(/\s+/g, " "));

// Las letras únicas y códigos que coinciden con palabras necesitan contexto
// de escala: puntaje, nombre de escala o lista entre paréntesis con otras escalas.
function usosSigla(s, texto){
  const re = conSigla(s);
  const todas = [...texto.matchAll(new RegExp(re.source, "giu"))];
  if (!["D", "F", "L", "K", "Si", "Ma", "Pa"].includes(s)) return todas;
  return todas.filter(m => {
    const antes = texto.slice(Math.max(0, m.index - 35), m.index);
    const despues = texto.slice(m.index + m[0].length);
    return /^\s*(?:[=:]\s*|\(\s*)?\d/.test(despues) ||
      /escala\s*\(?\s*$/i.test(antes) ||
      /\([^()]*\b(?:Hs|Hy|Pt|Pd|Mf|Sc)\b[^()]*$/i.test(antes) ||
      (SIGLAS[s].some(forma => normalizar(antes).trim().endsWith(forma + " (")));
  });
}

function siglaExplicada(s, todo){
  const norm = normalizar(todo).replace(/\s+/g, " ");
  if (["IDx", "TAG", "TDM", "IAM", "EKG"].includes(s)) return SIGLAS[s].some(forma => contieneForma(norm, forma));
  // Para escalas, «depresión» en otro apartado no desarrolla por sí sola D.
  return usosSigla(s, norm).some(m => SIGLAS[s].some(forma => {
    const antes = norm.slice(0, m.index);
    const despues = norm.slice(m.index + m[0].length);
    return new RegExp(escaparRegex(forma) + "\\s*[(,:—-]?\\s*$", "u").test(antes) ||
      new RegExp("^\\s*[(,:—-]?\\s*" + escaparRegex(forma) + "(?![\\p{L}\\p{M}])", "u").test(despues);
  }));
}

function siglasSinExplicar(textos){
  const todo = SECCIONES.map(([s]) => textos[s] || "").join(" \n ").normalize("NFC");
  const norm = normalizar(todo);
  const faltan = [];
  Object.keys(SIGLAS).forEach(s => {
    if (usosSigla(s, todo).length && !siglaExplicada(s, todo)) faltan.push(s);
  });
  // Examinar palabras completas, con tildes y marcas combinadas. Nunca fragmentos
  // como DIAGN / STICO de DIAGNÓSTICO ni SITUA de SITUACIÓN.
  (todo.match(/[\p{L}\p{M}\p{N}_]+/gu) || []).forEach(s => {
    if (!/^[A-ZÑ]{2,6}$/.test(s)) return;
    if (Object.keys(SIGLAS).some(k => k.toUpperCase() === s) || SIGLAS_PERMITIDAS.has(s) || faltan.includes(s)) return;
    // Para siglas adicionales, exigir una forma cuyas iniciales correspondan.
    // El paréntesis solo, o un puntaje como (TCC=20), no explica una sigla.
    const re = new RegExp("([\\p{L}\\p{M} ,]+)\\(\\s*" + escaparRegex(s) + "\\s*\\)", "gu");
    const explicada = [...todo.matchAll(re)].some(m => {
      const palabras = normalizar(m[1]).match(/[a-zñ]+/g) || [];
      const utiles = palabras.filter(p => !["de", "del", "la", "las", "el", "los", "y", "en", "por", "para"].includes(p));
      return utiles.slice(-s.length).map(p => p[0]).join("") === s.toLowerCase();
    });
    if (!explicada) faltan.push(s);
  });
  return faltan;
}

// Analiza un informe y devuelve, por globo, sus frases de cada lado.
function analizar(textos){
  const F = frasesDe(textos);
  const r = {};
  const de = (filtro) => F.filter(filtro);

  // 1. Pregunta de remisión: se juzga el informe entero por su conclusión.
  const concl = de(x => x.sec === "conclusion");
  // Se guarda la primera frase que responde cada parte, por separado, para
  // mostrar una línea por parte; sin ninguna, el comienzo de la conclusión,
  // que es lo que el informe puso en lugar de la respuesta.
  const p1 = concl.find(x => R.parte1.test(x.n)), p2 = concl.find(x => R.parte2.test(x.n));
  const resp = { p1: p1 ? p1.f : null, p2: p2 ? p2.f : null,
                 otro: !p1 && !p2 && concl.length ? unir(concl.slice(0, 2)) : null };
  r.pregunta = p1 && p2 ? { bien: [resp], mal: [] } : { bien: [], mal: [resp] };

  // 2. Siglas: conservar los aciertos y pendientes de cada frase por separado.
  const faltan = siglasSinExplicar(textos);
  const detalles = F.map(x => {
    const pendientes = faltan.filter(s => usosSigla(s, x.f).length);
    const formas = [];
    Object.keys(SIGLAS).forEach(s => {
      if (faltan.includes(s)) return;
      if (!["IDx", "TAG", "TDM", "IAM", "EKG"].includes(s) && !usosSigla(s, x.f).length) return;
      SIGLAS[s].forEach(forma => { if (contieneForma(x.n, forma)) formas.push(forma); });
    });
    return { f: x.f, pendientes, formas: [...new Set(formas)] };
  }).filter(x => x.pendientes.length || x.formas.length);
  r.siglas = { faltan, detalles,
    mal: detalles.filter(x => x.pendientes.length && !x.formas.length).map(x => x.f),
    bien: detalles.filter(x => x.formas.length && !x.pendientes.length).map(x => x.f),
    parcial: detalles.filter(x => x.formas.length && x.pendientes.length).map(x => x.f) };

  // 3. Rumor
  const rum = de(x => R.rumor.test(x.n));
  r.rumor = { hay: rum.length > 0, bien: rum.filter(x => R.atribuido.test(x.n)).map(x => x.f),
              mal: rum.filter(x => !R.atribuido.test(x.n)).map(x => x.f) };

  // 4. Fuentes que no coinciden
  const con = de(x => R.contraCand.test(x.n));
  r.contradiccion = { bien: con.filter(x => R.contraBien.test(x.n)).map(x => x.f),
                      mal: con.filter(x => !R.contraBien.test(x.n) && R.contraMal.test(x.n)).map(x => x.f) };

  // 5. Validez
  const val = de(x => R.validezCand.test(x.n));
  r.validez = { bien: val.filter(x => R.validezBien.test(x.n)).map(x => x.f),
                mal: val.filter(x => !R.validezBien.test(x.n)).map(x => x.f) };

  // 6. Fortaleza
  const fort = de(x => R.fortaleza.test(x.n));
  r.fortaleza = { hay: fort.length > 0, bien: fort.filter(x => x.sec === "conclusion").map(x => x.f),
                  mal: fort.filter(x => x.sec !== "conclusion").map(x => x.f) };

  // 7. Dato confidencial: cualquier inclusión es el error.
  const int = de(x => R.intimo.test(x.n));
  r.intimo = { hay: int.length > 0, bien: [], mal: int.map(x => x.f) };
  return r;
}
function unir(frases){ return frases.map(x => x.f).join(" ").trim(); }

/* ============================================================
   5. CARGA (fetch, con JSONP de respaldo)
   ============================================================ */
const MODO_DEMO = FUENTE.url === "PENDIENTE" || /[?&]demo=1\b/.test(location.search);

function direcciones(){
  const lista = [FUENTE.url];
  if (!FUENTE.alterna) return lista;
  const otra = FUENTE.url.indexOf("/a/macros/") !== -1
    ? FUENTE.url.replace(/\/a\/macros\/[^/]+\/s\//, "/macros/s/")
    : FUENTE.url.replace("/macros/s/", "/a/macros/areandina.edu.co/s/");
  if (otra !== FUENTE.url) lista.push(otra);
  return lista;
}
function urlResumen(base, grupo){
  return base + "?tablero=" + encodeURIComponent(FUENTE.caso) + "&curso=" + encodeURIComponent(FUENTE.curso) +
    (grupo ? "&grupo=" + encodeURIComponent(grupo) : "") + "&t=" + Date.now();
}
let contadorCallback = 0;
function pedirJsonp(url){
  return new Promise((resolver, rechazar) => {
    const nombre = "__informe_cb_" + (++contadorCallback);
    const script = document.createElement("script");
    const limpiar = () => { delete window[nombre]; script.remove(); };
    const reloj = setTimeout(() => { limpiar(); rechazar(new Error("sin respuesta a tiempo")); }, 15000);
    window[nombre] = datos => { clearTimeout(reloj); limpiar(); resolver(datos); };
    script.onerror = () => { clearTimeout(reloj); limpiar(); rechazar(new Error("script bloqueado o sin respuesta")); };
    script.src = url + "&callback=" + nombre;
    document.body.appendChild(script);
  });
}
async function pedirResumen(grupo){
  let ultimoFallo = null;
  for (const base of direcciones()) {
    const url = urlResumen(base, grupo);
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (errFetch) {
      try { return await pedirJsonp(url); }
      catch (errScript) { ultimoFallo = new Error("fetch: " + errFetch.message + " · script: " + errScript.message); }
    }
  }
  throw ultimoFallo || new Error("sin dirección");
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const numeroDeGrupo = e => parseInt(String(e.grupo).replace(/\D/g, ""), 10) || 0;

let entregas = [];     // [{ grupo, cursoGrupo, textos, r }]
let firma = "";
let cargando = false;
let actual = 0;
let paso = 0;          // 0 título · 1 argumento y expediente · 2 informes

// Un informe trae sus cuatro secciones en «textos» (receptor actualizado el
// 2026-10-05). Sin ellas no hay nada que leer.
function prepararEntregas(lista){
  return lista.filter(e => e.textos && SECCIONES.some(([s]) => (e.textos[s] || "").trim()))
    .sort((a, b) => (a.cursoGrupo + numeroDeGrupo(a)).localeCompare(b.cursoGrupo + numeroDeGrupo(b), "es", { numeric: true }))
    .map(e => Object.assign({}, e, { r: analizar(e.textos) }));
}
let sinTextos = 0;

/* ============================================================
   7. LOS GLOBOS Y LA ESCENA
   ============================================================ */
function pintarGlobos(){
  $("globos").innerHTML = GLOBOS.map((g, i) =>
    `<button class="globo" type="button" data-i="${i}"><span class="num">${i + 1} · ${esc(g.tema)}</span>${esc(g.titulo)}</button>`).join("");
}

// Frase larga: se muestra la ventana alrededor de lo que la hizo caer en el
// globo, para que se lea de lejos.
// Se resaltan todas las coincidencias que caen dentro de la ventana.
function recortar(frase, re, LIM = 300){
  const n = normalizar(frase);
  const tramos = [];
  if (re) {
    const g = new RegExp(re.source, "g"); let m;
    while ((m = g.exec(n))) { if (!m[0].length) { g.lastIndex++; continue; } tramos.push([m.index, m.index + m[0].length]); }
  }
  let a = 0, b = frase.length;
  if (frase.length > LIM) {
    const centro = tramos.length ? (tramos[0][0] + tramos[0][1]) / 2 : 0;
    a = Math.max(0, Math.round(centro - LIM / 2)); b = Math.min(frase.length, a + LIM); a = Math.max(0, b - LIM);
    while (a > 0 && frase[a - 1] !== " ") a--;
    while (b < frase.length && frase[b] !== " ") b++;
  }
  let html = "", pos = a;
  tramos.filter(([x, y]) => x >= a && y <= b).forEach(([x, y]) => {
    if (x < pos) return;
    html += esc(frase.slice(pos, x)) + "<mark>" + esc(frase.slice(x, y)) + "</mark>";
    pos = y;
  });
  html += esc(frase.slice(pos, b));
  return (a > 0 ? "…" : "") + html + (b < frase.length ? "…" : "");
}

// Lo que se resalta en cada frase, por globo y columna: términos cortos, para
// que la negrita no corte palabras ni ocupe la frase entera.
const RESALTE = {
  rumor: { mal: /bodega|tomando|lo han visto|embriag\w*|alcohol/, bien: /segun|refiere|comenta|menciona|reporta|habria|no verificad\w*|sin (verificar|confirmar)|no (se )?(pudo )?(verificar|confirmar)/ },
  contradiccion: { mal: /\bbdi-?i*|consistentes con la entrevista|congruentes con la entrevista|segun lo evidenciado en las pruebas/,
                   bien: /contrasta|discrep\w*|no coincide|sin (cons)?ciencia|aunque|a pesar de|niega|en cero|corporal\w*|somatiz\w*|negacion|integracion de entrevista y pruebas/ },
  // En «Puede mejorar» se resalta la escala de contenido que se interpretó, no
  // las básicas (hipocondría, histeria), que sí podían leerse.
  validez: { mal: /preocupaci\w* por la salud|ansiedad|dificultades (laborales|en el trabajo)|omision\w*|sin contestar/,
             bien: /omision\w*|sin contestar|no se interpreta\w*|escalas basicas|basicas|invalid\w*|desestim\w*/ },
  fortaleza: { mal: R.fortaleza, bien: /microf\w*|futbol|entrena\w*|red de apoyo|apoyo \w+|estabilidad \w+|insercion \w+( y \w+)?|se mantiene activo|fortalez\w*|favorec\w*|pronostico/ },
  intimo: { mal: R.intimo, bien: R.intimo },
  // Siglas: en «Puede mejorar», las que quedaron sin explicar (se arma en
  // htmlInformes con las de cada momento); en «Bien resuelto», la forma completa.
  siglas: { mal: null, bien: new RegExp(Object.values(SIGLAS).flat().map(escaparRegex).join("|")) },
  pregunta: { mal: null, bien: null }   // va por partes: ver PARTES_PREGUNTA
};

// Pregunta de remisión: una línea por parte, cada una con su frase recortada
// por separado y su propio resaltado. «otro» es el diagnóstico (u otra cosa)
// que quedó en lugar de la respuesta.
const PARTES_PREGUNTA = [
  { clave: "p1", rot: "¿Componente ansioso o depresivo?",
    re: /componente \w+( \w+)?|sintomatologia (ansiosa|depresiva)( y depresiva)?|ansiedad moderada|ansios\w*|depresiv\w*/ },
  { clave: "p2", rot: "¿Psicología o psiquiatría?",
    re: /psicoterap\w*|terapia|manejo psicologico|intervencion psicologica|(manejo|valoracion|remision|atencion) (por |a |con )?(la )?psiquiatr\w*|psiquiatr\w*/ },
  { clave: "otro", rot: "En su lugar", re: /trastorno (de |del )?[a-z]+( [a-z]+)?/ }
];
function htmlRespuesta(v){
  return PARTES_PREGUNTA.map(p => {
    if (p.clave === "otro" && !v.otro) return "";
    if (p.clave !== "otro" && v.p1 === v.p2 && p.clave === "p2" && v.p1) return "";   // una frase responde las dos
    const rot = p.clave === "p1" && v.p1 && v.p1 === v.p2 ? "Las dos partes" : p.rot;
    const f = v[p.clave];
    return `<div class="resp-linea"><span class="resp-rot">${esc(rot)}</span>${
      f ? "«" + recortar(f, p.re, 220) + "»" : `<span class="resp-falta">No lo responde</span>`}</div>`;
  }).join("");
}

// Una frase por informe y por columna, tres como máximo, sin repetir. Un
// informe que resolvió bien la trampa no aparece además en «Puede mejorar»,
// salvo en siglas, donde un mismo informe puede explicar unas y otras no.
function voces(g, lado){
  const lista = [];
  entregas.forEach(e => {
    const x = e.r[g.id];
    if (lado === "mal" && g.id !== "siglas" && (x.bien || []).length) return;
    const f = (x[lado] || [])[0];
    const clave = JSON.stringify(f);   // la pregunta de remisión guarda un objeto por informe
    if (f && !lista.some(x => JSON.stringify(x) === clave)) lista.push(f);
  });
  return lista.slice(0, 3);
}

// Cada tarjeta de siglas conserva la frase completa: recortarla podría ocultar
// precisamente el acierto o el pendiente que justifica la categoría mixta.
function htmlFraseSiglas(detalle){
  const { f, pendientes, formas } = detalle;
  const tramos = [];
  pendientes.forEach(s => usosSigla(s, f).forEach(m => tramos.push({ a: m.index, b: m.index + m[0].length, tipo: "pendiente" })));
  formas.forEach(forma => {
    const re = conSigla(forma);
    for (const m of normalizar(f).matchAll(new RegExp(re.source, "giu"))) tramos.push({ a: m.index, b: m.index + m[0].length, tipo: "explicada" });
  });
  let pos = 0, html = "";
  tramos.sort((a, b) => a.a - b.a || b.b - a.b).forEach(t => {
    if (t.a < pos) return;
    html += esc(f.slice(pos, t.a)) + `<mark class="sigla-${t.tipo}">${esc(f.slice(t.a, t.b))}</mark>`;
    pos = t.b;
  });
  return html + esc(f.slice(pos));
}
function htmlDetalleSiglas(d){
  const mixta = d.pendientes.length && d.formas.length;
  return `<div class="voz${mixta ? " voz-parcial" : ""}">${mixta ? '<span class="siglas-etiqueta">Parcialmente resuelto</span>' : ""}
    <div>«${htmlFraseSiglas(d)}»</div>
    <div class="siglas-claves">${d.formas.length ? '<span class="clave-explicada">✓ Forma completa</span>' : ""}
    ${d.pendientes.length ? `<span class="clave-pendiente">! Sin desarrollar: ${d.pendientes.map(esc).join(" · ")}</span>` : ""}</div></div>`;
}
function htmlVocesSiglas(){
  const listas = { mal: [], bien: [], parcial: [] };
  entregas.forEach(e => {
    for (const tipo of Object.keys(listas)) {
      const d = e.r.siglas.detalles.find(x => tipo === "parcial" ? x.pendientes.length && x.formas.length : tipo === "mal" ? x.pendientes.length && !x.formas.length : x.formas.length && !x.pendientes.length);
      if (d && !listas[tipo].some(x => JSON.stringify(x) === JSON.stringify(d))) listas[tipo].push(d);
    }
  });
  const col = (tipo, titulo, vacio) => `<div class="col-voz ${tipo}"><h3>${titulo}</h3>${listas[tipo].length ? listas[tipo].slice(0,3).map(htmlDetalleSiglas).join("") : `<div class="vacio-msg">${vacio}</div>`}</div>`;
  return `<div class="voces">${col("mal", "Puede mejorar", "No hay frases con solo siglas pendientes.")}${col("bien", "Bien resuelto", "No hay frases con todas las siglas detectadas explicadas.")}</div>` +
    (listas.parcial.length ? `<div class="siglas-parciales">${col("parcial", "Aciertos con aspectos pendientes", "")}</div>` : "");
}

function htmlInformes(g){
  if (!entregas.length) {
    return `<div class="vacio-msg" style="margin-top:20px">${sinTextos
      ? "Llegaron entregas, pero el receptor no está enviando el texto de los informes: hay que publicar la versión nueva del Apps Script."
      : "Todavía no llegó ningún informe de este grupo."}</div>`;
  }
  const n = entregas.length;
  const faltanTodas = [...new Set(entregas.flatMap(e => e.r.siglas.faltan))];
  const col = (lado, vacio) => {
    const vs = voces(g, lado);
    let re = RESALTE[g.id][lado];
    if (g.id === "siglas" && lado === "mal" && faltanTodas.length) re = new RegExp("\\b(" + faltanTodas.map(s => s.toLowerCase()).join("|") + ")\\b");
    return `<div class="col-voz ${lado}"><h3>${COLUMNAS[lado]}</h3>${
      vs.length ? vs.map(v => g.id === "pregunta"
                    ? `<div class="voz">${htmlRespuesta(v)}</div>`
                    : `<div class="voz">«${recortar(v, re)}»</div>`).join("")
                : `<div class="vacio-msg">${vacio}</div>`}</div>`;
  };
  let arriba = "";
  if (g.ausente) {
    const sin = entregas.filter(e => !e.r[g.id].hay).length;
    arriba = `<div class="ausencia">${sin} de ${n} informes ${g.ausente}.</div>`;
  }
  if (g.id === "siglas") {
    const cuenta = {};
    entregas.forEach(e => e.r.siglas.faltan.forEach(s => cuenta[s] = (cuenta[s] || 0) + 1));
    const orden = Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a]);
    arriba = orden.length
      ? `<div class="siglas-rot">Quedaron sin su forma completa</div><div class="siglas-chips">${orden.map(s => `<span class="sigla">${esc(s)}<small>×${cuenta[s]}</small></span>`).join("")}</div>`
      : `<div class="ausencia">Ningún informe dejó una sigla sin su forma completa.</div>`;
  }
  if (g.id === "siglas") return arriba + htmlVocesSiglas();
  const vacioMal = { pregunta: "Todos los informes responden las dos partes.", fortaleza: "Quien no mencionó ninguna no tiene frase que mostrar.",
                     siglas: "Ningún informe dejó una sigla sin explicar.", intimo: "Ningún informe lo incluyó." }[g.id] || "Ningún informe dejó una frase de este lado.";
  const vacioBien = { intimo: "Quien lo dejó fuera no tiene frase que mostrar: ese es el acierto.", rumor: "Quien lo dejó fuera no tiene frase que mostrar.",
                      siglas: "Ningún informe incluyó una forma completa reconocida por el detector." }[g.id] || "Ningún informe dejó una frase de este lado.";
  return arriba + `<div class="voces">${col("mal", vacioMal)}${col("bien", vacioBien)}</div>`;
}

// Perfil del MMPI-2 en dos columnas: lo que se lee y lo que no. Las
// elevaciones (T ≥ 65) van en negrita.
function htmlPerfil(p){
  const lista = filas => filas.map(([n, t]) => `<li${t >= 65 ? ' class="alta"' : ""}><span>${esc(n)}</span><b>${t}</b></li>`).join("");
  return `<div class="perfil">
    <div class="perfil-col lee"><div class="perfil-rot">Básicas · primeros 370 ítems</div><div class="perfil-sub">Se leen, con cautela</div><ul>${lista(p.basicas)}</ul></div>
    <div class="perfil-col no"><div class="perfil-rot">Contenido · dependen de los ítems 371 a 567</div><div class="perfil-sub">No se interpretan</div><ul>${lista(p.contenido)}</ul>
      <p class="perfil-bajas">Por debajo de 65: ${esc(p.contenidoBajas)}.</p></div>
  </div>${p.notas.map(n => `<p class="perfil-nota">${esc(n)}</p>`).join("")}`;
}

function pintarEscena(){
  const g = GLOBOS[actual];
  $("cuenta").textContent = `${actual + 1} de ${GLOBOS.length} · ${g.tema}`;
  $("q-texto").textContent = g.titulo;
  $("caso").textContent = g.caso;

  $("concepto").textContent = g.concepto;
  $("citas").innerHTML = g.citas.map(c => `<span>${esc(c[1])}</span>`).join(" · ") + ` · <span>En el deck: ${esc(g.lamina)}</span>`;
  $("referencias").innerHTML = `<span class="rot">Referencias</span>` +
    [...new Set(g.citas.map(c => c[0]))].map(k => `<p>${REFERENCIAS[k]}</p>`).join("");
  $("informes").innerHTML = htmlInformes(g);
  $("argumento").hidden = paso < 1;
  $("bt-argumento").parentNode.hidden = paso >= 1;
  $("bt-informes").parentNode.hidden = paso >= 2;
  $("informes").hidden = paso < 2;
  $("referencias").hidden = paso < 1;
  $("escena").classList.toggle("avanzado", paso >= 1);
}

function abrir(i){
  actual = i; paso = 0;
  pintarEscena();
  $("escena").classList.add("abierta");
  document.body.style.overflow = "hidden";
  $("escena-cuerpo").scrollTop = 0;
  $("bt-argumento").focus();
}
function cerrar(){
  $("escena").classList.remove("abierta");
  document.body.style.overflow = "";
  const b = document.querySelector(`.globo[data-i="${actual}"]`);
  if (b) b.focus();
}
function mover(d){
  actual = (actual + d + GLOBOS.length) % GLOBOS.length; paso = 0;
  pintarEscena();
  $("escena-cuerpo").scrollTop = 0;
}
function avanzar(){
  if (paso >= 2) return;
  paso++;
  pintarEscena();
  if (paso === 2) $("informes").scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ============================================================
   8. CICLO DE ACTUALIZACIÓN
   ============================================================ */
function avisar(texto, error){
  const el = $("estado");
  el.textContent = texto;
  el.classList.toggle("error", !!error);
}
const grupoElegido = () => $("f-grupo").value;

async function actualizar(){
  if (cargando) return;
  cargando = true;
  try {
    let lista;
    if (MODO_DEMO) {
      lista = DEMO.map(x => ({ cursoGrupo: GRUPOS_CURSO[0], grupo: "Grupo " + x.g, textos: x.t }));
    } else {
      const datos = await pedirResumen(grupoElegido());
      if (!datos || datos.ok === false) throw new Error(datos && datos.error ? datos.error : "respuesta inválida");
      lista = Array.isArray(datos.entregas) ? datos.entregas : [];
    }
    // Solo se repinta si llegó algo distinto: repintar por repintar movería
    // la pantalla en medio de la discusión.
    const nuevaFirma = JSON.stringify(lista);
    if (nuevaFirma !== firma) {
      firma = nuevaFirma;
      entregas = prepararEntregas(lista);
      sinTextos = lista.length - entregas.length;
      if ($("escena").classList.contains("abierta")) $("informes").innerHTML = htmlInformes(GLOBOS[actual]);
    }
    avisar((MODO_DEMO ? "ensayo · " : "") + entregas.length + (entregas.length === 1 ? " informe" : " informes") +
           (sinTextos ? ` · ${sinTextos} sin texto` : ""), sinTextos > 0);
  } catch (err) {
    avisar("sin conexión con el receptor — " + err.message, true);
  } finally {
    cargando = false;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const aviso = $("js-warning-fallback");
  if (aviso) aviso.style.display = "none";
  try {
    const sel = $("f-grupo");
    sel.innerHTML = GRUPOS_CURSO.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("") +
      (GRUPOS_CURSO.length > 1 ? `<option value="">Todos los grupos</option>` : "");
    sel.hidden = GRUPOS_CURSO.length < 2;
    try {
      const previo = localStorage.getItem("informe_tablero_grupo:" + FUENTE.curso);
      if (previo !== null && [...sel.options].some(o => o.value === previo)) sel.value = previo;
    } catch (e) {}
    sel.addEventListener("change", () => {
      try { localStorage.setItem("informe_tablero_grupo:" + FUENTE.curso, sel.value); } catch (e) {}
      firma = ""; entregas = [];
      actualizar();
    });

    pintarGlobos();
    $("globos").addEventListener("click", ev => {
      const b = ev.target.closest(".globo");
      if (b) abrir(Number(b.dataset.i));
    });
    $("bt-argumento").addEventListener("click", avanzar);
    $("bt-informes").addEventListener("click", avanzar);
    $("bt-cerrar").addEventListener("click", cerrar);
    $("bt-ant").addEventListener("click", () => mover(-1));
    $("bt-sig").addEventListener("click", () => mover(1));
    document.addEventListener("keydown", e => {
      if (!$("escena").classList.contains("abierta")) return;
      if (e.key === "Escape") cerrar();
      else if (e.key === "ArrowRight") { e.preventDefault(); mover(1); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); mover(-1); }
      else if (e.key === " " || (e.key === "Enter" && e.target.tagName !== "BUTTON")) { e.preventDefault(); avanzar(); }
    });

    actualizar();
    setInterval(actualizar, FUENTE.refrescoMs);
  } catch (err) {
    if (aviso) { aviso.style.display = ""; aviso.textContent = "Error al iniciar el tablero: " + err.message; }
  }
});
</script>
</body>
</html>
