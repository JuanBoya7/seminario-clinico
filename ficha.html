<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ficha en línea</title>
<style>
/* Fichas de trabajo en línea. Los datos vienen de fichas-web/<guía>/<clave>.json, que
   escribe _planes-fuente/fichas/exportar_web.py desde las mismas definiciones de los
   PDF (fichas_datos.py): lo que se ve aquí es exactamente lo que trae la ficha en PDF.
   Lo que se escribe no se envía ni se guarda: vive solo en esta pestaña. */
:root{
  --bg:#ffffff; --surface:#f6f8f8; --border:#dde5e5; --campo:#f7fafa;
  --ink:#16232b; --ink-soft:#4b5c63; --ink-faint:#7d8c91;
  --accent:#1f6f78; --accent-dark:#134349; --accent-soft:#e2eff0;
  --ambar:#b8722a; --ambar-soft:#fbf1e4;
  --font-display:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; -webkit-font-smoothing:antialiased;}
h1,h2{font-family:var(--font-display); font-weight:600; margin:0;}
.wrap{max-width:900px; margin:0 auto; padding:28px 20px 60px;}
.rotulo{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
h1{font-size:clamp(23px,3vw,32px); line-height:1.2;}
.enfoque{font-size:13px; font-weight:600; color:var(--accent); margin-top:6px;}
.cab{display:flex; gap:22px; align-items:flex-start;}
.cab .txt{flex:1 1 auto; min-width:0;}
.cab .ilus{flex:0 0 auto; width:min(30%,220px); text-align:center;}
.cab .ilus img{max-width:100%; height:auto;}
.cab .ilus small{display:block; font-size:12px; color:var(--ink-soft);}
.sec{font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-dark); margin:18px 0 4px;}
.para{color:var(--ink-soft); margin:0; max-width:70ch;}
ul.como{margin:4px 0 0; padding-left:20px; color:var(--ink-soft);}
ul.como li{margin:3px 0;}
.aviso-p{margin:18px 0 0; padding:10px 14px; background:var(--surface); border-radius:10px; font-size:13px; color:var(--ink-soft); border:1px solid var(--border);}
.acciones{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.bt{font:inherit; font-size:13.5px; font-weight:600; color:var(--accent-dark); background:var(--bg); border:1px solid var(--accent); border-radius:8px; padding:7px 13px; cursor:pointer;}
.bt:hover{background:var(--accent-soft);}
.datos{display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; margin:20px 0 0;}
label.c{display:block; font-size:13px; font-weight:600; color:var(--ink); margin:14px 0 4px;}
.datos label.c{margin-top:0;}
textarea,input[type=text]{width:100%; font:inherit; font-size:15px; color:var(--ink); background:var(--campo); border:1px solid var(--border); border-radius:8px; padding:8px 10px; resize:vertical;}
textarea:focus,input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
h2.tit{font-size:19px; margin:26px 0 4px; padding-bottom:5px; border-bottom:1px solid var(--border); color:var(--accent-dark);}
p.nota{margin:10px 0; color:var(--ink-soft);}
/* Tablas: rejilla en pantallas anchas, tarjetas por fila en el celular. */
.tabla{width:100%; border-collapse:collapse; margin:12px 0; table-layout:fixed;}
.tabla th{font-size:12.5px; text-align:left; vertical-align:bottom; background:var(--accent-soft); color:var(--accent-dark); padding:7px 8px; border:1px solid var(--border);}
.tabla td{border:1px solid var(--border); padding:4px; vertical-align:top;}
.tabla td textarea,.tabla td input{border:0; background:transparent; padding:4px 6px; min-height:2.4em; resize:none; overflow:hidden;}
.tabla td.fija{font-size:13.5px; font-weight:600; padding:8px; background:var(--surface);}
@media (max-width:700px){
  .tabla, .tabla tbody, .tabla tr, .tabla td{display:block; width:100%;}
  .tabla thead{display:none;}
  .tabla tr{border:1px solid var(--border); border-radius:10px; margin:0 0 12px; padding:8px 10px; background:var(--bg);}
  .tabla td{border:0; padding:4px 0;}
  .tabla td::before{content:attr(data-col); display:block; font-size:12px; font-weight:600; color:var(--accent-dark); margin-bottom:2px;}
  .tabla td textarea,.tabla td input{background:var(--campo); border:1px solid var(--border); border-radius:8px; resize:vertical;}
  .tabla td input{min-height:0;}
  .tabla td.fija{background:transparent; padding:0 0 4px; font-size:14.5px;}
  .tabla td.fija::before{content:none;}
  .datos{grid-template-columns:1fr;}
  .cab{flex-direction:column-reverse;}
  .cab .ilus{width:60%; margin:0 auto;}
}
.casillas{display:grid; gap:6px 18px; margin:10px 0;}
.casillas label{display:flex; gap:8px; align-items:flex-start; font-size:14.5px;}
.casillas input{margin-top:4px; width:18px; height:18px; flex:none;}
.lista{margin:12px 0;}
.lista b{display:block; color:var(--accent-dark); margin-bottom:4px;}
.lista ul,.lista ol{margin:0; padding-left:22px;}
.lista li{margin:4px 0;}
.pasos{display:grid; gap:14px; margin:14px 0;}
.paso{border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; gap:12px; align-items:flex-start; background:var(--bg);}
.paso img{width:110px; height:auto; flex:none;}
.paso .n{display:inline-flex; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:13px; align-items:center; justify-content:center; margin-right:6px;}
.paso b{font-size:15px;}
.paso p{margin:4px 0 0; color:var(--ink-soft); font-size:14px;}
.galeria{display:grid; gap:12px; margin:14px 0;}
.galeria figure{margin:0; text-align:center; border:1px solid var(--border); border-radius:12px; padding:10px;}
.galeria img{max-width:100%; height:auto;}
.galeria figcaption{font-size:13px; color:var(--ink-soft);}
.guion p{margin:10px 0; font-size:15.5px; line-height:1.6;}
.guion .pausa{display:inline-block; margin-left:6px; font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.06em;}
.guion .indica{font-style:italic; color:var(--ink-soft); font-size:14px; border-left:3px solid var(--accent-soft); padding-left:10px;}
.cuidado{margin:14px 0; padding:12px 14px; background:var(--ambar-soft); border:1px solid #ecd2ad; border-left:4px solid var(--ambar); border-radius:10px;}
.cuidado b{display:block; color:#7a4a17; margin-bottom:3px;}
.pie{margin-top:30px; padding-top:12px; border-top:1px solid var(--border); font-size:12.5px; color:var(--ink-faint);}
.error{color:#a83f2b;}
/* Guía de niños y adolescentes: los colores de sus fichas; letra más grande para los niños. */
body.infancia{--accent:#c4663c; --accent-dark:#8a4222; --accent-soft:#f8e7de; --surface:#fdf9f5; --border:#e6d6ca; --campo:#fffaf6;}
body.nino{font-size:17px;} body.nino h1{font-size:clamp(26px,4vw,36px);}
/* Banda ilustrada de cabecera: una imagen por público (fichas-web/bandas/<público>.jpg),
   compartida por todas las fichas de ese público; el velo mantiene legible el título. */
.banda{position:relative; margin:0 0 20px; padding:28px 26px 24px; aspect-ratio:3/1; min-height:178px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; isolation:isolate; border-radius:16px; overflow:hidden; color:var(--banda-tinta);}
.banda .fondo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:right center; z-index:-2;}
.banda .velo{position:absolute; inset:0; z-index:-1; background:var(--banda-velo);}
/* Encuadre de cada imagen (16:9) dentro de la banda (3:1): lo que importa de cada escena.
   La de padres tiene fondo blanco: se muestra completa, sin recorte, a la derecha. */
body.pub-adultos .banda .fondo{object-position:right 60%;}
body.pub-adolescente .banda .fondo{object-position:right 72%;}
body.pub-nino .banda .fondo{object-position:right 38%;}
body.pub-padres .banda{background:#fff; border:1px solid var(--border);}
body.pub-padres .banda .fondo{object-fit:contain; object-position:right center;}
.banda h1{max-width:62%;}
.banda .enfoque{color:inherit; opacity:.85;}
.chip{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; border:1px solid var(--chip-borde); background:var(--chip-fondo); padding:5px 12px; border-radius:999px; margin-bottom:12px;}
.chip .pto{width:8px; height:8px; border-radius:50%; background:currentColor; flex:none;}
body{--banda-tinta:#113c42; --banda-velo:linear-gradient(90deg,rgba(252,254,254,.85) 0%,rgba(252,254,254,.45) 45%,rgba(252,254,254,0) 70%); --chip-fondo:rgba(255,255,255,.55); --chip-borde:#9cc3c7;}
body.pub-padres{--banda-tinta:#2e2a26; --banda-velo:linear-gradient(90deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 55%); --chip-fondo:#fdf6f1; --chip-borde:#e4b79e;}
body.pub-nino{--accent:#ff7a6b; --accent-dark:#20618a; --accent-soft:#e3f2fb; --surface:#f7fcff; --border:#bfe3f7; --campo:#f7fcff; --banda-tinta:#2b2d42; --banda-velo:linear-gradient(90deg,rgba(227,242,251,.75) 0%,rgba(227,242,251,.3) 45%,rgba(227,242,251,0) 65%); --chip-fondo:rgba(255,255,255,.7); --chip-borde:#8fcbee;}
body.pub-nino h1{font-weight:800;}
body.pub-adolescente{--accent:#c86d51; --accent-dark:#2b3a4a; --accent-soft:#e9eef3; --surface:#f6f8fa; --border:#dde4ea; --campo:#fbfcfd; --banda-tinta:#f4f7f9; --banda-velo:linear-gradient(90deg,rgba(24,36,48,.55) 0%,rgba(24,36,48,.2) 45%,rgba(24,36,48,0) 65%); --chip-fondo:rgba(18,28,38,.4); --chip-borde:rgba(244,247,249,.5);}
body.pub-adolescente h1{font-family:var(--font-body); font-weight:800; letter-spacing:-.015em;}
body.pub-adolescente .banda h1{text-shadow:0 1px 6px rgba(10,20,30,.45);}
@media (max-width:700px){ .banda{aspect-ratio:auto; min-height:168px; padding:22px 18px 18px; border-radius:14px;} .banda h1{max-width:100%;} }
@media (max-width:700px){ body.pub-padres{--banda-velo:linear-gradient(90deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.7) 55%,rgba(255,255,255,.15) 100%);} }
@media print{ .banda{min-height:0; padding:0 0 8px; border-radius:0; color:var(--ink);} .banda .fondo,.banda .velo{display:none !important;} .chip{border-color:#999; background:transparent;} }
.termo{display:grid; gap:8px; margin:12px 0;}
.termo .nivel{display:grid; grid-template-columns:150px 1fr; gap:10px; align-items:start; border-radius:10px; padding:8px 10px; border-left:8px solid;}
.termo .nivel b{font-size:14px;} .termo .nivel small{display:block; font-size:12px; color:var(--ink-soft);}
.escalera{display:flex; flex-direction:column-reverse; gap:6px; margin:12px 0;}
.escalera .peldano{display:flex; gap:8px; align-items:center;}
.escalera .peldano span{flex:none; width:30px; height:30px; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center;}
.dibujo{margin:12px 0; border:1px dashed var(--accent); border-radius:12px; padding:10px;}
.dibujo p{margin:0 0 6px; color:var(--ink-soft);}
.dibujo canvas{width:100%; height:240px; background:#fff; border:1px solid var(--border); border-radius:8px; touch-action:none; display:block;}
.dibujo .dib-acc{display:flex; gap:8px; margin:6px 0;}
.grafico{margin:12px 0;}
.grafico .ejes{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px; margin:8px 0;}
.grafico label{font-size:12px; color:var(--ink-soft);}
.grafico svg{width:100%; height:180px; background:#fff; border:1px solid var(--border); border-radius:8px;}
.franja{margin:12px 0; text-align:center;} .franja img{max-width:100%; height:auto;}
.franja .rots{display:grid; gap:6px; font-size:13px; color:var(--ink-soft);}
@media (max-width:700px){ .termo .nivel{grid-template-columns:1fr;} }
@media (max-width:700px){ .paso{flex-direction:column;} .paso img{width:100%; max-width:240px; align-self:center;} .pasos,.galeria{grid-template-columns:1fr !important;} .casillas{grid-template-columns:1fr !important;} }
/* Solo se imprime un registro diligenciado y desde su botón (body[data-imprimir]); las guías,
   los guiones y los registros incompletos no se imprimen ni con Ctrl+P. Las filas vacías no salen. */
.wrap{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
.wrap img{pointer-events:none; -webkit-user-drag:none;}
.wrap textarea,.wrap input{-webkit-user-select:text; user-select:text;}
.bt:disabled{opacity:.45; cursor:not-allowed; background:var(--bg);}
.falta{font-size:12.5px; color:var(--ink-soft); align-self:center;}
@media print{
  body:not([data-imprimir]) .wrap{display:none !important;}
  body:not([data-imprimir])::before{content:"Esta ficha se consulta en línea y no se puede imprimir. Un registro se exporta desde la página cuando está diligenciado."; display:block; padding:40px; font:16px sans-serif;}
  tr.vacia{display:none !important;}
}
@media print{ .acciones,.aviso-p{display:none !important;} body{font-size:12px;} .wrap{padding:0;} textarea{background:#fff; border-color:#999;} .tabla{display:table !important;} .tabla thead{display:table-header-group !important;} .tabla tr{display:table-row !important;} .tabla td{display:table-cell !important;} .tabla td::before{content:none !important;} }
@page{margin:14mm;}
</style>
</head>
<body>
<div class="wrap" id="app"><p>Cargando la ficha…</p></div>
<noscript><p style="padding:20px">Esta ficha necesita JavaScript. Ábrala en el navegador del celular o del computador.</p></noscript>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const app = $("#app");
const CLASES = {
  registro: { cab: "Ficha de trabajo", como: "Cómo se llena", pie: "Ficha elaborada" },
  guia: { cab: "Guía de práctica", como: "Antes de empezar", pie: "Guía elaborada" },
  guion: { cab: "Guion para el terapeuta", como: "Preparación", pie: "Guion elaborado" }
};
const GUIAS = { adultos: "la guía de planes de intervención", infancia: "la guía de planes de niños y adolescentes" };
const PUBLICOS = { adultos: "Para adultos", nino: "Para niños", adolescente: "Para adolescentes", padres: "Para padres" };
let nCampo = 0;
let IMGDIR = "fichas-web/img/";
const COLORES_TERMO = ["#3f9b5a", "#c9b03a", "#e08a2e", "#c8452f", "#8e2a6b"];
const linea = etq => '<input type="text" aria-label="' + esc(etq) + '" name="c' + (++nCampo) + '">';
const area = (etq, lineas) => '<textarea aria-label="' + esc(etq) + '" rows="' + Math.max(2, Math.min(14, lineas || 2)) + '" name="c' + (++nCampo) + '"></textarea>';

const BLOQUES = {
  campos: b => b.campos.map(([etq, lineas], i) => '<label class="c">' + esc(etq) + '</label>' + ((b.breves || [])[i] ? linea(etq) : area(etq, lineas))).join(""),
  tabla: b => {
    const cols = b.cols.map(c => Array.isArray(c) ? c : [c, 1]);
    const total = cols.reduce((s, c) => s + (c[1] || 1), 0);
    const fijas = b.fijas || [];
    let h = '<table class="tabla"><colgroup>' + cols.map(c => '<col style="width:' + ((c[1] || 1) / total * 100).toFixed(1) + '%">').join("") + '</colgroup>' +
      '<thead><tr>' + cols.map(c => '<th>' + esc(c[0]) + '</th>').join("") + '</tr></thead><tbody>';
    const filas = Math.max(b.filas || 1, fijas.length);
    for (let i = 0; i < filas; i++){
      h += '<tr>' + cols.map((c, j) => (j === 0 && fijas[i] !== undefined)
        ? '<td class="fija" data-col="' + esc(c[0]) + '">' + esc(fijas[i]) + '</td>'
        : '<td data-col="' + esc(c[0]) + '">' + ((b.breves || [])[j] ? linea(c[0]) : area(c[0], 1)) + '</td>').join("") + '</tr>';
    }
    return h + '</tbody></table>';
  },
  casillas: b => '<div class="casillas" style="grid-template-columns:repeat(' + (b.cols || 1) + ',minmax(0,1fr))">' +
    b.items.map(it => '<label><input type="checkbox" name="c' + (++nCampo) + '"><span>' + esc(it) + '</span></label>').join("") + '</div>',
  titulo: b => '<h2 class="tit">' + esc(b.texto) + '</h2>',
  nota: b => '<p class="nota">' + esc(b.texto) + '</p>',
  lista: b => '<div class="lista">' + (b.titulo ? '<b>' + esc(b.titulo) + '</b>' : '') + (b.numerada ? '<ol>' : '<ul>') +
    b.items.map(it => '<li>' + esc(it) + '</li>').join("") + (b.numerada ? '</ol>' : '</ul>') + '</div>',
  aviso: b => '<div class="cuidado">' + (b.titulo ? '<b>' + esc(b.titulo) + '</b>' : '') + esc(b.texto) + '</div>',
  pasos: b => '<div class="pasos" style="grid-template-columns:repeat(' + Math.min(b.cols || 1, 2) + ',minmax(0,1fr))">' +
    b.pasos.map((p, i) => '<div class="paso">' + (p.img ? '<img src="' + IMGDIR + esc(p.img) + '" alt="" loading="lazy">' : '') +
      '<div><span class="n">' + (i + 1) + '</span><b>' + esc(p.titulo || "") + '</b><p>' + esc(p.texto || "") + '</p></div></div>').join("") + '</div>',
  galeria: b => (b.titulo ? '<h2 class="tit">' + esc(b.titulo) + '</h2>' : '') +
    '<div class="galeria" style="grid-template-columns:repeat(' + Math.min(b.cols || 2, 3) + ',minmax(0,1fr))">' +
    (b.imagenes || []).map((im, i) => '<figure><img src="' + IMGDIR + esc(im) + '" alt="" loading="lazy"><figcaption>' + esc((b.rotulos || [])[i] || "") + '</figcaption></figure>').join("") + '</div>',
  termometro: b => (b.pregunta ? '<p class="nota">' + esc(b.pregunta) + '</p>' : '') + '<div class="termo">' +
    b.niveles.slice().reverse().map(([de, a, rot], i, arr) => {
      const col = COLORES_TERMO[Math.min(arr.length - 1 - i, COLORES_TERMO.length - 1)];
      return '<div class="nivel" style="border-color:' + col + ';background:' + col + '14"><div><b>' + esc(de) + ' a ' + esc(a) + '</b><small>' + esc(rot) + '</small></div>' + area(rot, 2) + '</div>';
    }).join("") + '</div>',
  escalera: b => (b.etiqueta ? '<p class="nota">' + esc(b.etiqueta) + '</p>' : '') + '<div class="escalera">' +
    Array.from({ length: b.peldanos || 5 }, (_, i) => '<div class="peldano" style="margin-left:' + (i * 4) + '%"><span>' + (i + 1) + '</span>' + linea("Peldaño " + (i + 1)) + '</div>').join("") + '</div>',
  dibujo: b => '<div class="dibujo"><p>' + esc(b.texto || "") + '</p><canvas aria-label="Espacio para dibujar"></canvas>' +
    '<div class="dib-acc"><button type="button" class="bt dib-borrar">Borrar el dibujo</button></div>' +
    '<label class="c">O escríbelo aquí</label>' + area(b.texto || "dibujo", 2) + '</div>',
  semana: b => BLOQUES.tabla({ cols: [[b.col1 || "", 3]].concat(["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"].map(d => [d, 1])),
    filas: b.filas || 3, breves: [false, true, true, true, true, true, true, true] }),
  grafico: b => '<div class="grafico">' + (b.nota_eje ? '<p class="nota">' + esc(b.nota_eje) + '</p>' : '') +
    '<div class="ejes">' + Array.from({ length: b.semanas || 10 }, (_, i) => '<label>Semana ' + (i + 1) + '<input type="text" inputmode="decimal" aria-label="' +
      esc((b.eje_y || "Puntaje") + ", semana " + (i + 1)) + '" name="c' + (++nCampo) + '"></label>').join("") + '</div><svg viewBox="0 0 400 180" preserveAspectRatio="none"></svg></div>',
  imagen: b => '<div class="franja"><img src="' + IMGDIR + esc(b.archivo) + '" alt="">' +
    '<div class="rots" style="grid-template-columns:repeat(' + Math.max(1, (b.rotulos || []).length) + ',1fr)">' + (b.rotulos || []).map(r => '<span>' + esc(r) + '</span>').join("") + '</div></div>',
  guion: b => '<div class="guion">' + b.partes.map(p => typeof p === "string"
      ? '<p>' + esc(p.replace(/\s*\[p\]\s*$/, "")) + (/\[p\]\s*$/.test(p) ? '<span class="pausa">· PAUSA ·</span>' : '') + '</p>'
      : '<p class="indica">' + esc(p.indica || "") + '</p>').join("") + '</div>'
};

function pintar(f, guia){
  const k = CLASES[f.clase] || CLASES.registro;
  IMGDIR = guia === "infancia" ? "fichas-web/img-infancia/" : "fichas-web/img/";
  document.body.classList.toggle("infancia", guia === "infancia");
  document.body.classList.toggle("nino", f.publico === "nino");
  const pub = guia === "infancia" ? (PUBLICOS[f.publico] ? f.publico : "nino") : "adultos";
  Object.keys(PUBLICOS).forEach(p => document.body.classList.remove("pub-" + p));
  document.body.classList.add("pub-" + pub);
  document.title = f.titulo + " · Ficha en línea";
  const il = f.ilustracion;
  let h = '<header class="banda"><img class="fondo" src="fichas-web/bandas/' + pub + '.jpg" alt="">' +
    '<div class="velo"></div><span class="chip"><span class="pto"></span>' + k.cab + '</span>' +
    '<h1>' + esc(f.titulo) + '</h1>' + (f.enfoque ? '<div class="enfoque">' + esc(f.enfoque) + '</div>' : '') + '</header>';
  h += '<div class="cab"><div class="txt">' +
    '<div class="sec">Para qué sirve</div><p class="para">' + esc(f.para) + '</p>' +
    (f.como && f.como.length ? '<div class="sec">' + k.como + '</div><ul class="como">' + f.como.map(c => '<li>' + esc(c) + '</li>').join("") + '</ul>' : '') +
    (f.ilustracion_como ? '<div class="franja"><img src="' + IMGDIR + esc(f.ilustracion_como.archivo) + '" alt=""><div class="rots" style="grid-template-columns:repeat(' +
      Math.max(1, (f.ilustracion_como.rotulos || []).length) + ',1fr)">' + (f.ilustracion_como.rotulos || []).map(r => '<span>' + esc(r) + '</span>').join("") + '</div></div>' : '') +
    '</div>' + (il ? '<div class="ilus"><img src="' + IMGDIR + esc(il.archivo) + '" alt="">' +
      (il.rotulos || []).map(r => '<small>' + esc(Array.isArray(r) ? r[0] : r) + '</small>').join("") + '</div>' : '') + '</div>';
  const registro = f.clase === "registro" || !f.clase;
  if (registro)
    h += '<div class="aviso-p">Lo que escriba no se envía ni se guarda: al cerrar o recargar la página se borra. Cuando termine de llenarla, ' +
      'use «Exportar ficha diligenciada» para guardarla o imprimirla.</div>' +
      '<div class="acciones"><button class="bt" id="exportar" disabled>Exportar ficha diligenciada</button><button class="bt" id="borrar">Borrar lo escrito</button>' +
      '<span class="falta" id="falta"></span></div>';
  else
    h += '<div class="aviso-p">Esta ' + (f.clase === "guion" ? 'guía para el terapeuta' : 'guía') + ' se consulta en línea mientras el enlace esté vigente.</div>';
  if (registro)
    h += '<div class="datos"><div><label class="c">Nombre</label><input type="text" name="nombre"></div>' +
      '<div><label class="c">Fecha</label><input type="text" name="fecha"></div><div><label class="c">Sesión</label><input type="text" name="sesion"></div></div>';
  h += f.bloques.map(b => (BLOQUES[b.t] || (() => ""))(b)).join("");
  h += '<div class="pie">Fuente: ' + esc(f.fuente || "") + '<br>' + k.pie + ' por Juan Boya Guerra para ' + (GUIAS[guia] || GUIAS.adultos) + '.</div>';
  app.innerHTML = h;
  document.body.classList.remove("exportable");
  app.querySelectorAll(".dibujo canvas").forEach(prepararDibujo);
  app.querySelectorAll(".grafico").forEach(g => g.addEventListener("input", () => graficar(g)));
  if (registro){ app.addEventListener("input", revisar); revisar(); }
  // Las casillas de las tablas crecen con el texto.
  app.querySelectorAll(".tabla textarea").forEach(t => t.addEventListener("input", () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }));
}

/* Un registro se puede exportar cuando está diligenciado: nombre y fecha, todos los
   campos de texto y, en cada tabla, al menos una fila completa. */
const lleno = el => el.value.trim() !== "";
function revisar(){
  const faltan = [];
  ["nombre", "fecha"].forEach(n => { const el = app.querySelector('[name="' + n + '"]'); if (el && !lleno(el)) faltan.push(n === "nombre" ? "el nombre" : "la fecha"); });
  const sueltos = [...app.querySelectorAll("textarea,input[type=text]")].filter(el => !el.closest(".tabla") && !el.closest(".datos") && !el.closest(".grafico") && !el.closest(".dibujo"));
  app.querySelectorAll(".dibujo").forEach(d => { if (!d.dataset.trazos && !lleno(d.querySelector("textarea"))) faltan.push("el dibujo o su descripción"); });
  app.querySelectorAll(".grafico").forEach(g => { if (![...g.querySelectorAll("input")].some(lleno)) faltan.push("al menos un punto en el gráfico"); });
  const vaciosC = sueltos.filter(el => !lleno(el)).length;
  if (vaciosC) faltan.push(vaciosC + (vaciosC === 1 ? " campo de texto" : " campos de texto"));
  let tablasSin = 0;
  app.querySelectorAll(".tabla").forEach(t => {
    let completa = false;
    t.querySelectorAll("tbody tr").forEach(tr => {
      const cel = [...tr.querySelectorAll("textarea,input")];
      const algo = cel.some(lleno);
      tr.classList.toggle("vacia", !algo);
      if (cel.length && cel.every(lleno)) completa = true;
    });
    if (!completa) tablasSin++;
  });
  if (tablasSin) faltan.push(tablasSin === 1 ? "una fila completa en la tabla" : "una fila completa en " + tablasSin + " tablas");
  const listo = faltan.length === 0;
  document.body.classList.toggle("exportable", listo);
  const bt = document.getElementById("exportar");
  if (bt) bt.disabled = !listo;
  const f = document.getElementById("falta");
  if (f) f.textContent = listo ? "Lista para exportar." : "Para exportar falta: " + faltan.join(", ") + ".";
}
// Espacio para dibujar con el dedo o el ratón.
function prepararDibujo(cv){
  const caja = cv.closest(".dibujo"), ctx = cv.getContext("2d");
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(1, r.width) * devicePixelRatio; cv.height = Math.max(1, r.height) * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#16232b";
  let pintando = false;
  const pos = ev => { const q = cv.getBoundingClientRect(); return [ev.clientX - q.left, ev.clientY - q.top]; };
  cv.addEventListener("pointerdown", ev => { pintando = true; cv.setPointerCapture(ev.pointerId); ctx.beginPath(); ctx.moveTo(...pos(ev)); });
  cv.addEventListener("pointermove", ev => { if (!pintando) return; ctx.lineTo(...pos(ev)); ctx.stroke(); caja.dataset.trazos = "1"; });
  cv.addEventListener("pointerup", () => { pintando = false; if (typeof revisar === "function") revisar(); });
  caja.querySelector(".dib-borrar").addEventListener("click", () => { ctx.clearRect(0, 0, cv.width, cv.height); delete caja.dataset.trazos; revisar(); });
}
// El gráfico de avance se dibuja con los puntajes que se escriben.
function graficar(g){
  const vals = [...g.querySelectorAll("input")].map(i => parseFloat(i.value.replace(",", ".")));
  const ok = vals.map((v, i) => [i, v]).filter(([, v]) => !isNaN(v));
  const svg = g.querySelector("svg");
  if (!ok.length){ svg.innerHTML = ""; return; }
  const max = Math.max(...ok.map(q => q[1]), 1), n = vals.length;
  const x = i => 20 + i * (360 / Math.max(1, n - 1)), y = v => 165 - v / max * 145;
  svg.innerHTML = '<polyline fill="none" stroke="currentColor" stroke-width="2" points="' + ok.map(([i, v]) => x(i) + "," + y(v)).join(" ") + '"/>' +
    ok.map(([i, v]) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="4" fill="currentColor"/>').join("");
  svg.style.color = getComputedStyle(document.body).getPropertyValue("--accent");
}
// El texto de la ficha no se copia; los campos sí (lo que la persona escribe es suyo).
["copy", "cut", "dragstart", "selectstart", "contextmenu"].forEach(t => document.addEventListener(t, ev => { if (!ev.target.closest || !ev.target.closest("textarea,input")) ev.preventDefault(); }));
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && /^[psc]$/i.test(ev.key) && !(ev.target.closest && ev.target.closest("textarea,input"))) ev.preventDefault();
});
// Solo «Exportar ficha diligenciada» imprime (y solo con el registro completo); Ctrl+P o el menú del navegador imprimen un aviso.
window.addEventListener("afterprint", () => { delete document.body.dataset.imprimir; });
document.addEventListener("click", ev => {
  if (ev.target.id === "exportar" && document.body.classList.contains("exportable")){ document.body.dataset.imprimir = "1"; window.print(); }
  if (ev.target.id === "borrar" && confirm("¿Borrar todo lo escrito en esta ficha?")){
    app.querySelectorAll("textarea,input[type=text]").forEach(t => { t.value = ""; t.style.height = ""; });
    app.querySelectorAll("input[type=checkbox]").forEach(c => { c.checked = false; });
    revisar();
  }
});
window.addEventListener("beforeunload", ev => {
  if ([...app.querySelectorAll("textarea,input[type=text]")].some(t => t.value.trim())){ ev.preventDefault(); ev.returnValue = ""; }
});

async function cargar(clave, guia){
  const r = await fetch("fichas-web/" + guia + "/" + encodeURIComponent(clave) + ".json", { cache: "no-cache" });
  if (!r.ok) throw new Error("no existe");
  return r.json();
}

/* Acceso: con un código de cupo (?c=…, de un plan compartido por Juan Boya), que se gasta al
   pulsar «Comenzar», o con la dirección directa (?f=…) solo en el navegador donde Juan Boya
   activó sus botones de compartir. El Apps Script es el de «Envio a Sheets/enlaces-unico-uso». */
const ENLACES_URL = "https://script.google.com/a/macros/areandina.edu.co/s/AKfycbxJeqxsv7s-pRqceQKfOq4JJ7jwlAtm4C-3t1kQlu2CjId3y99QuGesx4Ly7LHNyUrB/exec";
const CUPO_GUARDA = "ficha-cupo-";
const esDocente = () => { try { return !!localStorage.getItem("calificar-enlaces-secreto"); } catch (e) { return false; } };
function jsonp(params){
  return new Promise((ok, mal) => {
    const cb = "cb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const fin = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { fin(); mal(new Error("sin respuesta")); }, 20000);
    window[cb] = r => { fin(); ok(r); };
    s.onerror = () => { fin(); mal(new Error("sin conexión")); };
    s.src = ENLACES_URL + "?" + new URLSearchParams({ ...params, callback: cb });
    document.head.appendChild(s);
  });
}
async function abrirDe(a){
  const m = /^ficha:(adultos|infancia):([a-z0-9-]{1,80})$/.exec(a || "");
  if (!m) throw new Error("no es una ficha");
  pintar(await cargar(m[2], m[1]), m[1]);
}
function portadaCupo(token){
  const guardada = (() => { try { return sessionStorage.getItem(CUPO_GUARDA + token); } catch (e) { return null; } })();
  if (guardada){ abrirDe(guardada).catch(() => {}); return; }
  app.innerHTML = '<div class="rotulo">Ficha en línea</div><h1>Ficha compartida por Juan Boya</h1>' +
    '<p class="para">Este código tiene un número limitado de usos y una fecha de vencimiento. Al pulsar «Comenzar» se abre la ficha en esta pestaña y se descuenta un uso.</p>' +
    '<div class="acciones"><button class="bt" id="comenzar">Comenzar</button></div><p class="error" id="cupo-error" hidden></p>';
  $("#comenzar").addEventListener("click", async ev => {
    const bt = ev.target, err = $("#cupo-error");
    const fallo = t => { err.textContent = t; err.hidden = false; bt.disabled = false; bt.textContent = "Comenzar"; };
    bt.disabled = true; bt.textContent = "Abriendo…";
    try {
      const r = await jsonp({ accion: "usar", token });
      if (!r.ok || !r.cupo) return fallo(r.motivo === "agotado" ? "Este código ya alcanzó su número de usos. Si lo necesita, pida a Juan Boya uno nuevo."
        : r.motivo === "vencido" ? "Este código venció. Pida a Juan Boya uno nuevo." : "Este código no existe. Revise que lo escaneó completo.");
      try { sessionStorage.setItem(CUPO_GUARDA + token, r.a); } catch (e) {}
      await abrirDe(r.a);
    } catch (e) { fallo("No se pudo abrir la ficha (" + e.message + "). Revise la conexión e inténtelo de nuevo."); }
  });
}

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("c")) return portadaCupo(q.get("c"));
  const clave = q.get("f"), guia = q.get("g") === "infancia" ? "infancia" : "adultos";
  if (!clave || !/^[a-z0-9-]{1,80}$/.test(clave) || !esDocente()){
    app.innerHTML = '<h1>Ficha en línea</h1><p class="para">Para abrir una ficha, use el enlace o el código QR que recibió de Juan Boya.</p>';
    return;
  }
  try { pintar(await cargar(clave, guia), guia); }
  catch (e){ app.innerHTML = '<h1>Ficha en línea</h1><p class="error">No se encontró esta ficha. Revise que el enlace esté completo.</p>'; }
})();
</script>
